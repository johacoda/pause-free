<style>
  :root{
    --red:#c0392b; --ink:#0D0D0B; --white:#FAFAFA; --grey:#F2F2F0;
    --purple:#3c3158; --faint:rgba(13,13,11,0.08); --faint2:rgba(13,13,11,0.12);
    --redtint:#f6e6e4; --page:#E9E9E6; --accent-lt:rgba(60,49,88,.06);
    --act:#c0392b; --actx:#c0392b;
    --mute:rgba(13,13,11,.6); --mute2:rgba(13,13,11,.42); --mute3:rgba(13,13,11,.28);
    --t1:#efeaf3; --t2:#f7e9e4; --t3:#eae7f0; --m1:#6d6299; --m2:#c0392b; --m3:#3c3158;
    --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --maxw:480px;
  }
  .dark{
    --red:#d84b31; --ink:#F3EFE8; --white:#1b1813; --grey:#282320;
    --purple:#9c93b8; --faint:rgba(243,239,232,0.10); --faint2:rgba(243,239,232,0.17);
    --redtint:#241f33; --page:#0f0d0a; --accent-lt:rgba(156,147,184,.14);
    --act:#6d6299; --actx:#a79dc6;
    --mute:rgba(243,239,232,.62); --mute2:rgba(243,239,232,.42); --mute3:rgba(243,239,232,.3);
    --t1:rgba(156,147,184,.13); --t2:rgba(216,120,90,.15); --t3:rgba(156,147,184,.08); --m1:#9c93b8; --m2:#d84b31; --m3:#9c93b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--page);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;justify-content:center}
  #frame{width:100%;max-width:var(--maxw);background:linear-gradient(to bottom,#3c3158 0%,#574a7d 46%,#8b7fae 74%,#d8cfe4 100%);position:relative;
    min-height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  .dark #frame{background:linear-gradient(to bottom,#3c3158 0%,#2f2748 30%,#201b2d 64%,#171310 100%)}
  @media(min-width:520px){
    body{align-items:center;padding:22px 0}
    #frame{min-height:min(880px,calc(100dvh - 44px));height:min(880px,calc(100dvh - 44px));
      border-radius:20px;box-shadow:0 1px 0 var(--faint)}
  }
  #app{flex:1;position:relative;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:transparent}
  .screen{min-height:100%;padding:0 22px;display:flex;flex-direction:column;background:rgba(250,250,250,.7);
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
  .dark .screen{background:rgba(27,24,19,.64)}
  .ob-flow{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}/* onboarding rides the gradient; content screens are frosted glass */
  .pausescreen{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}/* pause screen stays clear so the draining-water canvas shows through */
  /* the pause is a focused, immersive moment: a deep backdrop in both themes so the draining water pops and every label reads in light cream */
  /* light mode: a soft, light backdrop consistent with the rest of the app — the draining water reads as a warm rose and the normal dark text stays legible */
  .pausing #frame{background:linear-gradient(to bottom,#f2ecf5 0%,#eae1ef 48%,#e4d9e8 100%)}
  /* dark mode: a deep, immersive backdrop so the water glows; text turns light */
  .pausing.dark #frame{background:linear-gradient(to bottom,#1a1526 0%,#171221 42%,#14101b 74%,#100d16 100%)}
  .pausing.dark .pausescreen .grey{color:rgba(243,239,232,.72)}
  .pausing.dark .pausescreen .ink,.pausing.dark .pausescreen .label.ink{color:#F3EFE8}
  .pausing.dark .pausescreen #pzclock{color:rgba(243,239,232,.8)}
  .pausing.dark .pausescreen #pzmsg{color:rgba(243,239,232,.92)}
  .pausing.dark .pausescreen .tlink{color:rgba(243,239,232,.66)}
  .safe{height:env(safe-area-inset-top,0)}

  h1,h2,h3{letter-spacing:-0.02em;line-height:1.12;color:var(--purple)}
  h1{font-size:32px;font-weight:800}
  h2{font-size:24px;font-weight:800}
  h3{font-size:18px;font-weight:700}
  .lede{font-size:16px;font-weight:400;line-height:1.6;color:var(--ink)}
  p{line-height:1.6}
  .body{font-size:15px;line-height:1.65}
  .grey{color:var(--mute)}
  .label{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--actx);display:block}
  .label.ink{color:var(--mute2)}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    height:52px;border-radius:10px;font-size:15px;font-weight:700;letter-spacing:.01em;transition:background .15s,opacity .15s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
  .btn-red{background:var(--act);color:#fff}
  .btn-red:active{opacity:.85}
  .btn-ink{background:var(--ink);color:var(--white)}
  .btn-ghost{background:rgba(255,255,255,.16);color:var(--ink);border:1px solid var(--faint2);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .dark .btn-ghost{background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  /* the frost + fade live on a ::before layer so the button on top stays crisp and flat, matching the dashboard's "Time to pause" */
  .actionbar::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
    background:linear-gradient(to top,rgba(216,207,228,.86),rgba(216,207,228,0));
    -webkit-mask-image:linear-gradient(to top,#000 58%,transparent);mask-image:linear-gradient(to top,#000 58%,transparent)}
  .dark .actionbar::before{background:linear-gradient(to top,rgba(23,19,16,.9),rgba(23,19,16,0))}
  .actionbar>*{position:relative;z-index:1}
  .btn[disabled]{opacity:.3;pointer-events:none}
  .btn-sm{height:46px;font-size:14px}
  .tlink{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
    background:none;padding:12px;width:100%;text-align:center}
  .tlink.grey{color:var(--mute)}
  .btn-text{display:inline-block;font-weight:700;text-transform:uppercase;color:var(--ink);
    background:none;border:none;border-bottom:2px solid var(--ink);padding:0 0 2px}
  .arrow{width:15px;height:15px}

  .card{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:18px;-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%)}
  .dark .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .pane-purple{background:var(--purple);border-radius:14px;padding:20px;color:var(--white)}
  .pane-purple .label{color:var(--white);opacity:.7}
  /* subtle stat line: purple labels, values beneath, fine dividers, no fill */
  .statline{display:flex}
  .statline>div{flex:1;padding:0 14px}
  .statline>div:first-child{padding-left:0}
  .statline>div:last-child{padding-right:0}
  .statline>div+div{border-left:1px solid var(--faint)}
  .statline .sk{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--purple)}
  .statline .sv{font-size:30px;font-weight:800;color:var(--ink);margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
  .statline .sv small{font-size:13px;font-weight:600;color:var(--mute2);margin-left:2px}

  /* redesigned home + welcome: sun-and-waves hero, cream sheet, tinted stat tiles */
  .home{min-height:100%;display:flex;flex-direction:column;position:relative}
  .hero{position:relative;background:#3c3158;overflow:hidden}
  .hero-d{flex:0 0 auto;height:250px}
  .hero-w{flex:1 1 auto}
  .herowave{position:absolute;left:0;bottom:0;width:100%;display:block}
  .hero-sun{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f0a878,#e07a4e);overflow:hidden;
    --halo:rgba(240,140,78,.55);--halo2:rgba(240,140,78,.28);animation:orbHalo 5s ease-in-out infinite}
  .hero-sun.moon{background:radial-gradient(circle at 32% 45%,#eef0f7,#c9c2dd);--halo:rgba(222,228,248,.5);--halo2:rgba(198,208,240,.26)}
  .hero-sun.moon::before{content:'';position:absolute;width:100%;height:100%;border-radius:50%;background:#3c3158;top:-16%;left:34%}
  @keyframes orbHalo{0%,100%{box-shadow:0 0 16px 3px var(--halo),0 0 32px 9px var(--halo2)}50%{box-shadow:0 0 28px 9px var(--halo),0 0 54px 20px var(--halo2)}}
  @media (prefers-reduced-motion:reduce){.hero-sun{animation:none;box-shadow:0 0 22px 6px var(--halo),0 0 40px 12px var(--halo2)}}
  .hero-toggles{position:absolute;top:calc(env(safe-area-inset-top,0) + 12px);right:14px;display:flex;gap:2px;z-index:3}
  .hero-toggles button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#c9c1e0}
  .d-head{position:absolute;top:calc(env(safe-area-inset-top,0) + 40px);left:22px;right:22px;z-index:2}
  .d-hi{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#c9c1e0}
  .d-name{font-size:34px;font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1;color:#FAFAFA}
  .d-sub{color:#c9c1e0;font-size:14px;margin-top:12px;max-width:17em;line-height:1.45}
  .hsheet{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;background:rgba(250,250,250,.72);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);margin-top:-24px;border-radius:24px 24px 0 0;padding:22px 22px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .dark .hsheet{background:rgba(27,24,19,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .stats{display:flex;gap:9px}
  .stat{position:relative;flex:1;height:104px;border-radius:16px;overflow:hidden;padding:13px 11px}
  .stat .n{font-size:26px;font-weight:800;color:var(--ink);line-height:1;position:relative;z-index:2;font-variant-numeric:tabular-nums}
  .stat .k{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mute2);margin-top:6px;position:relative;z-index:2;white-space:nowrap}
  .stat svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:44px;display:block}
  .stat.s1{background:var(--t1)} .stat.s2{background:var(--t2)} .stat.s3{background:var(--t3)}
  .hero-copy{position:absolute;top:calc(env(safe-area-inset-top,0) + 40px);left:26px;right:26px;text-align:center;z-index:2}
  .gazer{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:128%;height:auto;z-index:1;pointer-events:none}
  .fignight{display:none}
  .dark .figday{display:none}
  .dark .fignight{display:block}
  .hero-eyebrow{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#c9c1e0}
  .hero-mark{display:block;margin:0 auto 4px;width:94px;height:auto}
  .ob-illus{width:190px;height:auto;display:block;margin:0 auto}
  .ob-namebg{flex:1;position:relative;margin:0 -22px;padding:9vh 22px 0;overflow:hidden;background:transparent}
  /* onboarding sits on the app gradient; keep the top text light so it reads on purple */
  .ob-flow h1{color:#F3EFE8}
  .ob-flow .grey{color:rgba(243,239,232,.72)}
  .ob-flow input[type=text]{color:#F3EFE8;border-bottom-color:rgba(255,255,255,.34);caret-color:#fff}
  .ob-flow input[type=text]::placeholder{color:rgba(243,239,232,.5)}
  .ob-flow input[type=text]:focus{border-bottom-color:#fff}
  .ob-flow input[type=text].planinput{color:#F3EFE8}/* beat the .planinput dark color inside onboarding */
  .ob-flow .planlabel{color:#F3EFE8}
  .ob-flow .planlabel b{color:#cdc0f2}
  .ob-bg{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;z-index:0;display:block}
  .dark .ob-bg.figday{display:none}
  .ob-fig{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:128%;height:auto;z-index:0}
  .ob-namebg-top{position:relative;z-index:2}
  .hero-title{font-size:58px;font-weight:300;line-height:.98;letter-spacing:-.03em;color:#FAFAFA;margin-top:22px}
  .hero-title .wv{font-weight:inherit;font-style:normal}
  .rotline{display:inline-block;transition:opacity .9s ease-in-out}
  .rotline.fade{opacity:0}
  .welcome-sheet{flex:0 0 auto;align-items:center;text-align:center;padding-bottom:calc(30px + env(safe-area-inset-bottom,0));
    background:linear-gradient(to bottom,rgba(250,246,238,.44),rgba(250,246,238,.26));
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
    border-top:1px solid rgba(255,255,255,.6);
    box-shadow:0 -12px 34px rgba(28,18,48,.20),inset 0 1px 0 rgba(255,255,255,.55)}
  .welcome-sheet .w-sub{color:#4c3c22}
  .welcome-sheet .btn-text{color:#5f4a2c}
  .dark .welcome-sheet{background:linear-gradient(to bottom,rgba(26,22,34,.52),rgba(26,22,34,.34));border-top-color:rgba(255,255,255,.16);
    box-shadow:0 -12px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
  .dark .welcome-sheet .w-sub{color:rgba(243,239,232,.86)}
  .dark .welcome-sheet .btn-text{color:rgba(243,239,232,.8)}
  .w-sub{color:var(--mute);font-size:16px;line-height:1.5;margin:0 auto 22px;max-width:20em}
  /* settings controls */
  .themesw{position:relative;width:64px;height:34px;border-radius:18px;background:var(--grey);border:none;cursor:pointer;display:block}
  .themesw .knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .themesw.on .knob{transform:translateX(30px)}
  .themesw .knob svg{width:16px;height:16px}
  .iconrow{display:flex;gap:10px}
  .icontab{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;background:var(--grey);border:none;cursor:pointer}
  .icontab svg{width:22px;height:22px;color:var(--purple)}
  .icontab span{font-size:12px;font-weight:600;color:var(--mute)}
  .erasebtn{display:inline-flex;align-items:center;gap:8px;background:none;border:none;color:var(--actx);font-size:14px;font-weight:600;padding:8px 0;cursor:pointer}
  .erasebtn svg{width:17px;height:17px}
  .divider{height:1px;background:var(--faint)}

  .chip{padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;color:var(--ink);
    background:var(--grey);white-space:nowrap;transition:all .12s;border:1px solid transparent}
  .chip.on{background:var(--purple);color:var(--white)}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px}
  .lenrow{display:flex;gap:8px}
  .lenchip{flex:1;text-align:center;padding:13px 0;font-size:15px;font-weight:600}
  /* if-then plan items */
  .planitem{margin-bottom:24px}
  .planlabel{font-size:15px;font-weight:600;color:var(--ink);margin-bottom:10px;line-height:1.4}
  .planlabel b{font-weight:800;color:var(--purple)}
  input[type=text].planinput{font-size:16px;font-weight:500;color:var(--ink)}
  .sugrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .sugchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:22px;background:var(--grey);
    border:1px solid transparent;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;transition:all .12s}
  .sugchip svg{width:15px;height:15px;color:var(--purple)}
  .sugchip:active{background:var(--purple);color:var(--white)}
  .sugchip:active svg{color:var(--white)}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{display:flex;align-items:center;gap:11px;padding:14px;border-radius:12px;background:var(--grey);
    border:1px solid transparent;text-align:left;width:100%;transition:all .12s}
  .tile.on{background:var(--purple);border-color:var(--purple)}
  .tile.on .tile-l{color:var(--white)}
  .tile .ic{width:24px;height:24px;color:var(--purple);flex-shrink:0;display:flex}
  .tile.on .ic{color:#fff}
  .tile-l{font-size:14px;font-weight:600;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ms{width:22px;height:22px;display:inline-block;vertical-align:middle;flex-shrink:0}
  .ms.arrow{width:16px;height:16px}
  .ms.nav24{width:24px;height:24px}
  .ms.ic16{width:15px;height:15px}
  .ms.big{width:26px;height:26px}
  .tile.dashed{background:transparent;border:1px dashed var(--faint2)}

  input[type=text]{font-family:inherit;width:100%;border:none;border-bottom:2px solid var(--faint2);
    background:transparent;padding:10px 0;font-size:24px;font-weight:700;color:var(--purple);letter-spacing:-.01em}
  input[type=text]:focus{outline:none;border-bottom-color:var(--actx)}
  input::placeholder{color:var(--mute3);font-weight:400}

  /* intensity */
  .scale{display:flex;gap:4px}
  .scale>button{flex:1;height:34px;border-radius:6px;background:var(--grey);font-size:11px;font-weight:600;
    color:var(--mute2);transition:all .1s;display:flex;align-items:center;justify-content:center}
  .scale>button.on{background:var(--act);color:var(--white)}
  .scale.calm>button.on{background:var(--purple)}

  /* intensity slider */
  /* thin-line treatment to match the wave outlines and breath ring; white knob with a fine purple ring, same on both sliders */
  .range{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;background:var(--faint2);outline:none;margin:8px 0}
  .range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--purple);box-shadow:0 1px 3px rgba(0,0,0,.16);cursor:pointer}
  .range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--purple);box-shadow:0 1px 3px rgba(0,0,0,.16);cursor:pointer}
  #strengthbox{opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .6s ease,transform .6s ease}
  #strengthbox.show{opacity:1;transform:none;pointer-events:auto}
  /* clock-style duration picker */
  .clockrow{display:flex;justify-content:space-between;gap:10px}
  .clockopt{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute2);padding:10px 0;border-radius:12px;transition:color .15s,background .15s}
  .clockopt.on{color:var(--purple);background:var(--accent-lt,rgba(60,49,88,.06))}
  .clockopt .cl-track{stroke:var(--faint2)}
  .clockopt .cl-arc{stroke:currentColor}
  .clockopt .cl-num{font-size:15px;font-weight:800;color:var(--ink)}
  .clockopt.on .cl-num{color:var(--purple)}
  .clockopt .cl-min{font-size:10px;font-weight:600;color:var(--mute2);margin-left:3px}
  /* radial time dial */
  .dialwrap{position:relative;width:220px;height:220px;margin:16px auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
  #dial{width:220px;height:220px;display:block;cursor:pointer}
  .d-track{fill:none;stroke:var(--faint2);stroke-width:3}
  .d-arc{fill:none;stroke:var(--purple);stroke-width:3;stroke-linecap:round}
  .d-handle{fill:#fff;stroke:var(--purple);stroke-width:2}
  .dialval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  #dMin{font-size:46px;font-weight:800;color:var(--purple);line-height:1;font-variant-numeric:tabular-nums}
  .dialunit{font-size:12px;font-weight:700;color:var(--mute2);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
  /* dropdown */
  .selectwrap{position:relative;margin-top:12px}
  .selectwrap .chev{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--mute2);pointer-events:none;display:flex}
  .selectwrap .chev svg{width:20px;height:20px}
  .select{width:100%;font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--white);
    border:1px solid var(--faint2);border-radius:10px;padding:13px 40px 13px 14px;-webkit-appearance:none;appearance:none;outline:none}
  .select:focus{border-color:var(--purple)}
  .select.placeholder{color:var(--mute2)}

  /* duration segmented */
  .seg{display:flex;gap:8px}
  .seg>button{flex:1;padding:14px 0;border-radius:10px;background:var(--grey);font-weight:700;font-size:15px;color:var(--ink)}
  .seg>button .u{font-size:11px;font-weight:500;opacity:.5}
  .seg>button.on{background:var(--purple);color:var(--white)}

  /* progress */
  .prog{height:3px;background:var(--faint2);border-radius:2px;overflow:hidden}
  .prog>div{height:100%;background:var(--act);transition:width .4s ease}

  /* steps */
  .steps{display:flex;gap:5px}
  .steps>div{flex:1;height:3px;border-radius:2px;background:var(--faint)}
  .steps>div.on{background:var(--act)}

  /* wave */
  #wave{width:100%;height:150px;display:block;overflow:visible}
  .breathe-dot{transition:none}
  @keyframes breathe{0%,100%{r:9}50%{r:15}}
  /* breathing cue on the pause screen */
  .breathstage{position:relative;width:210px;height:210px;margin:18px auto 0}
  .breathring{position:absolute;inset:0;margin:auto;width:186px;height:186px;border-radius:50%;
    border:2px solid var(--purple);
    background:radial-gradient(circle at center,var(--white) 52%,rgba(0,0,0,0) 100%);
    transform:scale(.6);will-change:transform}
  .breathtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  #breathword{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--purple);opacity:.8}
  #breathcount{font-size:40px;font-weight:800;color:var(--purple);line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
  /* gentle nudge so people notice the speaker is a control they can mute */
  @keyframes soundnudge{0%,100%{transform:rotate(0)}18%{transform:rotate(-11deg)}36%{transform:rotate(9deg)}54%{transform:rotate(-6deg)}72%{transform:rotate(3deg)}}
  #soundbtn.nudge{animation:soundnudge 1.05s ease .5s 2}

  /* rows */
  .row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--faint)}
  .dotmark{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dot-pass{background:var(--actx)} .dot-act{background:var(--mute3)}
  .state{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .state.pass{color:var(--actx)} .state.act{color:var(--mute2)}

  /* stats mini */
  .statrow{display:flex}
  .statrow>div{flex:1}
  .statrow .v{font-size:26px;font-weight:800;color:var(--white);line-height:1;margin-top:6px}
  .statrow .v small{font-size:13px;font-weight:600;opacity:.7}

  .pod{display:flex;flex-direction:column;gap:10px}
  .podrow{display:flex;align-items:center;gap:10px}
  .podrow .pl{width:74px;font-size:12px;color:var(--mute)}
  .podbar{flex:1;height:10px;background:var(--grey);border-radius:5px;overflow:hidden}
  .podbar>div{height:100%;background:var(--purple);border-radius:5px}
  .podrow .pc{width:24px;text-align:right;font-size:12px;font-weight:600;color:var(--mute)}

  .trig{margin-bottom:12px}
  .trig .tt{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
  .trigbar{height:4px;background:var(--grey);border-radius:2px}
  .trigbar>div{height:100%;background:var(--act);border-radius:2px}

  /* patterns: full-width insight tiles */
  .ftile{display:block;width:100%;text-align:left;background:var(--t3);border:none;border-radius:16px;padding:16px 16px;margin-top:10px;font-family:inherit;cursor:default}
  .ftile.itap{cursor:pointer}
  .frow{display:flex;align-items:center;gap:14px}
  .fic{flex:none;color:var(--act);line-height:0}
  .fic .ms.fbig{width:30px;height:30px}
  .ftext{flex:1;display:flex;flex-direction:column;min-width:0}
  .fval{font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.15}
  .fcap{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.35}
  .fchev{flex:none;color:var(--mute2);line-height:0}
  .fchev .ms{width:22px;height:22px;transition:transform .2s ease}
  .fchev.open .ms{transform:rotate(180deg)}
  .fdetail{margin-top:15px;padding-top:15px;border-top:1px solid var(--faint)}
  .pcap{font-size:12.5px;line-height:1.5;color:var(--mute);margin-top:12px}
  .spark{width:100%;height:56px;display:block}
  /* borrowed: overview + daily breakdown + week-vs-week cards */
  .pcard{background:var(--t3);border-radius:16px;padding:16px 16px;margin-top:10px}
  .pcard-h{display:flex;justify-content:space-between;align-items:baseline}
  .pcard-h .ttl{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .ov{display:flex;gap:26px;margin-top:12px}
  .ov .n{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.02em;line-height:1}
  .ov .k{font-size:12px;color:var(--mute);margin-top:4px}
  .legend{display:flex;gap:16px;margin-top:14px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--mute)}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .dbars{display:flex;align-items:flex-end;gap:8px;height:96px;margin-top:12px}
  .dcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .dstack{width:100%;display:flex;flex-direction:column;border-radius:5px 5px 3px 3px;overflow:hidden;min-height:4px}
  .dstack .seg-a{background:var(--act)}
  .dstack .seg-p{background:var(--purple)}
  .dcol .dl{font-size:10px;color:var(--mute);font-weight:600}
  .wvw{display:flex;margin-top:12px}
  .wvw>div{flex:1}
  .wvw>div+div{border-left:1px solid var(--faint);padding-left:16px}
  .wvw .wk{font-size:12px;color:var(--mute)}
  .wvw .wn{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin-top:4px;line-height:1}
  .wvw .k{font-size:12px;color:var(--mute);margin-top:4px}
  .wvw-note{font-size:13px;color:var(--ink);margin-top:14px;line-height:1.4;border-top:1px solid var(--faint);padding-top:12px}

  /* nav */
  .nav{display:flex;justify-content:space-around;padding:11px 16px calc(12px + env(safe-area-inset-bottom,0));
    border-top:1px solid rgba(255,255,255,.4);background:rgba(250,250,250,.72);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
  .dark .nav{background:rgba(27,24,19,.7);border-top-color:rgba(255,255,255,.1)}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.35;padding:2px 12px;transition:opacity .15s}
  .nav button.on{opacity:1;color:var(--actx)}
  .nav svg{width:21px;height:21px}
  .nav span{font-size:10px;font-weight:600;letter-spacing:.02em}

  .scrim{position:absolute;inset:0;background:var(--mute2);opacity:0;transition:opacity .28s;z-index:40}
  .scrim.on{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--white);z-index:41;
    border-radius:18px 18px 0 0;padding:8px 22px max(22px,env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .3s cubic-bezier(.22,1,.36,1)}
  .sheet.on{transform:translateY(0)}
  .grab{width:36px;height:4px;border-radius:2px;background:var(--faint2);margin:8px auto 16px}

  #splash{position:absolute;inset:0;z-index:100;background:#3c3158;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease}
  #splash.gone{opacity:0;pointer-events:none}
  html.app-installed #splash{display:none}
  .splash-in{display:flex;flex-direction:column;align-items:center;animation:sp-in .7s cubic-bezier(.22,1,.36,1) both}
  .splash-mark{width:88px;height:auto;margin-bottom:20px;border-radius:50%}
  .splash-word{width:172px;height:auto}
  .splash-by{margin-top:12px;font-size:12px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:rgba(250,250,250,.6)}
  @keyframes sp-in{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
  .fade{animation:fade .3s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  /* glass screens reveal via transform, not opacity, so backdrop-filter never suspends (no first-load flash) */
  .home.fade{animation:homeReveal .3s ease}
  @keyframes homeReveal{from{transform:translateY(8px)}to{transform:translateY(0)}}
  .hidden{display:none!important}
  .wordmark{font-weight:800;letter-spacing:-.02em}
  ::-webkit-scrollbar{display:none}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
"use strict";

/* ============ config ============ */
const APP = { name:"Pause", by:"Pákó", lockup:"Pause by Pákó", brand:"Pákó Habit Lab" };
const TYPES_SEED = [
  { id:'smoke',  label:'Cigarettes', icon:'smoking_rooms' },
  { id:'drink',  label:'Alcohol',    icon:'sports_bar' },
  { id:'sugar',  label:'Sugar',      icon:'cake' },
  { id:'phone',  label:'The phone',  icon:'devices' },
  { id:'bet',    label:'Betting',    icon:'casino' },
  { id:'porn',   label:'Porn',       icon:'18_up_rating' },
  { id:'junk',   label:'Junk food',  icon:'fastfood' },
  { id:'caf',    label:'Caffeine',   icon:'local_cafe' },
  { id:'spend',  label:'Spending',   icon:'shopping_bag' },
];
const CAUSES = ['Stress','Boredom','Tired','Hungry','After a meal','Around people','Low mood','Just habit'];
const LENGTHS = [180, 300, 600];
const PZ_MSGS = [
  "This wave is already changing.<br>Let it.",
  "A big wave is still just a wave.<br>It will settle.",
  "You do not have to act on this.<br>You can watch it pass.",
  "Notice where you feel it in your body,<br>and let it be.",
  "Unlike you, this wave<br>can't rise forever.",
  "You're not your craving.<br>You'll be here when it's gone.",
];
// stimulus control: moving away from the cue is the strongest single strategy, shown first
const MOVE_NUDGE = "If you can, take a few steps away from where you first felt the wave.";
const SUGGESTIONS = [
  {s:'drink water', i:'local_drink', l:'Water'},
  {s:'step outside', i:'park', l:'Step out'},
  {s:'take five breaths', i:'self_improvement', l:'Breathe'},
  {s:'call someone', i:'call', l:'Call'},
  {s:'go for a walk', i:'directions_walk', l:'Walk'},
  {s:'wait ten minutes', i:'schedule', l:'Wait'},
];
function sugChips(id){ return SUGGESTIONS.map(x=>`<button class="sugchip" data-a="plan-sug" data-id="${id}" data-s="${esc(x.s)}">${msvg(x.i,'ic16')}<span>${x.l}</span></button>`).join(''); }
function planItem(t){ return `<div class="planitem">
  <div class="planlabel">If I crave <b>${esc(t.label)}</b>, I'll…</div>
  <input class="planinput" type="text" data-plan="${t.id}" value="${esc(t.plan||'')}" maxlength="120" placeholder="e.g. drink water and step outside" autocomplete="off">
  <div class="sugrow">${sugChips(t.id)}</div>
</div>`; }
const PICK_ICONS = ['bolt','local_fire_department','eco','menu_book','sports_esports','headphones','local_drink','cookie','laptop_mac','directions_run','bedtime','chat_bubble','shopping_cart','fitness_center','local_pizza','savings','mood','favorite'];

/* ============ storage ============ */
const KEY = 'pako-pause/v1';
const PERSIST = ['name','types','sessions','onboarded','pause','sound','theme'];
let storageOK = true;
function loadRaw(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ storageOK=false; return null; } }
function save(){ if(!storageOK)return; try{ const o={}; PERSIST.forEach(k=>o[k]=S[k]); localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){ storageOK=false; } }

/* ============ state ============ */
function fresh(){
  return {
    view:'onboard', onboarded:false,
    name:'', types:TYPES_SEED.slice(), sessions:[],
    pause:null,            // active pause: {typeId,cause,s0,s1,len,endTime}
    draft:null,            // in-progress "begin" form
    sound:true,            // ambient sound, on by default; muting is remembered
    theme:null,            // 'light' | 'dark' (null = follow system)
  };
}
let S = fresh();
// Runtime-only: the sea settles to a fixed calm level after the first pause and stays there for the
// rest of the app session (resets on reopen). Declared here, before boot(), because boot() can call
// recordPause() for an already-expired pause, which assigns seaSettled — accessing it any later would
// be a temporal-dead-zone crash on open.
let seaSettled=false;
// boot() is defined here but invoked at the very end of the script (just before the first render),
// after every const/let helper it transitively uses (pad, iso, hm, recordPause, ...) has been
// initialized. Running it inline here would hit those lexical bindings in their temporal dead zone
// whenever the app opens onto an already-expired pause.
function boot(){
  const saved = loadRaw();
  if(saved){
    S = Object.assign(fresh(), saved);
    if(!S.types||!S.types.length) S.types = TYPES_SEED.slice();
    if(S.pause && S.pause.endTime){
      S.view = leftOf(S.pause.endTime) > 0 ? 'pause' : 'passed';
      if(leftOf(S.pause.endTime) <= 0){ recordPause('passed'); }
    } else {
      S.view = S.onboarded ? 'home' : 'onboard';
    }
  }
  if(!S.theme) S.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  applyTheme(); save();
}
function applyTheme(){
  document.documentElement.classList.toggle('dark', S.theme==='dark');
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', S.theme==='dark'?'#1b1813':'#FAFAFA');
}

/* ============ helpers ============ */
const pad = n => String(n).padStart(2,'0');
const clock = s => `${Math.floor(s/60)}:${pad(s%60)}`;
function iso(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function hm(d=new Date()){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function leftOf(end){ return end? Math.max(0, Math.ceil((end-Date.now())/1000)) : 0; }
function typeOf(id){ return S.types.find(t=>t.id===id); }
function planOf(id){ const t=typeOf(id); return t&&t.plan&&t.plan.trim() ? t.plan.trim() : ''; }
// the lines shown under the breathing ring: your own plan (if set), then the move nudge, then reassurance
function pauseLead(p){
  const lead=[]; const pl=planOf(p.typeId);
  if(pl) lead.push(`<span class="label planlead" style="display:block;margin-bottom:5px;color:var(--actx)">Your plan</span>${esc(pl)}`);
  lead.push(MOVE_NUDGE);
  return lead;
}
function pauseMsgAt(elapsed, lead){
  const L=16;                                   // seconds each lead line holds
  if(elapsed < lead.length*L){ const i=Math.floor(elapsed/L); return {k:'L'+i, html:lead[i]}; }
  const i=Math.floor((elapsed-lead.length*L)/18)%PZ_MSGS.length; return {k:'P'+i, html:PZ_MSGS[i]};
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function greet(){ const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':h<22?'Good evening':'You’re up late'; }
function partOfDay(h){ return h<5?'Night':h<12?'Morning':h<17?'Afternoon':h<22?'Evening':'Night'; }

function calmDays(){
  if(!S.sessions.length) return 0;
  const acted = S.sessions.filter(x=>x.outcome==='acted');
  const anchor = acted.length ? acted[0].date : S.sessions[S.sessions.length-1].date;
  const a = new Date(anchor+'T00:00:00');
  const n = new Date(); const mid = new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.max(0, Math.floor((mid-a)/86400000));
}
function passRate(list){ list=list||S.sessions; if(!list.length)return 0;
  return Math.round(list.filter(x=>x.outcome==='passed').length / list.length * 100); }
function niceDate(d){
  const t=iso(); const y=iso(new Date(Date.now()-86400000));
  if(d===t)return'Today'; if(d===y)return'Yesterday';
  const dt=new Date(d+'T00:00:00');
  const diff=Math.floor((new Date(t)-dt)/86400000);
  const wk=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()];
  if(diff<7)return wk;
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
  return `${mo} ${dt.getDate()}`;
}

/* records the active pause as a session */
function recordPause(outcome, via){
  const p=S.pause; if(!p) return;
  seaSettled=true;                        // the sea stays at its settled level for the rest of the session
  const elapsed = outcome==='passed' ? p.len : (p.len - leftOf(p.endTime));
  S.sessions.unshift({
    id:'s'+Date.now().toString(36),
    date:iso(), t:hm(), hour:new Date().getHours(),
    type:p.typeId, cause:p.cause||null,
    s0:p.s0, s1:(p.s1!=null?p.s1:p.s0),
    len:p.len, elapsed, outcome, via:via||'timer',   // 'tap' = they said it passed; 'timer' = the clock ran out
  });
  S.sessions = S.sessions.slice(0,200);
  S.pause = null;
  save();
}

/* ============ export (all local, user-initiated) ============ */
function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function buildCSV(){
  const head=['Date','Time','Craving','What set it off','Strength before','Strength after','Minutes waited','Outcome'];
  const rows=S.sessions.map(x=>{const ty=typeOf(x.type);
    return [x.date,x.t,ty?ty.label:x.type,x.cause||'',x.s0,x.s1,(x.elapsed/60).toFixed(1),x.outcome==='passed'?'Let it pass':'Acted on it'];});
  return [head,...rows].map(r=>r.map(csvCell).join(',')).join('\n');
}
function summaryText(){
  const n=S.sessions.length, passed=S.sessions.filter(x=>x.outcome==='passed').length;
  const cc={}; S.sessions.forEach(x=>{if(x.cause)cc[x.cause]=(cc[x.cause]||0)+1});
  const top=Object.entries(cc).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
  return [
    'Pause by Pákó: my summary',
    `${S.name?S.name+', ':''}${n} pause${n===1?'':'s'} taken, ${passed} let pass.`,
    `Steady days: ${calmDays()}.`,
    top.length?`Most common triggers: ${top.join(', ')}.`:''
  ].filter(Boolean).join('\n');
}
function download(name,text,mime){
  const blob=new Blob([text],{type:mime||'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},120);
}

/* ============ render ============ */
const app = document.getElementById('app');
let clockInt=null, breathInt=null, pauseRAF=null;
function stop(){ if(clockInt){clearInterval(clockInt);clockInt=null} if(breathInt){clearInterval(breathInt);breathInt=null} if(pauseRAF){cancelAnimationFrame(pauseRAF);pauseRAF=null} }
function go(v){ S.view=v; save(); render(); }

const VIEWS = {onboard:Onboard, home:Home, begin:Begin, pause:PauseView, passed:Passed, acted:Acted, waves:Waves, patterns:Patterns, me:Me, privacy:PrivacyView};
let privReturn='me';
function render(){
  stop();
  waterStop();
  welcomeStop();
  if(S.view!=='pause') soundStop();
  app.scrollTop=0;
  document.documentElement.classList.toggle('pausing', S.view==='pause');
  app.innerHTML = `<div class="safe"></div>` + (VIEWS[S.view]||Home)();
  wire();
  if(S.view==='pause') runPause();
  seaSync();                                  // sea plays across the app, quieter off the home screen
  if(document.querySelector('.herowave')) heroStart(); else heroStop();
  if(document.querySelector('.hero-welcome')){ welcomeInit(); if(!document.getElementById('splash')) welcomeFall(); }
  if(document.getElementById('rotline')) rotStart(); else rotStop();
}
/* gentle rotating affirmation on the welcome headline */
const CRAVE_LINES = ['is a <span class="wv">wave</span>','will pass',"isn't you"];
let rotTimer=null, rotIdx=0;
function rotStop(){ if(rotTimer){ clearInterval(rotTimer); rotTimer=null; } }
function rotStart(){
  rotStop();
  const el=document.getElementById('rotline'); if(!el) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  rotIdx=0;
  rotTimer=setInterval(()=>{
    // compositor-driven opacity fade, unaffected by the wave rAF on the main thread
    const out=el.animate([{opacity:1},{opacity:0}],{duration:650,easing:'ease-in',fill:'forwards'});
    out.onfinish=()=>{
      rotIdx=(rotIdx+1)%CRAVE_LINES.length;
      el.innerHTML=CRAVE_LINES[rotIdx];
      el.animate([{opacity:0},{opacity:1}],{duration:900,easing:'ease-out',fill:'forwards'});
    };
  }, 4600);
}

// the orb is a warm sun by day and a pale moon in the evening, so it doesn't feel off at night
function orbCls(){ const h=new Date().getHours(); return (h<7||h>=18)?' moon':''; }
// the sun-and-waves hero, reused across screens; the surface undulates in place (like the pause water)
function heroWavePath(W,H,surf,amp,t,spd,phase){
  const k=2*Math.PI/W*1.35;
  let d='';
  for(let x=0;x<=W;x+=12){ const y=(surf + Math.sin(x*k + t*spd + phase)*amp + Math.sin(x*k*2.1 - t*spd*1.4)*amp*0.4).toFixed(1); d+=(x?' L':'M')+x+','+y; }
  return `${d} L${W},${H} L0,${H} Z`;
}
function heroWaves(h){
  const W=480;
  return `<svg class="herowave" data-h="${h}" viewBox="0 0 ${W} ${h}" preserveAspectRatio="none" style="height:${h}px">
    <path class="hb" fill="#9c93b8" opacity=".33" d="${heroWavePath(W,h,h*0.52,h*0.085,0,0.9,0)}"/>
    <path class="hf" fill="#6d6299" opacity=".5" d="${heroWavePath(W,h,h*0.70,h*0.11,0,1.15,1.3)}"/>
  </svg>`;
}
let heroRAF=null;
function heroDraw(){
  const t=Date.now()/1000*0.85;               // 15% slower, gentler undulation
  document.querySelectorAll('.herowave').forEach(svg=>{
    const H=+svg.dataset.h||120, W=480;
    const b=svg.querySelector('.hb'), f=svg.querySelector('.hf');
    if(b) b.setAttribute('d', heroWavePath(W,H,H*0.52,H*0.085,t,0.9,0));
    if(f) f.setAttribute('d', heroWavePath(W,H,H*0.70,H*0.11,t,1.15,1.3));
  });
}
function heroStop(){ if(heroRAF){ cancelAnimationFrame(heroRAF); heroRAF=null; } }
function heroStart(){
  heroStop();
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){ heroDraw(); return; }
  const loop=()=>{ heroDraw(); heroRAF=requestAnimationFrame(loop); }; loop();
}

/* ============ patterns ============ */
const MIN_INSIGHT = 5;  // a breakdown only shows once there's enough behind it
let patOpen={strong:false,windows:false};

// Full-width insight tile with a big Material icon. Tappable ones expand in place.
function ftile(icon,val,cap,o){o=o||{};
  const tag=o.k?'button':'div';
  const attrs=o.k?` data-a="pat-toggle" data-k="${o.k}"`:'';
  const chev=o.k?`<span class="fchev${patOpen[o.k]?' open':''}">${msvg('expand_more')}</span>`:'';
  const detail=(o.k&&patOpen[o.k]&&o.detail)?`<div class="fdetail">${o.detail}</div>`:'';
  return `<${tag} class="ftile${o.k?' itap':''}"${attrs}>
    <div class="frow"><span class="fic">${msvg(icon,'fbig')}</span>
    <span class="ftext"><span class="fval">${val}</span><span class="fcap">${cap}</span></span>${chev}</div>
    ${detail}</${tag}>`;
}

function Patterns(){
  const s=S.sessions;
  const n=s.length;
  const enough=n>=MIN_INSIGHT;
  const passedRated=s.filter(x=>x.outcome==='passed'&&x.s0!=null&&x.s1!=null);
  const passedCount=s.filter(x=>x.outcome==='passed').length;
  const avgDrop = passedRated.length ? (passedRated.reduce((a,x)=>a+(x.s0-x.s1),0)/passedRated.length).toFixed(1) : null;

  // triggers
  const byT={}; s.forEach(x=>{ if(!x.cause)return; const g=byT[x.cause]||(byT[x.cause]={n:0,p:0}); g.n++; if(x.outcome==='passed')g.p++; });
  const trigArr=Object.entries(byT).map(([c,g])=>({c,n:g.n,p:g.p,pct:Math.round(g.p/g.n*100)}));
  const byPct=[...trigArr].sort((a,b)=>b.pct-a.pct||b.n-a.n);
  const bestBeat=[...trigArr].sort((a,b)=>b.p-a.p||b.pct-a.pct)[0];
  // day parts
  const pods=['Morning','Afternoon','Evening','Night'];
  const pod={}; pods.forEach(p=>pod[p]={n:0,acted:0});
  s.forEach(x=>{ const p=partOfDay(x.hour!=null?x.hour:12); pod[p].n++; if(x.outcome==='acted')pod[p].acted++; });
  const maxPod=Math.max(1,...pods.map(p=>pod[p].n));
  const peak=pods.reduce((a,p)=>pod[p].n>pod[a].n?p:a,'Morning');
  const risky=pods.filter(p=>pod[p].n>=3).map(p=>({p,r:pod[p].acted/pod[p].n})).sort((a,b)=>b.r-a.r)[0];
  const easeMin=(()=>{const p=passedRated.length?passedRated:s.filter(x=>x.outcome==='passed');
    const w=p.map(x=>x.elapsed!=null?x.elapsed:x.len).filter(v=>v!=null).sort((a,b)=>a-b);
    if(!w.length)return null; const m=w[Math.floor(w.length/2)]; return Math.max(1,Math.round(m/60));})();

  // last 7 days (for the daily breakdown + week overview)
  const days=[];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i);
    days.push({key:d.toISOString().slice(0,10), dl:(i===0?'Today':['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]), passed:0, acted:0}); }
  s.forEach(x=>{ const day=days.find(d=>d.key===x.date); if(day){ if(x.outcome==='passed')day.passed++; else if(x.outcome==='acted')day.acted++; } });
  const wkTotal=days.reduce((a,d)=>a+d.passed+d.acted,0);
  const wkPct=wkTotal?Math.round(days.reduce((a,d)=>a+d.passed,0)/wkTotal*100):0;
  const maxDay=Math.max(1,...days.map(d=>d.passed+d.acted));

  // this week vs last week
  const win=(a,b)=>{const now=Date.now(),lo=now-a*864e5,hi=now-b*864e5;
    const r=s.filter(x=>{const t=Date.parse(x.date+'T12:00:00'); return t>lo&&t<=hi;});
    const p=r.filter(x=>x.outcome==='passed').length; return {n:r.length,pct:r.length?Math.round(p/r.length*100):0};};
  const thisWk=win(7,0), lastWk=win(14,7);
  let wvwNote;
  if(lastWk.n===0) wvwNote=`Your first week of logging. Keep going.`;
  else if(thisWk.pct>lastWk.pct+5) wvwNote=`You're riding out more than last week.`;
  else if(thisWk.pct<lastWk.pct-5) wvwNote=`A tougher week than last. That happens.`;
  else wvwNote=`Holding steady with last week.`;

  const parts=[];

  // three iconic tiles (kept)
  parts.push(`<div class="stats">
    ${statTile('s1', calmDays(), 'Steady days', MOTIF.steady)}
    ${statTile('s2', passedCount, 'Waves ridden', MOTIF.passed)}
    ${statTile('s3', (avgDrop!=null?avgDrop:'–'), 'Avg drop', MOTIF.taken)}
  </div>`);

  // Last 7 days: overview + daily breakdown
  if(wkTotal>0){
    const bars=days.map(d=>{const tot=d.passed+d.acted;
      const stack= !tot ? `<div class="dstack" style="height:4px;background:var(--faint)"></div>`
        : `<div class="dstack" style="height:${Math.max(10,tot/maxDay*100)}%">${d.acted?`<div class="seg-a" style="flex:${d.acted}"></div>`:''}${d.passed?`<div class="seg-p" style="flex:${d.passed}"></div>`:''}</div>`;
      return `<div class="dcol">${stack}<div class="dl">${d.dl}</div></div>`;}).join('');
    parts.push(`<div class="pcard">
      <div class="pcard-h"><span class="ttl">Last 7 days</span></div>
      <div class="ov"><div><div class="n">${wkTotal}</div><div class="k">Waves</div></div><div><div class="n">${wkPct}%</div><div class="k">Rode out</div></div></div>
      <div class="legend"><span><i style="background:var(--purple)"></i>Rode out</span><span><i style="background:var(--act)"></i>Acted</span></div>
      <div class="dbars">${bars}</div>
    </div>`);
  }

  // This week vs last week
  if(thisWk.n>0 || lastWk.n>0){
    parts.push(`<div class="pcard">
      <div class="pcard-h"><span class="ttl">This week vs last week</span></div>
      <div class="wvw">
        <div><div class="wk">This week</div><div class="wn">${thisWk.n}</div><div class="k">waves · ${thisWk.pct}% rode out</div></div>
        <div><div class="wk">Last week</div><div class="wn">${lastWk.n}</div><div class="k">waves · ${lastWk.pct}% rode out</div></div>
      </div>
      <div class="wvw-note">${wvwNote}</div>
    </div>`);
  }

  // Deeper insight tiles (strongest / danger / time-to-ease)
  if(enough){
    const ins=[];
    if(trigArr.length){
      const tbars=byPct.map(t=>`<div class="trig">
        <div class="tt"><span>${esc(t.c)}</span><span class="grey tnum" style="font-size:13px">${t.pct}%</span></div>
        <div class="trigbar"><div style="width:${t.pct}%"></div></div></div>`).join('');
      ins.push({score:bestBeat.p, html:ftile('bolt',esc(bestBeat.c),`${bestBeat.pct}% ridden out`,{k:'strong',detail:tbars})});
    }
    const podRows=pods.map(p=>`<div class="podrow"><span class="pl">${p}</span>
      <div class="podbar"><div style="width:${pod[p].n/maxPod*100}%;background:${p===peak&&pod[peak].n>0?'var(--act)':'var(--purple)'}"></div></div>
      <span class="pc tnum">${pod[p].n}</span></div>`).join('');
    const riskCap=(risky && risky.r>0)?`<p class="pcap">${risky.p} is when they most often win.</p>`:'';
    ins.push({score:pod[peak].n, html:ftile('schedule',peak,'When most of your urges hit',{k:'windows',detail:`<div class="pod">${podRows}</div>${riskCap}`})});
    ins.sort((a,b)=>b.score-a.score);
    ins.forEach(it=>parts.push(it.html));
    if(easeMin!=null) parts.push(ftile('self_improvement',`${easeMin} min`,'Usual time to ease'));
  } else {
    parts.push(`<div class="ftile"><div class="frow"><span class="fic">${msvg('lock','fbig')}</span>
      <span class="ftext"><span class="fval" style="font-size:18px">Keep logging</span><span class="fcap">Deeper patterns unlock after ${Math.max(1,MIN_INSIGHT-n)} more.</span></span></div></div>`);
  }

  return `<div class="home">
    ${navHero('Your patterns')}
    <div class="hsheet">
      ${parts.join('')}
      <div style="flex:1;min-height:20px"></div>
    </div>
    ${Nav('patterns')}
  </div>`;
}

/* ============ pause engine ============ */
/* ============ ambient sound (Web Audio) ============ */
let AUD=null, silentEl=null;
// iOS silences Web Audio when the ring/silent switch is on and routes it through a quiet
// session. Playing a short looping silent media element on the tap flips the page into the
// louder media-playback session, so the generated ambient is audible either way.
let SILENT_URL=null;
function silentURL(){
  if(SILENT_URL) return SILENT_URL;
  const sr=8000, n=Math.floor(sr*0.25), buf=new ArrayBuffer(44+n*2), dv=new DataView(buf);
  const ws=(o,t)=>{ for(let i=0;i<t.length;i++) dv.setUint8(o+i,t.charCodeAt(i)); };
  ws(0,'RIFF'); dv.setUint32(4,36+n*2,true); ws(8,'WAVE'); ws(12,'fmt '); dv.setUint32(16,16,true);
  dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true); ws(36,'data'); dv.setUint32(40,n*2,true);
  let bin='', u8=new Uint8Array(buf); for(let i=0;i<u8.length;i++) bin+=String.fromCharCode(u8[i]);
  SILENT_URL='data:audio/wav;base64,'+btoa(bin); return SILENT_URL;
}
function primeAudioSession(){
  try{
    if(!silentEl){ silentEl=new Audio(silentURL()); silentEl.loop=true; silentEl.preload='auto'; silentEl.setAttribute('playsinline',''); }
    const p=silentEl.play(); if(p&&p.catch) p.catch(()=>{});
  }catch(e){}
}
function smoothstep(x){ x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x); }
function breathVal(t){ const c=t%10; const v=c<4?smoothstep(c/4):1-smoothstep((c-4)/6); return 0.35+0.65*v; }
function _osc(ctx,m,f,type,g0){ const o=ctx.createOscillator(); o.type=type||'sine'; o.frequency.value=f; const g=ctx.createGain(); g.gain.value=g0; o.connect(g); g.connect(m); o.start(); return {o,g}; }
function _noise(ctx){ const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; s.loop=true; return s; }
function soundPluck(A,when,gain){
  const ctx=A.ctx;
  const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=82.41;
  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=164.82;
  const g2=ctx.createGain(); g2.gain.value=0.22;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,when);
  g.gain.linearRampToValueAtTime(gain,when+0.03);
  g.gain.exponentialRampToValueAtTime(0.0004,when+1.3);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(A.master);
  o.start(when); o2.start(when); o.stop(when+1.6); o2.stop(when+1.6);
}
function soundStart(){
  if(AUD) return;
  primeAudioSession();                                                        // flip iOS into the media-playback session
  let ctx; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const resume=()=>{ try{ if(ctx.state!=='running' && ctx.resume) ctx.resume(); }catch(e){} };
  resume(); setTimeout(resume,200);                                           // some iOS builds need a second nudge
  const master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
  const A={ctx,master,raf:null,lastC:99};
  _osc(ctx,master,109.75,'sine',0.16); _osc(ctx,master,110.25,'sine',0.16);   // A2
  _osc(ctx,master,164.56,'sine',0.11); _osc(ctx,master,165.06,'sine',0.11);   // E3
  _osc(ctx,master,55,'sine',0.06);                                            // sub
  A.padA=_osc(ctx,master,220,'sine',0); A.padE=_osc(ctx,master,329.63,'sine',0); // pad A3+E4
  const c=_osc(ctx,master,261.63,'sine',0); A.cG=c.g;                          // blowing C4
  const vib=ctx.createOscillator(); vib.frequency.value=5.5; const vibG=ctx.createGain(); vibG.gain.value=1.3; vib.connect(vibG); vibG.connect(c.o.frequency); vib.start();
  const an=_noise(ctx); const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=261.63; bp.Q.value=6; A.airG=ctx.createGain(); A.airG.gain.value=0; an.connect(bp); bp.connect(A.airG); A.airG.connect(master); an.start();
  A.shim=_osc(ctx,master,659.25,'sine',0);                                     // shimmer E5
  const bn=_noise(ctx); const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=520; const bg=ctx.createGain(); bg.gain.value=0.018; bn.connect(lp); lp.connect(bg); bg.connect(master); bn.start();
  master.gain.linearRampToValueAtTime(0.28, ctx.currentTime+2.0);             // fade in
  AUD=A;
  const frame=()=>{
    if(!AUD) return;
    const t=Date.now()/1000, b=breathVal(t), c10=t%10;
    A.padA.g.gain.value=0.085*b; A.padE.g.gain.value=0.055*b;
    A.cG.gain.value=0.09*b; A.airG.gain.value=0.03*b;
    const trem=0.6+0.4*Math.sin(2*Math.PI*0.05*t); A.shim.g.gain.value=0.035*b*trem;
    if(A.lastC<5 && c10>=5) soundPluck(A, ctx.currentTime+0.02, 0.09);        // one soft pluck mid-breath
    A.lastC=c10;
    A.raf=requestAnimationFrame(frame);
  };
  frame();
}
function soundStop(){
  const A=AUD; if(!A) return; AUD=null;
  cancelAnimationFrame(A.raf);
  try{
    A.master.gain.cancelScheduledValues(A.ctx.currentTime);
    A.master.gain.setValueAtTime(A.master.gain.value, A.ctx.currentTime);
    A.master.gain.linearRampToValueAtTime(0, A.ctx.currentTime+0.7);
  }catch(e){}
  const ctx=A.ctx; setTimeout(()=>{ try{ctx.close()}catch(e){} },800);
  try{ if(silentEl){ silentEl.pause(); silentEl.currentTime=0; } }catch(e){}  // release the media session
}

/* full-screen draining water behind the pause */
let waterCv=null, waterCtx=null, waterW=0, waterH=0;
function waterInit(){
  waterStop();
  const fr=document.getElementById('frame');
  const cv=document.createElement('canvas'); cv.id='watercv';
  cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none';
  fr.insertBefore(cv, fr.firstChild);
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  waterW=fr.clientWidth; waterH=fr.clientHeight;
  cv.width=Math.round(waterW*dpr); cv.height=Math.round(waterH*dpr);
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  waterCv=cv; waterCtx=ctx;
}
function waterStop(){ if(waterCv){ waterCv.remove(); waterCv=null; waterCtx=null; } }
function waterLayer(ctx,W,H,surf,t,amp,k,spd,phase,col){
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=6){
    const y = surf + Math.sin(x*k + t*spd + phase)*amp + Math.sin(x*k*2.1 - t*spd*1.4)*amp*0.4;
    x===0?ctx.lineTo(0,y):ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function waterDraw(prog){
  const ctx=waterCtx; if(!ctx) return;
  const W=waterW,H=waterH; ctx.clearRect(0,0,W,H);
  const surf = H*0.06 + (H*1.06 - H*0.06)*prog;          // near top -> below the bottom
  const t=Date.now()/1000, k=2*Math.PI/W*1.25;
  const lift = 1 - 0.6*prog;                             // fades paler as it drains, so the mood lifts
  const dk=document.documentElement.classList.contains('dark'); const base=dk?'150,140,192':'192,57,43'; const mm=dk?1.7:1;
  const rd = a => `rgba(${base},${(a*lift*mm).toFixed(3)})`;
  // back layer (lighter, slower) then front layer for depth
  waterLayer(ctx,W,H,surf+7,t,7,k*1.7,0.5,2.1,rd(0.08));
  const g=ctx.createLinearGradient(0,surf,0,H);
  g.addColorStop(0,rd(0.12)); g.addColorStop(1,rd(0.24));
  waterLayer(ctx,W,H,surf,t,10,k,0.9,0,g);
  // surface line
  ctx.beginPath();
  for(let x=0;x<=W;x+=6){ const y=surf+Math.sin(x*k+t*0.9)*10+Math.sin(x*k*2.1-t*1.26)*4; x===0?ctx.moveTo(0,y):ctx.lineTo(x,y); }
  ctx.strokeStyle=rd(0.32); ctx.lineWidth=1.5; ctx.stroke();
}

/* welcome screen: the water starts just below the header copy and rapidly falls to its
   resting level, then keeps the gentle undulation. The drama previews the pause metaphor. */
let wcCv=null, wcCtx=null, wcW=0, wcH=0, wcRAF=null, wcLift=0;
function welcomeStop(){ if(wcRAF){cancelAnimationFrame(wcRAF);wcRAF=null} if(wcCv){wcCv.remove();wcCv=null;wcCtx=null;} }
function reduceMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
// Create and warm the water canvas. Called at render, so on first load it happens BEHIND the splash:
// the canvas exists, is promoted to its own compositor layer, and sits high, ready to fall. Nothing is
// recreated at the moment the splash lifts, which is what used to drop frames on slower devices.
function welcomeInit(){
  welcomeStop();
  const hero=document.querySelector('.hero-welcome'); if(!hero) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const heroW=hero.clientWidth, heroH=hero.clientHeight;
  const restF=heroH*0.72, restB=restF-44;             // resting surfaces (front lower, back a touch higher)
  const lift0=restF-heroH*0.30; wcLift=lift0;          // start: surface sits just below the header copy
  const cH=heroH+lift0;                                // extend below the hero so the lift never exposes a gap
  const reduce=reduceMotion();
  const cv=document.createElement('canvas'); cv.id='wcwater';
  cv.style.cssText=`position:absolute;left:0;top:0;width:100%;height:${cH}px;z-index:1;pointer-events:none;will-change:transform;transform:translateY(${reduce?0:-lift0}px)`;
  hero.insertBefore(cv, hero.firstChild);
  wcW=heroW; wcH=cH;
  cv.width=Math.round(heroW*dpr); cv.height=Math.round(cH*dpr);
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); wcCv=cv; wcCtx=ctx;
  const ampF=Math.max(11,heroH*0.026), ampB=Math.max(8,heroH*0.019);
  const draw=()=>{
    if(!wcCtx) return; const W=wcW,H=wcH; wcCtx.clearRect(0,0,W,H);
    const t=Date.now()/1000, k=2*Math.PI/W*1.35;
    // back layer (fainter, higher), then front layer for depth - the app's purple, matching the hero
    waterLayer(wcCtx,W,H,restB,t,ampB,k,0.9,0,'rgba(156,147,184,.34)');
    const g=wcCtx.createLinearGradient(0,restF,0,H);
    g.addColorStop(0,'rgba(109,98,153,.58)'); g.addColorStop(1,'rgba(88,78,133,.72)');
    waterLayer(wcCtx,W,H,restF,t,ampF,k,1.15,1.3,g);
    // crest highlight on the front surface
    wcCtx.beginPath();
    for(let x=0;x<=W;x+=6){ const y=restF+Math.sin(x*k+t*1.15+1.3)*ampF+Math.sin(x*k*2.1-t*1.15*1.4)*ampF*0.4; x===0?wcCtx.moveTo(0,y):wcCtx.lineTo(x,y); }
    wcCtx.strokeStyle='rgba(201,193,224,.5)'; wcCtx.lineWidth=1.5; wcCtx.stroke();
    wcRAF=requestAnimationFrame(draw);
  };
  draw();
}
// Trigger the 5s descent. Waits two frames so the reveal paint lands first, then hands the whole
// motion to the compositor. Runs once per mount; the canvas is already warm from welcomeInit.
function welcomeFall(){
  const cv=wcCv; if(!cv) return;
  if(reduceMotion()){ cv.style.transform='translateY(0)'; return; }
  if(cv.dataset.fell) return; cv.dataset.fell='1';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!wcCv) return;
    wcCv.animate([{transform:`translateY(${-wcLift}px)`},{transform:'translateY(0)'}],
      {duration:5000, easing:'cubic-bezier(.45,.05,.55,.95)', fill:'both'});
  }));
}

const SEA_BASE=0.14;                                     // gentle base level across the app
// The sea recedes as you go through your first pause: half on entering, and once that pause is
// done it settles to a quarter and stays there for the rest of the app session. It never climbs
// back up on leaving, and never ducks further on later pauses. (seaSettled is declared up top, before
// boot(), so an expired-pause boot can safely assign it.)
function seaLevel(){
  if(seaSettled) return SEA_BASE/4;                      // fixed calm level once the first pause is behind them
  if(S.view==='pause') return SEA_BASE/2;                // -half during the first pause
  return SEA_BASE;
}
function seaFadeGain(to,secs){
  if(!seaGain||!seaCtx) return;
  try{ const t=seaCtx.currentTime; seaGain.gain.cancelScheduledValues(t); seaGain.gain.setValueAtTime(seaGain.gain.value,t); seaGain.gain.linearRampToValueAtTime(to,t+secs); }catch(e){}
}
function seaDecode(cb){
  if(seaBuf){ cb(seaBuf); return; }
  try{
    const b=atob(SEA_LOOP.split(',')[1]); const u8=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++) u8[i]=b.charCodeAt(i);
    seaCtx.decodeAudioData(u8.buffer, buf=>{ seaBuf=buf; cb(buf); }, ()=>cb(null));
  }catch(e){ cb(null); }
}
function seaStart(){
  if(!S.sound || SEA) return; SEA=true;
  primeAudioSession();                                                       // silent media element holds the iOS playback session
  try{ if(!seaCtx) seaCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ SEA=null; return; }
  const rz=()=>{ try{ if(seaCtx.state!=='running'&&seaCtx.resume) seaCtx.resume(); }catch(e){} }; rz(); setTimeout(rz,200);
  seaDecode(buf=>{
    if(!SEA||!buf) return;
    try{
      seaGain=seaCtx.createGain(); seaGain.gain.value=0; seaGain.connect(seaCtx.destination);
      seaSrc=seaCtx.createBufferSource(); seaSrc.buffer=buf; seaSrc.loop=true;   // sample-accurate, gapless loop
      seaSrc.connect(seaGain); seaSrc.start();
      seaFadeGain(seaLevel(), 2.6);                                             // gentle swell in
    }catch(e){}
  });
}
function seaLevelSet(){ if(SEA) seaFadeGain(seaLevel(), 0.8); }              // duck to the level for the current screen
function seaStop(){
  if(!SEA) return; SEA=null;
  seaFadeGain(0, 0.6);
  const src=seaSrc, g=seaGain; seaSrc=null; seaGain=null;
  setTimeout(()=>{ try{ src&&src.stop(); }catch(e){} try{ g&&g.disconnect(); }catch(e){} }, 700);
  try{ if(silentEl){ silentEl.pause(); silentEl.currentTime=0; } }catch(e){}
}
// start the sea if it should play, otherwise just set the level for this screen
function seaSync(){ if(S.sound && audioUnlocked){ if(!SEA) seaStart(); else seaLevelSet(); } }

function runPause(){
  const p=S.pause; if(!p){ go('home'); return; }
  if(S.sound) soundStart();
  waterInit();
  const ring=document.getElementById('bring'), bw=document.getElementById('breathword'), bc=document.getElementById('breathcount');
  if(S.sound){ const sb=document.getElementById('soundbtn'); if(sb){ sb.classList.add('nudge'); setTimeout(()=>{ if(sb) sb.classList.remove('nudge'); },3300); } }
  const lead=pauseLead(p);
  let lastMsgKey=pauseMsgAt(0,lead).k, revealed=false, lastWord='', lastCount=0;
  const frame=()=>{
    const msLeft = p.endTime - Date.now();
    if(msLeft<=0){ recordPause('passed'); go('passed'); return; }
    const cl=document.getElementById('pzclock'); if(cl) cl.textContent=clock(Math.ceil(msLeft/1000))+' left';
    const prog=Math.min(1, Math.max(0, 1 - msLeft/(p.len*1000)));
    waterDraw(prog);
    // breathing cue: 4s in, 6s out, sharing the sound's breath curve
    const now=Date.now()/1000, c10=now%10, inhale=c10<4;
    if(ring) ring.style.transform='scale('+(0.6+0.4*((breathVal(now)-0.35)/0.65)).toFixed(3)+')';
    const word=inhale?'Breathe in':'Breathe out';
    if(word!==lastWord && bw){ bw.textContent=word; lastWord=word; }
    const cnt=inhale?Math.floor(c10)+1:Math.floor(c10-4)+1;
    if(cnt!==lastCount && bc){ bc.textContent=cnt; lastCount=cnt; }
    // the line under the ring: plan, then move nudge, then the reassurance rotation
    const msg=pauseMsgAt(p.len*prog, lead);
    if(msg.k!==lastMsgKey){ lastMsgKey=msg.k; const m=document.getElementById('pzmsg');
      if(m){ m.style.opacity='0'; setTimeout(()=>{ const mm=document.getElementById('pzmsg'); if(mm){ mm.innerHTML=msg.html; mm.style.opacity='1'; } },400); } }
    // reveal the after-rating near the end
    if(!revealed && prog>=0.7){ revealed=true; const box=document.getElementById('strengthbox'); if(box) box.classList.add('show'); }
    pauseRAF=requestAnimationFrame(frame);
  };
  frame();
  document.addEventListener('visibilitychange',onVis);
}
function onVis(){ if(document.visibilityState==='visible' && S.view==='pause'){
  if(leftOf(S.pause?.endTime)<=0){ recordPause('passed'); go('passed'); } } }

/* ============ input wiring ============ */
function fillRange(el){ const mn=+el.min,mx=+el.max,v=+el.value; const p=(v-mn)/(mx-mn)*100;
  const pausing=document.documentElement.classList.contains('pausing');
  const dk=document.documentElement.classList.contains('dark');
  const c=el.classList.contains('calm')?(pausing&&dk?'#b7addb':'var(--purple)'):'var(--act)';
  const track='var(--faint2)';                 // same soft grey as the dial's unfilled ring
  el.style.background=`linear-gradient(to right,${c} ${p}%,${track} ${p}%)`; }

/* radial, drag-to-set time dial (1–20 min) */
let dialSetMin=null;
function syncLenChips(sec){ document.querySelectorAll('[data-a=bg-len]').forEach(x=>x.classList.toggle('on',+x.dataset.s===sec)); }
function initDial(){
  dialSetMin=null;
  const svg=document.getElementById('dial'); if(!svg) return;
  const cx=110, cy=110, R=82, C=2*Math.PI*R, MIN=1, MAX=20;
  const arc=document.getElementById('dArc'), handle=document.getElementById('dHandle'), lab=document.getElementById('dMin');
  let lastM=null;
  function setMin(m){
    m=Math.max(MIN,Math.min(MAX,Math.round(m)));
    draft().len=m*60; lab.textContent=m;
    const f=m/MAX, a=(-90+f*360)*Math.PI/180;
    arc.style.strokeDasharray=`${(C*f).toFixed(1)} ${C.toFixed(1)}`;
    handle.setAttribute('cx',(cx+R*Math.cos(a)).toFixed(1));
    handle.setAttribute('cy',(cy+R*Math.sin(a)).toFixed(1));
    syncLenChips(m*60);
    lastM=m;
  }
  dialSetMin=setMin;
  function fromEvent(e, first){
    const r=svg.getBoundingClientRect();
    const px=(e.clientX)-r.left-r.width/2, py=(e.clientY)-r.top-r.height/2;
    let ang=Math.atan2(py,px)*180/Math.PI;      // 0 = east
    ang=(ang+90+360)%360;                        // 0 at top, clockwise
    let m=Math.round((ang/360)*MAX); if(m<MIN)m=MIN;
    if(!first && lastM!=null && Math.abs(m-lastM)>MAX*0.6) return;  // ignore wrap jumps mid-drag
    setMin(m);
  }
  let dragging=false;
  svg.addEventListener('pointerdown',e=>{ dragging=true; try{svg.setPointerCapture(e.pointerId)}catch(_){} fromEvent(e,true); e.preventDefault(); });
  svg.addEventListener('pointermove',e=>{ if(dragging){ fromEvent(e,false); e.preventDefault(); } });
  const end=()=>{ dragging=false; };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  setMin((draft().len||300)/60);
}
function wire(){
  const on=document.getElementById('obName');
  if(on) on.addEventListener('input',e=>{ob.name=e.target.value; const b=document.querySelector('[data-a=ob-next]'); if(b)b.disabled=!ob.name.trim();});
  const mn=document.getElementById('meName');
  if(mn) mn.addEventListener('input',e=>{S.name=e.target.value; save();});
  const bs=document.getElementById('bgslider');
  if(bs){ fillRange(bs); bs.addEventListener('input',e=>{ draft().s0=+e.target.value; const v=document.getElementById('bgval'); if(v)v.textContent=e.target.value; fillRange(bs); }); }
  const ps=document.getElementById('pzslider');
  if(ps){ fillRange(ps); ps.addEventListener('input',e=>{ S.pause.s1=+e.target.value; const v=document.getElementById('s1val'); if(v)v.textContent=e.target.value; fillRange(ps); save(); }); }
  const cs=document.getElementById('bgcause'), co=document.getElementById('bgcauseother');
  if(cs) cs.addEventListener('change',e=>{
    const v=e.target.value;
    if(v==='__other__'){ if(co){ co.classList.remove('hidden'); co.focus(); } draft().cause=(co&&co.value.trim())||null; e.target.classList.remove('placeholder'); }
    else { if(co) co.classList.add('hidden'); draft().cause=v||null; e.target.classList.toggle('placeholder', !v); }
  });
  if(co) co.addEventListener('input',e=>{ draft().cause=e.target.value.trim()||null; });
  const pcs=document.getElementById('pxcause'), pco=document.getElementById('pxcauseother');
  if(pcs) pcs.addEventListener('change',e=>{
    const v=e.target.value, last=S.sessions[0]; if(!last) return;
    if(v==='__other__'){ if(pco){ pco.classList.remove('hidden'); pco.focus(); } last.cause=(pco&&pco.value.trim())||null; e.target.classList.remove('placeholder'); }
    else { if(pco) pco.classList.add('hidden'); last.cause=v||null; e.target.classList.toggle('placeholder', !v); }
    save();
  });
  if(pco) pco.addEventListener('input',e=>{ const last=S.sessions[0]; if(last){ last.cause=e.target.value.trim()||null; save(); } });
  document.querySelectorAll('input[data-plan]').forEach(inp=>{
    inp.addEventListener('input',e=>{ const t=typeOf(e.target.dataset.plan); if(t){ t.plan=e.target.value.trim()||undefined; save(); } });
  });
  initDial();
}

/* ============ click handling ============ */
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, id=el.dataset.id;
  switch(a){
    /* onboarding */
    case'ob-pick':{
      ob.pick.has(id)?ob.pick.delete(id):ob.pick.add(id);
      el.classList.toggle('on', ob.pick.has(id));
      const nb=document.querySelector('[data-a=ob-next]');
      if(nb){ nb.disabled=ob.pick.size===0; nb.innerHTML='Start with '+(ob.pick.size||'…')+' '+IC.arrow; }
      break; }
    case'ob-back': ob.step--; render(); break;
    case'ob-next':
      if(ob.step<3){ ob.step++; render(); }
      else{
        const picked=S.types.filter(t=>ob.pick.has(t.id));
        S.name=ob.name.trim()||'there';
        if(picked.length) S.types=picked;                 // keep only the cravings they chose
        S.onboarded=true; S.view='home'; save(); render();
      }
      break;
    case'plan-sug':{
      const inp=document.querySelector('input[data-plan="'+id+'"]');
      if(inp){ const s=el.dataset.s; inp.value = inp.value.trim() ? inp.value.trim()+' and '+s : s;
        const t=typeOf(id); if(t){ t.plan=inp.value; save(); } }
      break; }
    case'add-type': addTypeModal(); break;
    case'export-csv': download('pause-history.csv', buildCSV(), 'text/csv'); break;
    case'share-sum':{ const tx=summaryText();
      if(navigator.share){ navigator.share({title:'Pause',text:tx}).catch(()=>{}); }
      else { download('pause-summary.txt', tx, 'text/plain'); }
      break; }

    /* nav */
    case'nav': go(el.dataset.v); break;
    case'begin': S.draft=null; go('begin'); break;
    case'go-home': go('home'); break;
    case'go-waves': go('waves'); break;
    case'go-patterns': go('patterns'); break;
    case'pat-toggle':{ const k=el.dataset.k; patOpen[k]=!patOpen[k]; render(); break; }
    case'go-privacy': privReturn=S.view; go('privacy'); break;
    case'priv-back': go(privReturn||'me'); break;

    /* begin form */
    case'bg-type':{ draft().typeId=id;
      document.querySelectorAll('[data-a=bg-type]').forEach(x=>x.classList.toggle('on', x.dataset.id===id));
      break; }
    case'bg-s0': draft().s0=+el.dataset.v;
      document.querySelectorAll('.scale>button').forEach((b,i)=>b.classList.toggle('on',i<draft().s0)); break;
    case'bg-cause':{const c=el.dataset.c; const d=draft(); d.cause=d.cause===c?null:c;
      document.querySelectorAll('[data-a=bg-cause]').forEach(x=>x.classList.toggle('on',x.dataset.c===d.cause)); break;}
    case'bg-len': if(dialSetMin){ dialSetMin(+el.dataset.s/60); } else { draft().len=+el.dataset.s; syncLenChips(+el.dataset.s); } break;
    case'bg-finetune':{ const w=document.getElementById('dialbox'); if(w){ const hid=w.classList.toggle('hidden'); el.textContent=hid?'Fine-tune':'Hide dial'; } break; }
    case'bg-start':{const d=draft();
      S.pause={typeId:d.typeId,cause:d.cause,s0:d.s0,s1:d.s0,len:d.len,endTime:Date.now()+d.len*1000};
      S.draft=null; go('pause'); break;}

    /* pause */
    case'pz-s1':{const v=+el.dataset.v; S.pause.s1=v;
      document.getElementById('s1val').textContent=v;
      document.querySelectorAll('.scale.calm>button').forEach((b,i)=>b.classList.toggle('on',i<v)); save(); break;}
    case'pz-passed': recordPause('passed','tap'); go('passed'); break;
    case'pz-acted':{ recordPause('acted'); go('acted'); break; }
    case'pz-quit': S.pause=null; seaSettled=true; save(); go('home'); break;
    case'sound-toggle':{
      S.sound=!S.sound; save();
      const sb=document.getElementById('soundbtn');
      if(sb){ sb.innerHTML=msvg(S.sound?'volume_up':'volume_off','nav24'); sb.style.color=S.sound?'var(--actx)':'var(--mute2)'; }
      if(S.sound){ audioUnlocked=true; soundStart(); seaSync(); } else { soundStop(); seaStop(); }
      break; }

    case'home-sound':{
      S.sound=!S.sound; save();
      const hb=document.getElementById('homesound');
      if(hb){ hb.innerHTML=msvg(S.sound?'volume_up':'volume_off','nav24'); hb.style.color=S.sound?'#FAFAFA':'#8f86ad'; }
      if(S.sound){ audioUnlocked=true; seaSync(); } else { seaStop(); soundStop(); }
      break; }

    /* me */
    case'me-untrack':{ if(S.types.length>1){ S.types=S.types.filter(t=>t.id!==id); save(); render(); } break; }
    case'theme': S.theme=el.dataset.v; save(); applyTheme(); render(); break;
    case'theme-toggle': S.theme = S.theme==='dark'?'light':'dark'; save(); applyTheme(); render(); break;
    case'wipe-ask': document.getElementById('wipebox').classList.remove('hidden'); break;
    case'wipe-no': document.getElementById('wipebox').classList.add('hidden'); break;
    case'wipe-yes': try{localStorage.removeItem(KEY)}catch(e){}; S=fresh(); ob={step:0,name:'',pick:new Set()}; render(); break;
  }
});

boot();      // load saved state and resolve the opening view — safe here, all helpers are initialized
render();

// audio can't play until the first touch; arm it so the arrival chime and waves begin then
document.addEventListener('pointerdown', function unlockAudio(){
  if(audioUnlocked) return; audioUnlocked=true; primeAudioSession();
  if(S.sound && !SEA) seaStart();
}, {capture:true});

// brief logo splash, then reveal the app (skipped when installed: the OS already showed one)
if(document.documentElement.classList.contains('app-installed')){ const sp=document.getElementById('splash'); if(sp) sp.remove(); }
else setTimeout(()=>{ const sp=document.getElementById('splash'); if(sp){ sp.classList.add('gone'); setTimeout(()=>{ sp.remove(); if(document.querySelector('.hero-welcome')) welcomeFall(); },550); } }, 1150);
</script>
