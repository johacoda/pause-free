/* ============ begin (guided form) ============ */

  const showPicker = S.types.length >= 2;
  const tiles = showPicker ? S.types.map(t=>`<button class="tile ${t.id===d.typeId?'on':''}" data-a="bg-type" data-id="${t.id}">
    <span class="ic">${msvg(t.icon)}</span><span class="tile-l">${esc(t.label)}</span></button>`).join('')
    + `<button class="tile dashed" data-a="add-type"><span class="ic">${msvg('add')}</span><span class="tile-l">Add your own</span></button>` : '';

    </div>
${showPicker?`
    <span class="label ink qz" style="display:block;margin-top:26px">What's the craving?</span>

`:''}

      <span class="tnum" style="font-size:calc(14px * var(--fs,1));font-weight:800;color:var(--purple)"><span id="bgval">${d.s0}</span><span style="font-weight:600;color:var(--mute2)">/10</span></span>

    </div>

/* ============ pause (the wave) ============ */
// the why, shown in a two-column card (trophy on the left, label and the quoted reason on the right).
// used on the wave screen and again on the passed screen, with a context-specific label.
function whyCard(label){
  if(!S.why) return '';
  return `<div class="whycard2">
    <div class="whycard2-l">${msvg('trophy')}</div>
    <div class="whycard2-r"><span class="whyl">${esc(label)}</span><p class="whyline2">“${esc(S.why)}”</p></div>
  </div>`;
}
function PauseView(){
  const p=S.pause; const ty=typeOf(p.typeId)||{label:'this',em:'🌊'};
  const header = `<div style="display:flex;align-items:center;justify-content:space-between;padding-top:16px">
      <button data-a="pz-quit" class="grey">${IC.close}</button>
      <span class="label" style="letter-spacing:.16em;display:inline-flex;align-items:center;gap:6px">${msvg(ty.icon,'ic16')} ${esc(ty.label)}</span>
      <button data-a="sound-toggle" id="soundbtn" aria-label="Sound" style="color:${S.sound?'var(--actx)':'var(--mute2)'}">${msvg(S.sound?'volume_up':'volume_off','nav24')}</button>
    </div>`;
  const pill = `<div style="text-align:center;margin-top:10px">
      <button class="practicepill" data-a="practice-pick"><span>${esc(practiceLabel())}</span>${msvg('expand_more','ic16')}</button>
    </div>`;
  const strengthBox = (shown)=>`<div id="strengthbox" class="${shown?'show':''}" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
        <span class="label ink">How strong is it now?</span><span class="grey tnum" style="font-size:calc(13px * var(--fs,1))"><span id="s1val">${p.s1!=null?p.s1:p.s0}</span> / 10</span>
      </div>
      <input type="range" class="range calm" id="pzslider" min="1" max="10" step="1" value="${p.s1!=null?p.s1:p.s0}">
    </div>
    <button class="btn btn-red" data-a="pz-passed">It passed</button>
    <button class="tlink grey" data-a="pz-acted" style="margin-bottom:max(20px,env(safe-area-inset-bottom))">I gave in</button>`;

  // first-use explainer: the first time someone meets a practice, a short "how it works" before it starts
  if(!seenPractice(S.pattern)){
    const P = isGround() ? GROUND : patOf(S.pattern);
    const line = isGround()
      ? `<div class="expl-cad">5 see · 4 feel · 3 hear · 2 smell · 1 taste</div>`
      : `<div class="expl-cad">${esc(P.sub)}</div>`;
    return `<div class="screen pausescreen" style="padding-bottom:0">
      ${header}
      <div class="expl">
        <span class="whyl">${isGround()?'Grounding':'Breathing'}</span>
        <div class="expl-name">${esc(P.name)}</div>
        ${line}
        <p class="expl-note">${esc(P.note)}</p>
      </div>
      <div style="flex:1"></div>
      <button class="btn btn-red" data-a="prac-explained" style="margin-bottom:8px">Begin ${IC.arrow}</button>
      <button class="tlink grey" data-a="practice-pick" style="margin-bottom:max(20px,env(safe-area-inset-bottom))">Choose another</button>
    </div>`;
  }

  // grounding mode: a self-paced 5-4-3-2-1 walk, no countdown, then the same close
  if(isGround()){
    if(!p.g) p.g={step:0, filled:[0,0,0,0,0], done:false};
    const g=p.g;
    if(g.done){
      return `<div class="screen pausescreen" style="padding-bottom:0">
        ${header}
        <div style="text-align:center;margin-top:26px"><div class="gsettled">You're back in the room.</div></div>
        ${pill}
        <div style="flex:1;min-height:20px"></div>
        ${strengthBox(true)}
      </div>`;
    }
    const st=GROUND.steps[g.step], filled=g.filled[g.step]||0, last=g.step===GROUND.steps.length-1;
    const dots = Array.from({length:st.n}).map((_,i)=>`<button class="gdot ${i<filled?'on':''}" data-a="g-dot" data-i="${i}">${i<filled?'✓':''}</button>`).join('');
    return `<div class="screen pausescreen" style="padding-bottom:0">
      ${header}
      <div class="steps" style="margin-top:16px">${GROUND.steps.map((s,i)=>`<div class="${i<=g.step?'on':''}"></div>`).join('')}</div>
      <div style="margin-top:6vh;text-align:center">
        <div class="gnum">${st.n}</div>
        <h2 class="qz" style="margin-top:8px">${st.prompt}</h2>
        <p class="body grey" style="margin:10px auto 0;max-width:22em">${st.hint}</p>
      </div>
      <div class="gdots">${dots}</div>
      <p class="grey" style="text-align:center;font-size:calc(11.5px * var(--fs,1));margin-top:12px">Tap a circle for each one as you go.</p>
      ${pill}
      <div style="flex:1;min-height:20px"></div>
      <button class="btn btn-red" data-a="g-next" ${filled>=st.n?'':'disabled'} style="margin-bottom:max(20px,env(safe-area-inset-bottom))">${last?'Done':'Next'} ${IC.arrow}</button>
    </div>`;
  }

  // breathing mode
  return `<div class="screen pausescreen" style="padding-bottom:0">
    ${header}
    <div style="text-align:center;margin-top:14px">
      <span id="pzclock" class="grey tnum" style="font-size:calc(13px * var(--fs,1));letter-spacing:.02em">${clock(leftOf(p.endTime))} left</span>
    </div>

    <div class="breathstage">
      <div class="breathring" id="bring"></div>
      <div class="breathtext">
        <div id="breathword">Breathe in</div>
        <div id="breathcount" class="tnum">1</div>
      </div>
    </div>
    ${pill}
    <p id="pzmsg" class="body grey" style="text-align:center;margin-top:22px;max-width:24em;margin-left:auto;margin-right:auto;transition:opacity .4s ease">${pauseLead(p)[0]}</p>
    ${whyCard('Your why')}

    <div style="flex:1"></div>

    ${strengthBox(false)}
  </div>`;
}

/* the trigger reflection now lives here, after the wave — it's easier to name what set it off once the craving has eased, and it keeps the pre-pause screen to just what you need to start */
function causeReflect(slip){
  const last=S.sessions[0]; if(!last) return '';
  const inList = last.cause && CAUSES.includes(last.cause);
  const isOther = last.cause && !inList;
  const q  = slip ? 'What pulled you under this time?' : 'What set it off?';
  const ph = slip ? 'Type what pulled you under' : 'Type what set it off';
  const opts='<option value="" '+(last.cause?'':'selected')+'>Not sure</option>'
    + CAUSES.map(c=>`<option value="${esc(c)}" ${last.cause===c?'selected':''}>${esc(c)}</option>`).join('')
    + `<option value="__other__" ${isOther?'selected':''}>Something else…</option>`;
  const notePh = slip ? 'What pulled you under, how you felt, whatever you want to keep.' : 'What helped, how it felt, whatever you want to keep.';
  const notes = `<span class="label ink" style="display:block;margin:22px 0 9px">Write about this wave <span style="font-weight:400;color:var(--mute2);font-size:calc(12px * var(--fs,1));text-transform:none;letter-spacing:0">optional</span></span>
    <textarea id="pxnote" class="notebox" maxlength="600" placeholder="${notePh}">${esc(last.note||'')}</textarea>`;
  return `<div style="margin-top:20px">
    <span class="label ink" style="display:block;margin-bottom:9px">${q} <span style="font-weight:400;color:var(--mute2);font-size:calc(12px * var(--fs,1));text-transform:none;letter-spacing:0">optional</span></span>
    <div class="selectwrap" style="margin-top:0">
      <select class="select ${last.cause?'':'placeholder'}" id="pxcause">${opts}</select>
      <span class="chev">${msvg('expand_more')}</span>
    </div>
    <input type="text" id="pxcauseother" class="select${isOther?'':' hidden'}" placeholder="${ph}" maxlength="40" value="${isOther?esc(last.cause):''}" style="margin-top:8px;padding-right:14px">
    ${notes}
  </div>`;
}

/* ============ passed ============ */
function Passed(){
  const last=S.sessions[0]; if(!last) return Home();
  const drop = last.s0 - last.s1;
  const tapped = last.via==='tap';                       // they told us it passed
  const strongDrop = drop>=3 || last.s1<=2;              // rating says it clearly eased
  // the hero reflects what actually happened, so it never over-claims
  let title, tf, waveH, body, primary;
  if(tapped || strongDrop){
    title='The wave<br>passed'; tf=38; waveH=92;
    body = drop>=1 ? `It eased from ${last.s0} to ${last.s1} out of 10.`
                   : `You stayed with it.`;
    primary = `<button class="btn btn-red" data-a="go-patterns" style="margin-bottom:10px">See your insights ${IC.arrow}</button>`;
  } else if(drop>=1){
    title='The wave is<br>settling'; tf=33; waveH=122;
    body = `It eased from ${last.s0} to ${last.s1} out of 10. It's settling.`;
    primary = `<button class="btn btn-red" data-a="go-patterns" style="margin-bottom:10px">See your insights ${IC.arrow}</button>`;
  } else {
    title='You got<br>through it'; tf=37; waveH=152;
    body = drop===0
      ? `It held at ${last.s0} out of 10. And you stayed with it.`
      : `It rose from ${last.s0} to ${last.s1} out of 10. It takes a bit longer sometimes.`;
    primary = `<button class="btn btn-red" data-a="begin" style="margin-bottom:10px">Watch another wave ${IC.arrow}</button>`;
  }
  const earned=justEarned();
  return `<div class="home fade">
    ${resultHero(title,tf,waveH)}
    <div class="hsheet">
      ${earned?`<div class="mearned">${msMedal(earned.v,earned.unit,'earned',earned.tier,46,1)}<div><div class="mel">New milestone</div><div class="mev">${earned.v} ${plu(earned.unit,earned.v)} ${earned.tail}</div></div></div>`:''}
      <p class="body grey" style="max-width:24em">${body}</p>
      <div class="stats" style="margin-top:18px">
        ${statTile('s1', calmDays(), 'Steady days', MOTIF.steady)}
        ${statTile('s2', S.sessions.filter(x=>x.outcome==='passed').length, 'Waves passed', MOTIF.passed)}
        ${statTile('s3', bestRun(), 'Best run', MOTIF.taken)}
      </div>
      ${whyCard("This is what you're protecting")}
      ${causeReflect()}
      <div style="flex:1;min-height:20px"></div>
      ${primary}
      <button class="tlink grey" data-a="go-home" style="margin-bottom:max(20px,env(safe-area-inset-bottom))">Back home</button>
    </div>
  </div>`;
}

/* ============ waves (history) ============ */
let wf='all';
function Waves(){
  const list = wf==='all'?S.sessions:S.sessions.filter(x=>x.type===wf);
  const g={}; list.forEach(x=>{(g[x.date]=g[x.date]||[]).push(x)});
  const dates=Object.keys(g).sort().reverse();
  const pills=[{id:'all',label:'All'},...S.types.filter(t=>S.sessions.some(x=>x.type===t.id))]
    .map(t=>`<button class="chip ${t.id===wf?'on':''}" data-a="wf" data-id="${t.id}">${esc(t.label)}</button>`).join('');
  const groups=dates.map(dt=>{
    const rows=g[dt]; const passed=rows.filter(x=>x.outcome==='passed').length;
    const items=rows.map(x=>{const ty=typeOf(x.type);
      return `<div class="row">
        <span class="grey tnum" style="width:44px;font-size:calc(12px * var(--fs,1))">${x.t}</span>
        <span style="flex:1"><span style="font-size:calc(15px * var(--fs,1))">${ty?esc(ty.label):esc(x.type)}</span>
          ${(x.cause||(x.s0!=null&&x.s1!=null))?`<span class="grey" style="display:block;font-size:calc(12px * var(--fs,1))">${x.cause?esc(x.cause):''}${(x.cause&&x.s0!=null)?' · ':''}${(x.s0!=null&&x.s1!=null)?`${x.s0}→${x.s1}`:''}</span>`:''}${x.note?`<span class="wnote">“${esc(x.note)}”</span>`:''}</span>
        <span class="state ${x.outcome==='passed'?'pass':'act'}">${x.outcome==='passed'?'Passed':'Gave in'}</span></div>`}).join('');

      ${items}</div>`;
  }).join('') || `<p class="body grey" style="text-align:center;margin-top:50px">No waves logged yet.</p>`;
  return `<div class="home">
    ${navHero(`${S.sessions.length} ${S.sessions.length===1?'wave':'waves'} watched`)}
    <div class="hsheet">
      ${S.sessions.length?`<div class="chiprow" style="margin-bottom:2px;flex-wrap:nowrap;overflow-x:auto">${pills}</div>`:''}
      ${groups}

/* ============ patterns ============ */
const MIN_INSIGHT = 5;  // triggers/timing only appear once there's enough behind them
let patPeriod='week', patShowAll=false;

// slide-up detail for one trigger: win rate, when it hits, usual strength, how fast it settles
function trigSheet(cause){
  const rows=S.sessions.filter(x=>x.cause===cause);
  const n=rows.length, p=rows.filter(x=>x.outcome==='passed').length, pct=n?Math.round(p/n*100):0;
  const pods=['Morning','Afternoon','Evening','Night']; const pod={}; pods.forEach(x=>pod[x]=0);
  rows.forEach(x=>{ pod[partOfDay(x.hour!=null?x.hour:12)]++; });
  const maxPod=Math.max(1,...pods.map(x=>pod[x]));
  const peak=pods.reduce((a,x)=>pod[x]>pod[a]?x:a,'Morning');
  const s0s=rows.map(x=>x.s0).filter(v=>v!=null);
  const strength=s0s.length?Math.round(s0s.reduce((a,b)=>a+b,0)/s0s.length):null;
  const w=rows.filter(x=>x.outcome==='passed').map(x=>x.elapsed!=null?x.elapsed:x.len).filter(v=>v!=null).sort((a,b)=>a-b);
  const settle=w.length?Math.max(1,Math.round(w[Math.floor(w.length/2)]/60)):null;
  const bars=pods.map(x=>`<div class="ptc ${x===peak&&pod[peak]>0?'peak':''}"><div class="ptb" style="height:${Math.max(6,pod[x]/maxPod*100)}%"></div><div class="l">${x}</div></div>`).join('');
  const el=document.createElement('div');
  el.innerHTML=`<div class="scrim on" data-a="ts-close" style="z-index:50"></div>
    <div class="sheet tsheet on" style="z-index:51">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <h2 style="font-size:calc(22px * var(--fs,1))">${esc(cause)}</h2>
        <button data-a="ts-close" class="grey">${IC.close}</button></div>
      <div class="thero"><div class="big">${pct}%</div><div class="cap">You get through it ${pct}% of the time. That's ${p} of the ${n} time${n===1?'':'s'} it hit.</div></div>
      <div style="margin-top:14px">
        <div class="tdrow"><span class="di">${msvg('schedule')}</span><span class="dl">Hits most often</span><span class="dv">${peak}</span></div>
        ${strength!=null?`<div class="tdrow"><span class="di">${msvg('waves')}</span><span class="dl">Usually feels like</span><span class="dv">${strength} / 10</span></div>`:''}
        ${settle!=null?`<div class="tdrow"><span class="di">${msvg('self_improvement')}</span><span class="dl">Settles in about</span><span class="dv">${settle} min</span></div>`:''}
      </div>
      <div style="font-size:calc(15px * var(--fs,1));font-weight:700;color:var(--ink);margin:20px 0 0">When it hits</div>
      ${hourLine(rows)}
    </div>`;
  document.getElementById('frame').appendChild(el);
  el.addEventListener('click',ev=>{ if(ev.target.closest('[data-a=ts-close]')) el.remove(); });
}

function Patterns(){
  const s=S.sessions;
  const n=s.length;
  const enough=n>=MIN_INSIGHT;
  const parts=[];

  if(!n){
    parts.push(`<div class="pcard"><div class="pins"><span class="ic">${msvg('monitoring')}</span>
      <span class="tx"><span class="t">Nothing yet</span><span class="s">Your insights show up here after your first wave.</span></span></div></div>`);
    return `<div class="home">${navHero('Insights')}<div class="hsheet">${parts.join('')}<div style="flex:1;min-height:20px"></div></div>${Nav('patterns')}</div>`;
  }

  /* ---- Overview: Week / Month ---- */
  const nowMid=(function(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();})();
  const buckets=[];
  if(patPeriod==='week'){
    for(let i=6;i>=0;i--){ const d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i);
      buckets.push({key:d.toISOString().slice(0,10), label:(i===0?'Today':['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()]), p:0, a:0}); }
    s.forEach(x=>{ const b=buckets.find(b=>b.key===x.date); if(b){ if(x.outcome==='passed')b.p++; else if(x.outcome==='acted')b.a++; } });
  } else {
    // five Monday-aligned calendar weeks, labelled by the date each week starts (DD/MM)
    const p2=n=>String(n).padStart(2,'0');
    const kof=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
    const today=new Date(nowMid), dow=(today.getDay()+6)%7;
    const thisMon=new Date(today); thisMon.setDate(today.getDate()-dow);
    const weeks=[];
    for(let i=4;i>=0;i--){ const st=new Date(thisMon); st.setDate(thisMon.getDate()-i*7);
      weeks.push({key:kof(st), label:p2(st.getDate())+'/'+p2(st.getMonth()+1), p:0, a:0}); }
    s.forEach(x=>{ const d=new Date(x.date+'T00:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd);
      const b=weeks.find(w=>w.key===kof(d)); if(b){ if(x.outcome==='passed')b.p++; else if(x.outcome==='acted')b.a++; } });
    buckets.push(...weeks);
  }
  const totWaves=buckets.reduce((a,b)=>a+b.p+b.a,0);
  const totPassed=buckets.reduce((a,b)=>a+b.p,0);
  const passPct=totWaves?Math.round(totPassed/totWaves*100):0;
  const rawMax=Math.max(1,...buckets.map(b=>b.p+b.a));
  let maxY=patPeriod==='week'?Math.max(3,rawMax):rawMax;
  if(rawMax>=maxY) maxY=rawMax+Math.max(1,Math.round(rawMax*0.15));  // headroom so the tallest bar never reaches the legend
  const ticks=[]; if(maxY<=6){ for(let v=maxY;v>=0;v--)ticks.push(v); } else { for(let j=4;j>=0;j--)ticks.push(Math.round(maxY*j/4)); }
  const plotH=130;
  const gl=ticks.map(v=>{const top=((1-v/maxY)*plotH).toFixed(1); return `<div class="pgl" style="top:${top}px"></div><div class="pgn" style="top:${top}px">${v}</div>`;}).join('');
  const cols=buckets.map((b,i)=>{const tot=b.p+b.a,h=(tot/maxY*plotH).toFixed(1),pp=tot?b.p/tot*100:0,ap=tot?b.a/tot*100:0;
    return `<div class="pcol ${i===buckets.length-1?'now':''}"><div class="pbar ${b.a?'':'allp'}" style="height:${h}px">${b.a?`<div class="sa" style="height:${ap}%"></div>`:''}${b.p?`<div class="sp" style="height:${pp}%"></div>`:''}</div><div class="cl">${b.label}</div></div>`;}).join('');

  parts.push(`<div class="pcard">
    <div class="ovhead"><span class="ttl">Overview</span>
      <div class="pseg">
        <button class="${patPeriod==='week'?'on':''}" data-a="pat-period" data-p="week">Week</button>
        <button class="${patPeriod==='month'?'on':''}" data-a="pat-period" data-p="month">Month</button>
      </div></div>
    <div class="pkpis">
      <div class="pkpi"><div class="n">${totWaves}</div><div class="k">Waves</div></div>
      <div class="pkpi pass"><div class="n">${passPct}%</div><div class="k">Passed</div></div>
    </div>
    <div class="pbdh"><span class="t">Breakdown</span>
      <span class="legend"><span><i style="background:var(--act)"></i>Passed</span><span><i style="background:var(--slip)"></i>Gave in</span></span></div>
    <div class="pchart" style="height:${plotH+22}px">${gl}<div class="pplot" style="height:${plotH}px">${cols}</div></div>
  </div>`);

  parts.push(msInsightCard());
  if(n && !enough){ parts.push(`<div class="pcard"><div class="pins"><span class="ic">${msvg('schedule')}</span><span class="tx"><span class="t">A little more to go</span><span class="s">After ${MIN_INSIGHT} waves, your triggers and the times of day they hit show up here. You're at ${n}.</span></span></div></div>`); }

  if(enough){
    /* time of day, all-time */
    const pods=['Morning','Afternoon','Evening','Night']; const pod={}; pods.forEach(x=>pod[x]=0);
    s.forEach(x=>{ pod[partOfDay(x.hour!=null?x.hour:12)]++; });
    const maxPod=Math.max(1,...pods.map(x=>pod[x]));
    const peak=pods.reduce((a,x)=>pod[x]>pod[a]?x:a,'Morning');
    const todBars=pods.map(x=>`<div class="ptc ${x===peak&&pod[peak]>0?'peak':''}"><div class="ptb" style="height:${Math.max(6,pod[x]/maxPod*100)}%"></div><div class="l">${x}</div></div>`).join('');
    parts.push(`<div class="pcard">
      <div class="pins"><span class="ic">${msvg('schedule')}</span>
        <span class="tx"><span class="t">${peak}</span><span class="s">That's when most of your urges hit.</span></span></div>
      ${hourLine(s)}</div>`);

    /* triggers, ranked by how often they come up */
    const byT={}; s.forEach(x=>{ if(!x.cause)return; const g=byT[x.cause]||(byT[x.cause]={n:0,p:0}); g.n++; if(x.outcome==='passed')g.p++; });
    const trigArr=Object.entries(byT).map(([c,g])=>({c,n:g.n,p:g.p,pct:Math.round(g.p/g.n*100)})).sort((a,b)=>b.n-a.n||b.pct-a.pct);
    if(trigArr.length){
      const shown=patShowAll?trigArr:trigArr.slice(0,5);
      const trRows=shown.map(t=>`<button class="ptrow" data-a="pat-trig" data-c="${esc(t.c)}">
        <span class="tn">${esc(t.c)}</span><span class="tk"><div style="width:${t.pct}%"></div></span>
        <span class="tv">${t.pct}%</span><span class="cv">${msvg('arrow_forward','ic16')}</span></button>`).join('');
      const showAll=(!patShowAll&&trigArr.length>5)?`<button class="pshowall" data-a="pat-showall">Show all ${trigArr.length}</button>`:'';
      parts.push(`<div class="pcard">
        <div class="pins" style="margin-bottom:4px"><span class="ic">${msvg('bolt')}</span>
          <span class="tx"><span class="t">Your triggers</span><span class="s">Where you're strong, and where to watch.</span></span></div>
        ${trRows}${showAll}</div>`);
    }
  } else {
    parts.push(`<div class="pcard"><div class="pins"><span class="ic">${msvg('lock')}</span>
      <span class="tx"><span class="t">More coming</span><span class="s">Your triggers and timing unlock after ${Math.max(1,MIN_INSIGHT-n)} more.</span></span></div></div>`);
  }

  return `<div class="home">
    ${navHero('Insights')}
    <div class="hsheet">
      ${parts.join('')}
      <div style="flex:1;min-height:20px"></div>
    </div>
    ${Nav('patterns')}
  </div>`;
}

/* ============ pause engine ============ */
/* ============ ambient sound (Web Audio) ============ */
let AUD=null, silentEl=null;
// iOS silences Web Audio when the ring/silent switch is on and routes it through a quiet
// session. Playing a short looping silent media element on the tap flips the page into the
// louder media-playback session, so the generated ambient is audible either way.
let SILENT_URL=null;
function silentURL(){
  if(SILENT_URL) return SILENT_URL;
  const sr=8000, n=Math.floor(sr*0.25), buf=new ArrayBuffer(44+n*2), dv=new DataView(buf);
  const ws=(o,t)=>{ for(let i=0;i<t.length;i++) dv.setUint8(o+i,t.charCodeAt(i)); };
  ws(0,'RIFF'); dv.setUint32(4,36+n*2,true); ws(8,'WAVE'); ws(12,'fmt '); dv.setUint32(16,16,true);
  dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,sr,true); dv.setUint32(28,sr*2,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true); ws(36,'data'); dv.setUint32(40,n*2,true);
  let bin='', u8=new Uint8Array(buf); for(let i=0;i<u8.length;i++) bin+=String.fromCharCode(u8[i]);
  SILENT_URL='data:audio/wav;base64,'+btoa(bin); return SILENT_URL;
}
function primeAudioSession(){
  try{
    if(!silentEl){ silentEl=new Audio(silentURL()); silentEl.loop=true; silentEl.preload='auto'; silentEl.setAttribute('playsinline',''); }
    const p=silentEl.play(); if(p&&p.catch) p.catch(()=>{});
  }catch(e){}
}
function smoothstep(x){ x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x); }

// breathing patterns for the wave. Each is a list of [phase, seconds]. The default 'exhale'
// is the original 4-in/6-out. patternNow() drives both the ring and the ambient sound, so
// they stay in step whichever pattern is chosen.
const PATTERNS=[
  {id:'exhale', name:'Longer exhale', sub:'4 in, 6 out', steps:[['in',4],['out',6]],
    note:'A small breath in through your nose, a long slow breath out through your mouth.'},
  {id:'sigh', name:'Double breath in', sub:'2 in, top up, 6 out', steps:[['in',2],['in2',1.5],['out',6]],
    note:'Breathe in, take one more short sip of air on top, then let it all go slowly.'},
  {id:'box', name:'Box breath', sub:'4 in, 4 hold, 4 out, 4 hold', steps:[['in',4],['hold',4],['out',4],['hold2',4]],
    note:'The same count all the way round, with a held pause at the top and the bottom.'},
];
const PHASE_WORD={in:'Breathe in', in2:'Top it up', out:'Breathe out', hold:'Hold', hold2:'Hold'};
function patOf(id){ return PATTERNS.find(p=>p.id===id) || PATTERNS[0]; }
function patCycle(p){ return p.steps.reduce((a,s)=>a+s[1],0); }
// where we are in the current pattern at time `now` (seconds): the ring size (0..1),
// the phase word key, and the seconds counting down within this phase.
function patternNow(now){
  const p=patOf(S.pattern), cyc=patCycle(p);
  let t=now%cyc, acc=0, kind='out', dur=1, within=0;
  for(let i=0;i<p.steps.length;i++){ if(t<acc+p.steps[i][1]){ kind=p.steps[i][0]; dur=p.steps[i][1]; within=t-acc; break; } acc+=p.steps[i][1]; }

  else if(kind==='in2') size=0.78+f*0.22;
  else if(kind==='hold') size=1;
  else if(kind==='hold2') size=0;
  else size=1-f;

}
// 5-4-3-2-1 grounding: a self-paced walk back into the room, offered inside the wave alongside
// the breathing patterns. Chosen with S.pattern==='ground'.
const GROUND={ id:'ground', name:'5-4-3-2-1', sub:'A slow walk back into the room',
  note:"Name what's around you, counting down from five. Good for when your head is racing.",
  steps:[
    {n:5, prompt:'things you can see.',   hint:'Anything at all. The floor. A wire. A mark on the wall.'},
    {n:4, prompt:'things you can feel.',  hint:'Your feet in your shoes. The chair. Air on your arms.'},
    {n:3, prompt:'things you can hear.',  hint:'Traffic outside. A fan. Your own breathing.'},
    {n:2, prompt:'things you can smell.', hint:"If you can't smell anything, name two smells you like."},
    {n:1, prompt:'thing you can taste.',  hint:'Tea, toothpaste, or just your own mouth.'} ] };
function isGround(){ return S.pattern==='ground'; }
function practiceLabel(){ return isGround() ? GROUND.name : patOf(S.pattern).name; }
// switching practice: if we leave grounding for a breathing pattern, restart the countdown
// (it was set aside during grounding) so the wave has a fresh clock to run down.
function setPattern(id){
  const wasGround=isGround();

// first-use explainer: has this practice's short "how it works" been shown before?
function seenPractice(id){ return Array.isArray(S.seenPractices) && S.seenPractices.includes(id); }
function _osc(ctx,m,f,type,g0){ const o=ctx.createOscillator(); o.type=type||'sine'; o.frequency.value=f; const g=ctx.createGain(); g.gain.value=g0; o.connect(g); g.connect(m); o.start(); return {o,g}; }
function _noise(ctx){ const b=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; const s=ctx.createBufferSource(); s.buffer=b; s.loop=true; return s; }
function soundPluck(A,when,gain){
  const ctx=A.ctx;

  const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=164.82;
  const g2=ctx.createGain(); g2.gain.value=0.22;

// a gentle two-note bell to call the person back when it's time for the second rating.
// runs through the live ambient context; only reaches them while the app is in the foreground.
function soundChime(){
  const A=AUD; if(!A) return;
  const ctx=A.ctx, t0=ctx.currentTime;
  [[783.99,0],[1174.66,0.16]].forEach(([f,dt])=>{        // G5 then D6, a soft rising call
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
    const h=ctx.createOscillator(); h.type='sine'; h.frequency.value=f*2;
    const hg=ctx.createGain(); hg.gain.value=0.14;

    g.gain.exponentialRampToValueAtTime(0.0004,on+1.4);
    o.connect(g); h.connect(hg); hg.connect(g); g.connect(A.master);

function soundStart(){
  if(AUD) return;
  primeAudioSession();                                                        // flip iOS into the media-playback session
  let ctx; try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const resume=()=>{ try{ if(ctx.state!=='running' && ctx.resume) ctx.resume(); }catch(e){} };
  resume(); setTimeout(resume,200);                                           // some iOS builds need a second nudge
  const master=ctx.createGain(); master.gain.value=0; master.connect(ctx.destination);
  const A={ctx,master,raf:null,lastC:99,lastKind:''};
  _osc(ctx,master,109.75,'sine',0.16); _osc(ctx,master,110.25,'sine',0.16);   // A2
  _osc(ctx,master,164.56,'sine',0.11); _osc(ctx,master,165.06,'sine',0.11);   // E3
  _osc(ctx,master,55,'sine',0.06);                                            // sub
  A.padA=_osc(ctx,master,220,'sine',0); A.padE=_osc(ctx,master,329.63,'sine',0); // pad A3+E4
  const c=_osc(ctx,master,261.63,'sine',0); A.cG=c.g;                          // blowing C4
  const vib=ctx.createOscillator(); vib.frequency.value=5.5; const vibG=ctx.createGain(); vibG.gain.value=1.3; vib.connect(vibG); vibG.connect(c.o.frequency); vib.start();
  const an=_noise(ctx); const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=261.63; bp.Q.value=6; A.airG=ctx.createGain(); A.airG.gain.value=0; an.connect(bp); bp.connect(A.airG); A.airG.connect(master); an.start();
  A.shim=_osc(ctx,master,659.25,'sine',0);                                     // shimmer E5

  const frame=()=>{
    if(!AUD) return;

function soundStop(){
  const A=AUD; if(!A) return; AUD=null;

/* full-screen draining water behind the pause */
let waterCv=null, waterCtx=null, waterW=0, waterH=0;
function waterInit(){
  waterStop();
  const fr=document.getElementById('frame');
  const cv=document.createElement('canvas'); cv.id='watercv';
  cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none';
  fr.insertBefore(cv, fr.firstChild);
  const dpr=Math.min(window.devicePixelRatio||1, 2);
  waterW=fr.clientWidth; waterH=fr.clientHeight;
  cv.width=Math.round(waterW*dpr); cv.height=Math.round(waterH*dpr);
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr);
  waterCv=cv; waterCtx=ctx;
}
function waterStop(){ if(waterCv){ waterCv.remove(); waterCv=null; waterCtx=null; } }
function waterLayer(ctx,W,H,surf,t,amp,k,spd,phase,col){
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=6){
    const y = surf + Math.sin(x*k + t*spd + phase)*amp + Math.sin(x*k*2.1 - t*spd*1.4)*amp*0.4;
    x===0?ctx.lineTo(0,y):ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H); ctx.closePath(); ctx.fillStyle=col; ctx.fill();
}
function waterDraw(prog){
  const ctx=waterCtx; if(!ctx) return;
  const W=waterW,H=waterH; ctx.clearRect(0,0,W,H);
  const surf = H*0.06 + (H*1.06 - H*0.06)*prog;          // near top -> below the bottom
  const t=Date.now()/1000, k=2*Math.PI/W*1.25;
  const lift = 1 - 0.6*prog;                             // fades paler as it drains, so the mood lifts
  const dk=document.documentElement.classList.contains('dark'); const base=dk?'150,140,192':'192,57,43'; const mm=dk?1.7:1;
  const rd = a => `rgba(${base},${(a*lift*mm).toFixed(3)})`;
  // back layer (lighter, slower) then front layer for depth
  waterLayer(ctx,W,H,surf+7,t,7,k*1.7,0.5,2.1,rd(0.08));
  const g=ctx.createLinearGradient(0,surf,0,H);
  g.addColorStop(0,rd(0.12)); g.addColorStop(1,rd(0.24));
  waterLayer(ctx,W,H,surf,t,10,k,0.9,0,g);
  // surface line
  ctx.beginPath();
  for(let x=0;x<=W;x+=6){ const y=surf+Math.sin(x*k+t*0.9)*10+Math.sin(x*k*2.1-t*1.26)*4; x===0?ctx.moveTo(0,y):ctx.lineTo(x,y); }
  ctx.strokeStyle=rd(0.32); ctx.lineWidth=1.5; ctx.stroke();
}

/* welcome screen: the water starts just below the header copy and rapidly falls to its
   resting level, then keeps the gentle undulation. The drama previews the pause metaphor. */
let wcCv=null, wcCtx=null, wcW=0, wcH=0, wcRAF=null, wcLift=0;
function welcomeStop(){ if(wcRAF){cancelAnimationFrame(wcRAF);wcRAF=null} if(wcCv){wcCv.remove();wcCv=null;wcCtx=null;} }
function reduceMotion(){ return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
// Create and warm the water canvas. Called at render, so on first load it happens BEHIND the splash:
// the canvas exists, is promoted to its own compositor layer, and sits high, ready to fall. Nothing is
// recreated at the moment the splash lifts, which is what used to drop frames on slower devices.
function welcomeInit(){
  welcomeStop();
  const hero=document.querySelector('.hero-welcome'); if(!hero) return;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const heroW=hero.clientWidth, heroH=hero.clientHeight;
  const restF=heroH*0.72, restB=restF-44;             // resting surfaces (front lower, back a touch higher)
  const lift0=restF-heroH*0.30; wcLift=lift0;          // start: surface sits just below the header copy
  const cH=heroH+lift0;                                // extend below the hero so the lift never exposes a gap
  const reduce=reduceMotion();
  const cv=document.createElement('canvas'); cv.id='wcwater';
  cv.style.cssText=`position:absolute;left:0;top:0;width:100%;height:${cH}px;z-index:1;pointer-events:none;will-change:transform;transform:translateY(${reduce?0:-lift0}px)`;
  hero.insertBefore(cv, hero.firstChild);
  wcW=heroW; wcH=cH;
  cv.width=Math.round(heroW*dpr); cv.height=Math.round(cH*dpr);
  const ctx=cv.getContext('2d'); ctx.scale(dpr,dpr); wcCv=cv; wcCtx=ctx;
  const ampF=Math.max(11,heroH*0.026), ampB=Math.max(8,heroH*0.019);
  const draw=()=>{
    if(!wcCtx) return; const W=wcW,H=wcH; wcCtx.clearRect(0,0,W,H);
    const t=Date.now()/1000, k=2*Math.PI/W*1.35;
    // back layer (fainter, higher), then front layer for depth - the app's purple, matching the hero
    waterLayer(wcCtx,W,H,restB,t,ampB,k,0.9,0,'rgba(156,147,184,.34)');
    const g=wcCtx.createLinearGradient(0,restF,0,H);
    g.addColorStop(0,'rgba(109,98,153,.58)'); g.addColorStop(1,'rgba(88,78,133,.72)');
    waterLayer(wcCtx,W,H,restF,t,ampF,k,1.15,1.3,g);
    // crest highlight on the front surface
    wcCtx.beginPath();
    for(let x=0;x<=W;x+=6){ const y=restF+Math.sin(x*k+t*1.15+1.3)*ampF+Math.sin(x*k*2.1-t*1.15*1.4)*ampF*0.4; x===0?wcCtx.moveTo(0,y):wcCtx.lineTo(x,y); }
    wcCtx.strokeStyle='rgba(201,193,224,.5)'; wcCtx.lineWidth=1.5; wcCtx.stroke();
    wcRAF=requestAnimationFrame(draw);
  };
  draw();
}
// Trigger the 5s descent. Waits two frames so the reveal paint lands first, then hands the whole
// motion to the compositor. Runs once per mount; the canvas is already warm from welcomeInit.
function welcomeFall(){
  const cv=wcCv; if(!cv) return;
  if(reduceMotion()){ cv.style.transform='translateY(0)'; return; }
  if(cv.dataset.fell) return; cv.dataset.fell='1';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    if(!wcCv) return;
    wcCv.animate([{transform:`translateY(${-wcLift}px)`},{transform:'translateY(0)'}],
      {duration:5000, easing:'cubic-bezier(.45,.05,.55,.95)', fill:'both'});
  }));
}

/* recorded sea, a seamless 30s loop playing across the whole app; louder on home, quieter elsewhere */
let SEA=null, audioUnlocked=false, seaCtx=null, seaBuf=null, seaSrc=null, seaGain=null;
const SEA_LOOP='__PAUSE_WAVES__';                        // 30s crossfaded ocean loop, inlined at build
const SEA_BASE=0.10;                                     // gentle base level across the app
// The sea recedes as you go through your first pause: half on entering, and once that pause is
// done it settles to a quarter and stays there for the rest of the app session. It never climbs
// back up on leaving, and never ducks further on later pauses. (seaSettled is declared up top, before
// boot(), so an expired-pause boot can safely assign it.)
function seaLevel(){
  if(seaSettled) return SEA_BASE/4;                      // fixed calm level once the first pause is behind them
  if(S.view==='pause') return SEA_BASE/2;                // -half during the first pause
  return SEA_BASE;
}
function seaFadeGain(to,secs){
  if(!seaGain||!seaCtx) return;
  try{ const t=seaCtx.currentTime; seaGain.gain.cancelScheduledValues(t); seaGain.gain.setValueAtTime(seaGain.gain.value,t); seaGain.gain.linearRampToValueAtTime(to,t+secs); }catch(e){}
}
function seaDecode(cb){
  if(seaBuf){ cb(seaBuf); return; }
  try{
    const b=atob(SEA_LOOP.split(',')[1]); const u8=new Uint8Array(b.length);
    for(let i=0;i<b.length;i++) u8[i]=b.charCodeAt(i);
    seaCtx.decodeAudioData(u8.buffer, buf=>{ seaBuf=buf; cb(buf); }, ()=>cb(null));
  }catch(e){ cb(null); }
}
function seaStart(){
  if(!S.sound || SEA) return; SEA=true;
  primeAudioSession();                                                       // silent media element holds the iOS playback session
  try{ if(!seaCtx) seaCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ SEA=null; return; }
  const rz=()=>{ try{ if(seaCtx.state!=='running'&&seaCtx.resume) seaCtx.resume(); }catch(e){} }; rz(); setTimeout(rz,200);
  seaDecode(buf=>{
    if(!SEA||!buf) return;
    try{
      seaGain=seaCtx.createGain(); seaGain.gain.value=0; seaGain.connect(seaCtx.destination);
      seaSrc=seaCtx.createBufferSource(); seaSrc.buffer=buf; seaSrc.loop=true;   // sample-accurate, gapless loop
      seaSrc.connect(seaGain); seaSrc.start();

    }catch(e){}
  });
}
function seaLevelSet(){ if(SEA) seaFadeGain(seaLevel(), 0.8); }              // duck to the level for the current screen
function seaStop(){
  if(!SEA) return; SEA=null;
  seaFadeGain(0, 0.6);
  const src=seaSrc, g=seaGain; seaSrc=null; seaGain=null;
  setTimeout(()=>{ try{ src&&src.stop(); }catch(e){} try{ g&&g.disconnect(); }catch(e){} }, 700);
  try{ if(silentEl){ silentEl.pause(); silentEl.currentTime=0; } }catch(e){}
}
// start the sea if it should play, otherwise just set the level for this screen
function seaSync(){ if(S.sound && audioUnlocked){ if(!SEA) seaStart(); else seaLevelSet(); } }

function runPause(){
  const p=S.pause; if(!p){ go('home'); return; }
  if(S.sound) soundStart();
  // the first-use explainer is showing: hold the countdown until they tap Begin
  if(!seenPractice(S.pattern)){ return; }
  // grounding is self-paced with no countdown: keep the ambient sound, skip the timer/ring loop
  if(isGround()){ return; }
  waterInit();
  const ring=document.getElementById('bring'), bw=document.getElementById('breathword'), bc=document.getElementById('breathcount');
  if(S.sound){ const sb=document.getElementById('soundbtn'); if(sb){ sb.classList.add('nudge'); setTimeout(()=>{ if(sb) sb.classList.remove('nudge'); },3300); } }
  const lead=pauseLead(p);
  let lastMsgKey=pauseMsgAt(0,lead).k, revealed=false, lastWord='', lastCount=0;
  const frame=()=>{
    const msLeft = p.endTime - Date.now();
    if(msLeft<=0){ recordPause('passed'); go('passed'); return; }
    const cl=document.getElementById('pzclock'); if(cl) cl.textContent=clock(Math.ceil(msLeft/1000))+' left';
    const prog=Math.min(1, Math.max(0, 1 - msLeft/(p.len*1000)));
    waterDraw(prog);
    // breathing cue follows the chosen pattern; the ring, word and count all come from patternNow
    const now=Date.now()/1000, info=patternNow(now);
    if(ring) ring.style.transform='scale('+(0.6+0.4*info.size).toFixed(3)+')';
    const word=PHASE_WORD[info.kind]||'';
    if(word!==lastWord && bw){ bw.textContent=word; lastWord=word; }
    if(info.count!==lastCount && bc){ bc.textContent=info.count; lastCount=info.count; }
    // the line under the ring: plan, then move nudge, then the reassurance rotation
    const msg=pauseMsgAt(p.len*prog, lead);
    if(msg.k!==lastMsgKey){ lastMsgKey=msg.k; const m=document.getElementById('pzmsg');
      if(m){ m.style.opacity='0'; setTimeout(()=>{ const mm=document.getElementById('pzmsg'); if(mm){ mm.innerHTML=msg.html; mm.style.opacity='1'; } },400); } }
    // reveal the after-rating near the end
    if(!revealed && prog>=0.7){ revealed=true; const box=document.getElementById('strengthbox'); if(box) box.classList.add('show');
      // call them back to rate the wave: a chime (if sound is on) and a gentle buzz
      if(S.sound) soundChime();
      if(navigator.vibrate){ try{ navigator.vibrate([40,70,40]); }catch(e){} }
    }
    pauseRAF=requestAnimationFrame(frame);
  };
  frame();
  document.addEventListener('visibilitychange',onVis);
}
function onVis(){ if(document.visibilityState==='visible' && S.view==='pause' && !isGround() && seenPractice(S.pattern)){
  if(leftOf(S.pause?.endTime)<=0){ recordPause('passed'); go('passed'); } } }

/* ============ input wiring ============ */
function fillRange(el){ const mn=+el.min,mx=+el.max,v=+el.value; const p=(v-mn)/(mx-mn)*100;
  const pausing=document.documentElement.classList.contains('pausing');
  const dk=document.documentElement.classList.contains('dark');
  const c=el.classList.contains('calm')?(pausing&&dk?'#b7addb':'var(--purple)'):'var(--act)';
  const track='var(--faint2)';                 // same soft grey as the dial's unfilled ring
  el.style.background=`linear-gradient(to right,${c} ${p}%,${track} ${p}%)`; }

/* radial, drag-to-set time dial (1–20 min) */
let dialSetMin=null;
function syncLenChips(sec){ document.querySelectorAll('[data-a=bg-len]').forEach(x=>x.classList.toggle('on',+x.dataset.s===sec)); }
// a soft, understated mechanical "tick" as the dial passes each minute, like winding a clock.
// its own tiny AudioContext, created on first use (during the drag gesture, so it unlocks fine).
let uiCtx=null;
function uiTick(){
  if(!S.sound) return;                       // respect the app's sound toggle
  try{
    if(!uiCtx) uiCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(uiCtx.state!=='running' && uiCtx.resume) uiCtx.resume();
    const ctx=uiCtx, t=ctx.currentTime;
    const out=ctx.createGain(); out.gain.value=0.9; out.connect(ctx.destination);
    // click transient: a very short noise burst through a band-pass, quick decay
    const buf=ctx.createBuffer(1, Math.ceil(ctx.sampleRate*0.03), ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2100+(Math.random()*200-100); bp.Q.value=0.9;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.06,t+0.004);   // fast, soft attack; low peak
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.04);  // quick decay
    src.connect(bp); bp.connect(g); g.connect(out); src.start(t); src.stop(t+0.05);
    // tiny wooden body so it reads as a mechanical tick, not a hiss
    const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=185;
    const og=ctx.createGain();
    og.gain.setValueAtTime(0.0001,t);
    og.gain.exponentialRampToValueAtTime(0.03,t+0.004);
    og.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    o.connect(og); og.connect(out); o.start(t); o.stop(t+0.06);
  }catch(e){}
}
function initDial(){
  dialSetMin=null;
  const svg=document.getElementById('dial'); if(!svg) return;
  const cx=110, cy=110, R=82, C=2*Math.PI*R, MIN=1, MAX=20;
  const arc=document.getElementById('dArc'), handle=document.getElementById('dHandle'), lab=document.getElementById('dMin');
  let lastM=null;
  function setMin(m){
    m=Math.max(MIN,Math.min(MAX,Math.round(m)));
    draft().len=m*60; lab.textContent=m;
    const f=m/MAX, a=(-90+f*360)*Math.PI/180;
    arc.style.strokeDasharray=`${(C*f).toFixed(1)} ${C.toFixed(1)}`;
    handle.setAttribute('cx',(cx+R*Math.cos(a)).toFixed(1));
    handle.setAttribute('cy',(cy+R*Math.sin(a)).toFixed(1));
    syncLenChips(m*60);
    if(lastM!==null && m!==lastM) uiTick();   // one soft tick each time a new minute passes
    lastM=m;
  }
  dialSetMin=setMin;
  function fromEvent(e, first){
    const r=svg.getBoundingClientRect();
    const px=(e.clientX)-r.left-r.width/2, py=(e.clientY)-r.top-r.height/2;
    let ang=Math.atan2(py,px)*180/Math.PI;      // 0 = east
    ang=(ang+90+360)%360;                        // 0 at top, clockwise
    let m=Math.round((ang/360)*MAX); if(m<MIN)m=MIN;
    if(!first && lastM!=null && Math.abs(m-lastM)>MAX*0.6) return;  // ignore wrap jumps mid-drag
    setMin(m);
  }
  let dragging=false;
  svg.addEventListener('pointerdown',e=>{ dragging=true; try{svg.setPointerCapture(e.pointerId)}catch(_){} fromEvent(e,true); e.preventDefault(); });
  svg.addEventListener('pointermove',e=>{ if(dragging){ fromEvent(e,false); e.preventDefault(); } });
  const end=()=>{ dragging=false; };
  svg.addEventListener('pointerup',end); svg.addEventListener('pointercancel',end);
  setMin((draft().len||300)/60);
}
function wire(){
  const on=document.getElementById('obName');
  if(on) on.addEventListener('input',e=>{ob.name=e.target.value; const b=document.querySelector('[data-a=ob-next]'); if(b)b.disabled=!ob.name.trim();});
  const ow=document.getElementById('obWhy');
  if(ow) ow.addEventListener('input',e=>{ob.why=e.target.value;});
  const mn=document.getElementById('meName');
  if(mn) mn.addEventListener('input',e=>{S.name=e.target.value; save();});
  const mw=document.getElementById('meWhy');
  if(mw) mw.addEventListener('input',e=>{S.why=e.target.value; save();});
  const mcost=document.getElementById('meCost');
  if(mcost) mcost.addEventListener('input',e=>{ const v=parseFloat(e.target.value); S.costPerDrink=(isFinite(v)&&v>0)?v:null; save(); });
  const mcur=document.getElementById('meCurrency');
  if(mcur) mcur.addEventListener('change',e=>{ S.currency=e.target.value||'₦'; save(); });
  const bs=document.getElementById('bgslider');
  if(bs){ fillRange(bs); bs.addEventListener('input',e=>{ draft().s0=+e.target.value; const v=document.getElementById('bgval'); if(v)v.textContent=e.target.value; fillRange(bs); }); }
  const ps=document.getElementById('pzslider');
  if(ps){ fillRange(ps); ps.addEventListener('input',e=>{ S.pause.s1=+e.target.value; const v=document.getElementById('s1val'); if(v)v.textContent=e.target.value; fillRange(ps); save(); }); }
  const cs=document.getElementById('bgcause'), co=document.getElementById('bgcauseother');
  if(cs) cs.addEventListener('change',e=>{
    const v=e.target.value;
    if(v==='__other__'){ if(co){ co.classList.remove('hidden'); co.focus(); } draft().cause=(co&&co.value.trim())||null; e.target.classList.remove('placeholder'); }
    else { if(co) co.classList.add('hidden'); draft().cause=v||null; e.target.classList.toggle('placeholder', !v); }
  });
  if(co) co.addEventListener('input',e=>{ draft().cause=e.target.value.trim()||null; });
  const pcs=document.getElementById('pxcause'), pco=document.getElementById('pxcauseother');
  if(pcs) pcs.addEventListener('change',e=>{
    const v=e.target.value, last=S.sessions[0]; if(!last) return;
    if(v==='__other__'){ if(pco){ pco.classList.remove('hidden'); pco.focus(); } last.cause=(pco&&pco.value.trim())||null; e.target.classList.remove('placeholder'); }
    else { if(pco) pco.classList.add('hidden'); last.cause=v||null; e.target.classList.toggle('placeholder', !v); }
    save();
  });
  if(pco) pco.addEventListener('input',e=>{ const last=S.sessions[0]; if(last){ last.cause=e.target.value.trim()||null; save(); } });
  const pnote=document.getElementById('pxnote');
  if(pnote) pnote.addEventListener('input',e=>{ const last=S.sessions[0]; if(last){ last.note=e.target.value.trim()||null; save(); } });
  document.querySelectorAll('input[data-plan]').forEach(inp=>{
    inp.addEventListener('input',e=>{ const t=typeOf(e.target.dataset.plan); if(t){ t.plan=e.target.value.trim()||undefined; save(); } });
  });
  initDial();
}

/* ============ click handling ============ */
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, id=el.dataset.id;
  switch(a){
    /* onboarding */
    case'ob-pick':{
      ob.pick.has(id)?ob.pick.delete(id):ob.pick.add(id);
      el.classList.toggle('on', ob.pick.has(id));
      const nb=document.querySelector('[data-a=ob-next]');
      if(nb){ nb.disabled=ob.pick.size===0; nb.innerHTML='Continue '+IC.arrow; }
      break; }
    case'ob-back': ob.step--; render(); break;
    case'ob-next':
      if(ob.step<4){ ob.step++; render(); }
      else{
        const picked=S.types.filter(t=>ob.pick.has(t.id));
        S.name=ob.name.trim()||'there';
        if(picked.length) S.types=picked;                 // keep only the cravings they chose
        S.why=ob.why.trim();                              // their reason, resurfaced later
        S.onboarded=true; S.view='home'; save(); render();
      }
      break;
    case'plan-sug':{
      const inp=document.querySelector('input[data-plan="'+id+'"]');
      if(inp){ const s=el.dataset.s; inp.value = inp.value.trim() ? inp.value.trim()+' and '+s : s;
        const t=typeOf(id); if(t){ t.plan=inp.value; save(); } }
      break; }
    case'add-type': addTypeModal(); break;
    case'export-csv': download('pause-history.csv', buildCSV(), 'text/csv'); break;
    case'share-sum':{ const tx=summaryText();
      if(navigator.share){ navigator.share({title:'Pause',text:tx}).catch(()=>{}); }
      else { download('pause-summary.txt', tx, 'text/plain'); }
      break; }

    /* nav */
    case'nav': go(el.dataset.v); break;
    case'checkin':{ if(!Array.isArray(S.checkins)) S.checkins=[]; if(!checkedInToday()) S.checkins.push(iso()); S.checkins=S.checkins.slice(-400); save(); render(); break; }
    case'checkin-undo':{ if(Array.isArray(S.checkins)) S.checkins=S.checkins.filter(d=>d!==iso()); save(); render(); break; }
    case'read-day':{ readDay=+el.dataset.d||journeyDay(); go('read'); break; }
    case'checkin-home':{ if(!Array.isArray(S.checkins)) S.checkins=[]; if(!checkedInToday()) S.checkins.push(iso()); S.checkins=S.checkins.slice(-400); save(); go('home'); break; }
    case'practice-pick': practiceSheet(); break;
    case'prac-explained':{ if(!Array.isArray(S.seenPractices)) S.seenPractices=[]; if(!S.seenPractices.includes(S.pattern)) S.seenPractices.push(S.pattern); if(S.pause) S.pause.endTime=Date.now()+S.pause.len*1000; save(); render(); break; }
    case'prac-set':{ setPattern(id); render(); break; }   // set default from Settings
    case'g-dot':{ if(S.pause&&S.pause.g){ const st=GROUND.steps[S.pause.g.step]; let v=(+el.dataset.i)+1; if(S.pause.g.filled[S.pause.g.step]===v) v-=1; S.pause.g.filled[S.pause.g.step]=Math.min(st.n,Math.max(0,v)); save(); render(); } break; }
    case'g-next':{ if(S.pause&&S.pause.g){ const g=S.pause.g; if(g.step>=GROUND.steps.length-1){ g.done=true; } else { g.step++; } save(); render(); } break; }
    case'begin': S.draft=null; go('begin'); break;
    case'go-home': go('home'); break;
    case'go-waves': go('waves'); break;
    case'go-patterns': go('patterns'); break;
    case'pat-period':{ patPeriod=el.dataset.p; render(); break; }
    case'pat-showall': patShowAll=true; render(); break;
    case'pat-trig': trigSheet(el.dataset.c); break;
    case'go-privacy': privReturn=S.view; go('privacy'); break;
    case'priv-back': go(privReturn||'me'); break;

    /* begin form */
    case'bg-type':{ draft().typeId=id;
      document.querySelectorAll('[data-a=bg-type]').forEach(x=>x.classList.toggle('on', x.dataset.id===id));
      break; }
    case'bg-s0': draft().s0=+el.dataset.v;
      document.querySelectorAll('.scale>button').forEach((b,i)=>b.classList.toggle('on',i<draft().s0)); break;
    case'bg-cause':{const c=el.dataset.c; const d=draft(); d.cause=d.cause===c?null:c;
      document.querySelectorAll('[data-a=bg-cause]').forEach(x=>x.classList.toggle('on',x.dataset.c===d.cause)); break;}
    case'bg-len': if(dialSetMin){ dialSetMin(+el.dataset.s/60); } else { draft().len=+el.dataset.s; syncLenChips(+el.dataset.s); } break;
    case'bg-finetune':{ const w=document.getElementById('dialbox'); if(w){ const hid=w.classList.toggle('hidden'); el.textContent=hid?'Fine-tune':'Hide dial'; } break; }
    case'bg-start':{const d=draft();
      S.pause={typeId:d.typeId,cause:d.cause,s0:d.s0,s1:d.s0,len:d.len,endTime:Date.now()+d.len*1000};
      S.draft=null; go('pause'); break;}

    /* pause */
    case'pz-s1':{const v=+el.dataset.v; S.pause.s1=v;
      document.getElementById('s1val').textContent=v;
      document.querySelectorAll('.scale.calm>button').forEach((b,i)=>b.classList.toggle('on',i<v)); save(); break;}
    case'pz-passed': recordPause('passed','tap'); go('passed'); break;
    case'pz-acted':{ recordPause('acted'); go('acted'); break; }
    case'pz-quit': S.pause=null; seaSettled=true; save(); go('home'); break;
    case'sound-toggle':{
      S.sound=!S.sound; save();
      const sb=document.getElementById('soundbtn');
      if(sb){ sb.innerHTML=msvg(S.sound?'volume_up':'volume_off','nav24'); sb.style.color=S.sound?'var(--actx)':'var(--mute2)'; }
      if(S.sound){ audioUnlocked=true; soundStart(); seaSync(); } else { soundStop(); seaStop(); }
      break; }

    case'home-sound':{
      S.sound=!S.sound; save();
      const hb=document.getElementById('homesound');
      if(hb){ hb.innerHTML=msvg(S.sound?'volume_up':'volume_off','nav24'); hb.style.color=S.sound?'#FAFAFA':'#8f86ad'; }
      if(S.sound){ audioUnlocked=true; seaSync(); } else { seaStop(); soundStop(); }
      break; }

    /* me */
    case'me-untrack':{ if(S.types.length>1){ S.types=S.types.filter(t=>t.id!==id); save(); render(); } break; }
    case'theme': S.theme=el.dataset.v; save(); applyTheme(); render(); break;
    case'theme-toggle': S.theme = S.theme==='dark'?'light':'dark'; save(); applyTheme(); render(); break;
    case'text-size': S.textScale=parseFloat(el.dataset.v)||1; save(); applyTheme(); render(); break;
    case'wipe-ask': document.getElementById('wipebox').classList.remove('hidden'); break;
    case'wipe-no': document.getElementById('wipebox').classList.add('hidden'); break;
    case'wipe-yes': try{localStorage.removeItem(KEY)}catch(e){}; S=fresh(); ob={step:0,name:'',pick:new Set()}; render(); break;
  }
});

boot();      // load saved state and resolve the opening view — safe here, all helpers are initialized
