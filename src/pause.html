<head>

<title>Pause by Pákó</title>
<style>/*__FONT__*/</style>
<style>
  :root{
    --red:#c0392b; --ink:#0D0D0B; --white:#FAFAFA; --grey:#F2F2F0;
    --purple:#3c3158; --faint:rgba(13,13,11,0.08); --faint2:rgba(13,13,11,0.12);
    --redtint:#f6e6e4; --slip:rgba(13,13,11,.2); --page:#E9E9E6; --accent-lt:rgba(60,49,88,.06);
    --act:#c0392b; --actx:#c0392b;
    --mute:rgba(13,13,11,.6); --mute2:rgba(13,13,11,.42); --mute3:rgba(13,13,11,.28);
    --t1:#efeaf3; --t2:#f7e9e4; --t3:#eae7f0; --m1:#6d6299; --m2:#c0392b; --m3:#3c3158;
    --font:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --maxw:480px;
  }
  .dark{
    --red:#d84b31; --ink:#F3EFE8; --white:#1b1813; --grey:#282320;
    --purple:#9c93b8; --faint:rgba(243,239,232,0.10); --faint2:rgba(243,239,232,0.17);
    --redtint:#241f33; --slip:rgba(243,239,232,.26); --page:#0f0d0a; --accent-lt:rgba(156,147,184,.14);
    --act:#6d6299; --actx:#a79dc6;
    --mute:rgba(243,239,232,.62); --mute2:rgba(243,239,232,.42); --mute3:rgba(243,239,232,.3);
    --t1:rgba(156,147,184,.13); --t2:rgba(216,120,90,.15); --t3:rgba(156,147,184,.08); --m1:#9c93b8; --m2:#d84b31; --m3:#9c93b8;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--page);color:var(--ink);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    display:flex;justify-content:center}
  #frame{width:100%;max-width:var(--maxw);background:linear-gradient(to bottom,#3c3158 0%,#574a7d 46%,#8b7fae 74%,#d8cfe4 100%);position:relative;
    min-height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  .dark #frame{background:linear-gradient(to bottom,#3c3158 0%,#2f2748 30%,#201b2d 64%,#171310 100%)}
  @media(min-width:520px){
    body{align-items:center;padding:22px 0}
    #frame{min-height:min(880px,calc(100dvh - 44px));height:min(880px,calc(100dvh - 44px));
      border-radius:20px;box-shadow:0 1px 0 var(--faint)}
  }
  #app{flex:1;position:relative;z-index:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:transparent}
  .screen{min-height:100%;padding:0 22px;display:flex;flex-direction:column;background:rgba(250,250,250,.7);
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%)}
  .dark .screen{background:rgba(27,24,19,.64)}
  .ob-flow{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}/* onboarding rides the gradient; content screens are frosted glass */
  .pausescreen{background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}/* pause screen stays clear so the draining-water canvas shows through */
  /* the pause is a focused, immersive moment: a deep backdrop in both themes so the draining water pops and every label reads in light cream */
  /* light mode: a soft, light backdrop consistent with the rest of the app — the draining water reads as a warm rose and the normal dark text stays legible */
  .pausing #frame{background:linear-gradient(to bottom,#f2ecf5 0%,#eae1ef 48%,#e4d9e8 100%)}
  /* dark mode: a deep, immersive backdrop so the water glows; text turns light */
  .pausing.dark #frame{background:linear-gradient(to bottom,#1a1526 0%,#171221 42%,#14101b 74%,#100d16 100%)}
  .pausing.dark .pausescreen .grey{color:rgba(243,239,232,.72)}
  .pausing.dark .pausescreen .ink,.pausing.dark .pausescreen .label.ink{color:#F3EFE8}
  .pausing.dark .pausescreen #pzclock{color:rgba(243,239,232,.8)}
  .pausing.dark .pausescreen #pzmsg{color:rgba(243,239,232,.92)}
  .pausing.dark .pausescreen .tlink{color:rgba(243,239,232,.66)}
  .safe{height:env(safe-area-inset-top,0)}

  h1,h2,h3{letter-spacing:-0.02em;line-height:1.12;color:var(--purple)}
  h1{font-size:calc(32px * var(--fs,1));font-weight:800}
  h2{font-size:calc(24px * var(--fs,1));font-weight:800}
  h3{font-size:calc(18px * var(--fs,1));font-weight:700}
  .lede{font-size:calc(16px * var(--fs,1));font-weight:400;line-height:1.6;color:var(--ink)}
  p{line-height:1.6}
  .body{font-size:calc(15px * var(--fs,1));line-height:1.65}
  .grey{color:var(--mute)}
  .label{font-size:calc(11px * var(--fs,1));font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--actx);display:block}
  .label.ink{color:var(--mute2)}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
    height:52px;border-radius:10px;font-size:calc(15px * var(--fs,1));font-weight:700;letter-spacing:.01em;transition:background .15s,opacity .15s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
  .btn-red{background:var(--act);color:#fff}
  .btn-red:active{opacity:.85}
  .btn-ink{background:var(--ink);color:var(--white)}
  .btn-ghost{background:rgba(255,255,255,.16);color:var(--ink);border:1px solid var(--faint2);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
  .dark .btn-ghost{background:rgba(255,255,255,.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  /* the frost + fade live on a ::before layer so the button on top stays crisp and flat, matching the dashboard's "Time to pause" */
  .actionbar::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
    background:linear-gradient(to top,rgba(216,207,228,.86),rgba(216,207,228,0));
    -webkit-mask-image:linear-gradient(to top,#000 58%,transparent);mask-image:linear-gradient(to top,#000 58%,transparent)}
  .dark .actionbar::before{background:linear-gradient(to top,rgba(23,19,16,.9),rgba(23,19,16,0))}
  .actionbar>*{position:relative;z-index:1}
  .btn[disabled]{opacity:.3;pointer-events:none}
  .btn-sm{height:46px;font-size:calc(14px * var(--fs,1))}
  .tlink{font-size:calc(13px * var(--fs,1));font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
    background:none;padding:12px;width:100%;text-align:center}
  .tlink.grey{color:var(--mute)}
  .btn-text{display:inline-block;font-weight:700;text-transform:uppercase;color:var(--ink);
    background:none;border:none;border-bottom:2px solid var(--ink);padding:0 0 2px}
  .arrow{width:15px;height:15px}

  .card{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.5);border-radius:14px;padding:18px;-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%)}
  .dark .card{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .pane-purple{background:var(--purple);border-radius:14px;padding:20px;color:var(--white)}
  .pane-purple .label{color:var(--white);opacity:.7}
  /* subtle stat line: purple labels, values beneath, fine dividers, no fill */
  .statline{display:flex}
  .statline>div{flex:1;padding:0 14px}
  .statline>div:first-child{padding-left:0}
  .statline>div:last-child{padding-right:0}
  .statline>div+div{border-left:1px solid var(--faint)}
  .statline .sk{font-size:calc(11px * var(--fs,1));font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--purple)}
  .statline .sv{font-size:calc(30px * var(--fs,1));font-weight:800;color:var(--ink);margin-top:6px;line-height:1;font-variant-numeric:tabular-nums}
  .statline .sv small{font-size:calc(13px * var(--fs,1));font-weight:600;color:var(--mute2);margin-left:2px}

  /* redesigned home + welcome: sun-and-waves hero, cream sheet, tinted stat tiles */
  .home{min-height:100%;display:flex;flex-direction:column;position:relative}
  .hero{position:relative;background:#3c3158;overflow:hidden}
  .hero-d{flex:0 0 auto;height:250px}
  .hero-w{flex:1 1 auto}
  .herowave{position:absolute;left:0;bottom:0;width:100%;display:block}
  .hero-sun{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 40%,#f0a878,#e07a4e);overflow:hidden;
    --halo:rgba(240,140,78,.55);--halo2:rgba(240,140,78,.28);animation:orbHalo 5s ease-in-out infinite}
  .hero-sun.moon{background:radial-gradient(circle at 32% 45%,#eef0f7,#c9c2dd);--halo:rgba(222,228,248,.5);--halo2:rgba(198,208,240,.26)}
  .hero-sun.moon::before{content:'';position:absolute;width:100%;height:100%;border-radius:50%;background:#3c3158;top:-16%;left:34%}
  @keyframes orbHalo{0%,100%{box-shadow:0 0 16px 3px var(--halo),0 0 32px 9px var(--halo2)}50%{box-shadow:0 0 28px 9px var(--halo),0 0 54px 20px var(--halo2)}}
  @media (prefers-reduced-motion:reduce){.hero-sun{animation:none;box-shadow:0 0 22px 6px var(--halo),0 0 40px 12px var(--halo2)}}
  .hero-toggles{position:absolute;top:calc(env(safe-area-inset-top,0) + 12px);right:14px;display:flex;gap:2px;z-index:3}
  .hero-toggles button{width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#c9c1e0}
  .d-head{position:absolute;top:calc(env(safe-area-inset-top,0) + 40px);left:22px;right:22px;z-index:2}
  .d-hi{font-size:calc(14px * var(--fs,1));font-weight:600;letter-spacing:normal;color:#c9c1e0}
  .d-name{font-size:calc(34px * var(--fs,1));font-weight:800;letter-spacing:-.02em;margin-top:6px;line-height:1;color:#FAFAFA}
  .d-sub{color:#c9c1e0;font-size:calc(14px * var(--fs,1));margin-top:12px;max-width:17em;line-height:1.45}
  .hsheet{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;background:rgba(250,250,250,.72);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);margin-top:-24px;border-radius:24px 24px 0 0;padding:22px 22px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .dark .hsheet{background:rgba(27,24,19,.68);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .stats{display:flex;gap:9px}
  .stat{position:relative;flex:1;height:104px;border-radius:16px;overflow:hidden;padding:13px 11px}
  .stat .n{font-size:calc(26px * var(--fs,1));font-weight:800;color:var(--ink);line-height:1;position:relative;z-index:2;font-variant-numeric:tabular-nums}
  .stat .k{font-size:calc(11px * var(--fs,1));font-weight:600;letter-spacing:normal;color:var(--mute2);margin-top:6px;position:relative;z-index:2;white-space:nowrap}
  .stat svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:44px;display:block}
  .stat.s1{background:var(--t1)} .stat.s2{background:var(--t2)} .stat.s3{background:var(--t3)}
  .hero-copy{position:absolute;top:calc(env(safe-area-inset-top,0) + 40px);left:26px;right:26px;text-align:center;z-index:2}
  .gazer{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:128%;height:auto;z-index:1;pointer-events:none}
  .fignight{display:none}
  .dark .figday{display:none}
  .dark .fignight{display:block}
  .hero-eyebrow{font-size:calc(12px * var(--fs,1));font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#c9c1e0}
  .hero-mark{display:block;margin:0 auto 4px;width:94px;height:auto}
  .ob-illus{width:190px;height:auto;display:block;margin:0 auto}
  .ob-namebg{flex:1;position:relative;margin:0 -22px;padding:9vh 22px 0;overflow:hidden;background:transparent}
  /* onboarding sits on the app gradient; keep the top text light so it reads on purple */
  .ob-flow h1{color:#F3EFE8}
  .ob-flow .grey{color:rgba(243,239,232,.72)}
  .ob-flow input[type=text]{color:#F3EFE8;border-bottom-color:rgba(255,255,255,.34);caret-color:#fff}
  .ob-flow input[type=text]::placeholder{color:rgba(243,239,232,.5)}
  .ob-flow input[type=text]:focus{border-bottom-color:#fff}
  .ob-flow input[type=text].planinput{color:#F3EFE8}/* beat the .planinput dark color inside onboarding */
  .ob-flow .planlabel{color:#F3EFE8}
  .ob-flow .planlabel b{color:#cdc0f2}
  .ob-bg{position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;z-index:0;display:block}
  .dark .ob-bg.figday{display:none}
  .ob-fig{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:128%;height:auto;z-index:0}
  .ob-namebg-top{position:relative;z-index:2}
  .hero-title{font-size:calc(58px * var(--fs,1));font-weight:300;line-height:.98;letter-spacing:-.03em;color:#FAFAFA;margin-top:22px;min-height:calc(58px * var(--fs,1) * 1.96)}
  .hero-title .wv{font-weight:inherit;font-style:normal}
  .rotline{display:inline-block;transition:opacity .9s ease-in-out}
  .rotline.fade{opacity:0}
  .welcome-sheet{flex:0 0 auto;align-items:center;text-align:center;padding-bottom:calc(30px + env(safe-area-inset-bottom,0));
    background:linear-gradient(to bottom,rgba(250,246,238,.44),rgba(250,246,238,.26));
    -webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);
    border-top:1px solid rgba(255,255,255,.6);
    box-shadow:0 -12px 34px rgba(28,18,48,.20),inset 0 1px 0 rgba(255,255,255,.55)}
  .welcome-sheet .w-sub{color:#4c3c22}
  .welcome-sheet .btn-text{color:#5f4a2c}
  .dark .welcome-sheet{background:linear-gradient(to bottom,rgba(26,22,34,.52),rgba(26,22,34,.34));border-top-color:rgba(255,255,255,.16);
    box-shadow:0 -12px 34px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.14)}
  .dark .welcome-sheet .w-sub{color:rgba(243,239,232,.86)}
  .dark .welcome-sheet .btn-text{color:rgba(243,239,232,.8)}
  .w-sub{color:var(--mute);font-size:calc(16px * var(--fs,1));line-height:1.5;margin:0 auto 22px;max-width:20em}
  /* settings controls */
  .themesw{position:relative;width:64px;height:34px;border-radius:18px;background:var(--grey);border:none;cursor:pointer;display:block}
  .themesw .knob{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:var(--purple);color:#fff;display:flex;align-items:center;justify-content:center;transition:transform .2s}
  .themesw.on .knob{transform:translateX(30px)}
  .themesw .knob svg{width:16px;height:16px}
  .iconrow{display:flex;gap:10px}
  .icontab{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border-radius:14px;background:var(--grey);border:none;cursor:pointer}
  .icontab svg{width:22px;height:22px;color:var(--purple)}
  .icontab span{font-size:calc(12px * var(--fs,1));font-weight:600;color:var(--mute)}
  .erasebtn{display:inline-flex;align-items:center;gap:8px;background:none;border:none;color:var(--actx);font-size:calc(14px * var(--fs,1));font-weight:600;padding:8px 0;cursor:pointer}
  .erasebtn svg{width:17px;height:17px}
  .divider{height:1px;background:var(--faint)}

  .chip{padding:9px 14px;border-radius:10px;font-size:calc(14px * var(--fs,1));font-weight:500;color:var(--ink);
    background:var(--grey);white-space:nowrap;transition:all .12s;border:1px solid transparent}
  .chip.on{background:var(--purple);color:var(--white)}
  .chiprow{display:flex;flex-wrap:wrap;gap:8px}
  .lenrow{display:flex;gap:8px}
  .lenchip{flex:1;text-align:center;padding:13px 0;font-size:calc(15px * var(--fs,1));font-weight:600}
  /* if-then plan items */
  .planitem{margin-bottom:24px}
  .planlabel{font-size:calc(15px * var(--fs,1));font-weight:600;color:var(--ink);margin-bottom:10px;line-height:1.4}
  .planlabel b{font-weight:800;color:var(--purple)}
  input[type=text].planinput{font-size:calc(16px * var(--fs,1));font-weight:500;color:var(--ink)}
  .sugrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .sugchip{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:22px;background:var(--grey);
    border:1px solid transparent;font-size:calc(13px * var(--fs,1));font-weight:600;color:var(--ink);cursor:pointer;transition:all .12s}
  .sugchip svg{width:15px;height:15px;color:var(--purple)}
  .sugchip:active{background:var(--purple);color:var(--white)}
  .sugchip:active svg{color:var(--white)}

  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{display:flex;align-items:center;gap:11px;padding:14px;border-radius:12px;background:var(--grey);
    border:1px solid transparent;text-align:left;width:100%;transition:all .12s}
  .tile.on{background:var(--purple);border-color:var(--purple)}
  .tile.on .tile-l{color:var(--white)}
  .tile .ic{width:24px;height:24px;color:var(--purple);flex-shrink:0;display:flex}
  .tile.on .ic{color:#fff}
  .tile-l{font-size:calc(14px * var(--fs,1));font-weight:600;color:var(--ink);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ms{width:22px;height:22px;display:inline-block;vertical-align:middle;flex-shrink:0}
  .ms.arrow{width:16px;height:16px}
  .ms.nav24{width:24px;height:24px}
  .ms.ic16{width:15px;height:15px}
  .ms.big{width:26px;height:26px}
  .tile.dashed{background:transparent;border:1px dashed var(--faint2)}
  .tile.dashed .ic{color:var(--mute2)}
  .tile.dashed .tile-l{color:var(--mute);font-weight:500}
  /* light-mode only: onboarding rides the purple gradient, so light-grey tiles would read inverted there.
     unselected = faint glass, selected = solid white. dark mode already reads correctly, so it's left untouched. */
  :root:not(.dark) .ob-flow .tile{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16)}
  :root:not(.dark) .ob-flow .tile .tile-l{color:#F3EFE8}
  :root:not(.dark) .ob-flow .tile .ic{color:#cdc0f2}
  :root:not(.dark) .ob-flow .tile.on{background:#FAFAFA;border-color:#FAFAFA}
  :root:not(.dark) .ob-flow .tile.on .tile-l{color:#0D0D0B}
  :root:not(.dark) .ob-flow .tile.on .ic{color:#3c3158}
  :root:not(.dark) .ob-flow .tile.dashed{background:transparent;border:1px dashed rgba(255,255,255,.3)}
  :root:not(.dark) .ob-flow .tile.dashed .tile-l{color:rgba(243,239,232,.72)}
  :root:not(.dark) .ob-flow .tile.dashed .ic{color:rgba(243,239,232,.6)}

  input[type=text]{font-family:inherit;width:100%;border:none;border-bottom:2px solid var(--faint2);
    background:transparent;padding:10px 0;font-size:calc(24px * var(--fs,1));font-weight:700;color:var(--purple);letter-spacing:-.01em}
  input[type=text]:focus{outline:none;border-bottom-color:var(--actx)}
  input::placeholder{color:var(--mute3);font-weight:400}

  /* intensity */
  .scale{display:flex;gap:4px}
  .scale>button{flex:1;height:34px;border-radius:6px;background:var(--grey);font-size:calc(11px * var(--fs,1));font-weight:600;
    color:var(--mute2);transition:all .1s;display:flex;align-items:center;justify-content:center}
  .scale>button.on{background:var(--act);color:var(--white)}
  .scale.calm>button.on{background:var(--purple)}

  /* intensity slider */
  /* thin-line treatment to match the wave outlines and breath ring; white knob with a fine purple ring, same on both sliders */
  .range{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;background:var(--faint2);outline:none;margin:8px 0}
  .range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--purple);box-shadow:0 1px 3px rgba(0,0,0,.16);cursor:pointer}
  .range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--purple);box-shadow:0 1px 3px rgba(0,0,0,.16);cursor:pointer}
  #strengthbox{opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .6s ease,transform .6s ease}
  #strengthbox.show{opacity:1;transform:none;pointer-events:auto}
  /* clock-style duration picker */
  .clockrow{display:flex;justify-content:space-between;gap:10px}
  .clockopt{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--mute2);padding:10px 0;border-radius:12px;transition:color .15s,background .15s}
  .clockopt.on{color:var(--purple);background:var(--accent-lt,rgba(60,49,88,.06))}
  .clockopt .cl-track{stroke:var(--faint2)}
  .clockopt .cl-arc{stroke:currentColor}
  .clockopt .cl-num{font-size:calc(15px * var(--fs,1));font-weight:800;color:var(--ink)}
  .clockopt.on .cl-num{color:var(--purple)}
  .clockopt .cl-min{font-size:calc(10px * var(--fs,1));font-weight:600;color:var(--mute2);margin-left:3px}
  /* radial time dial */
  .dialwrap{position:relative;width:220px;height:220px;margin:16px auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
  #dial{width:220px;height:220px;display:block;cursor:pointer}
  .d-track{fill:none;stroke:var(--faint2);stroke-width:3}
  .d-arc{fill:none;stroke:var(--purple);stroke-width:3;stroke-linecap:round}
  .d-handle{fill:#fff;stroke:var(--purple);stroke-width:2}
  .dialval{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  #dMin{font-size:calc(46px * var(--fs,1));font-weight:800;color:var(--purple);line-height:1;font-variant-numeric:tabular-nums}
  .dialunit{font-size:calc(12px * var(--fs,1));font-weight:700;color:var(--mute2);letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
  /* dropdown */
  .selectwrap{position:relative;margin-top:12px}
  .selectwrap .chev{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--mute2);pointer-events:none;display:flex}
  .selectwrap .chev svg{width:20px;height:20px}
  .select{width:100%;font-family:inherit;font-size:calc(15px * var(--fs,1));font-weight:500;color:var(--ink);background:var(--white);
    border:1px solid var(--faint2);border-radius:10px;padding:13px 40px 13px 14px;-webkit-appearance:none;appearance:none;outline:none}
  .select:focus{border-color:var(--purple)}
  .select.placeholder{color:var(--mute2)}
  .notebox{width:100%;margin-top:8px;font-family:inherit;font-size:calc(15px * var(--fs,1));font-weight:500;color:var(--ink);background:var(--white);
    border:1px solid var(--faint2);border-radius:10px;padding:12px 14px;line-height:1.45;resize:vertical;min-height:78px;outline:none}
  .notebox:focus{border-color:var(--purple)}
  .notebox::placeholder{color:var(--mute2);font-weight:400}
  .whybox{width:100%;font-family:inherit;font-size:calc(17px * var(--fs,1));font-weight:500;line-height:1.5;
    border:none;border-radius:14px;padding:16px;resize:none;min-height:132px;outline:none;
    color:#F3EFE8;background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
  .whybox:focus{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
  .whybox::placeholder{color:rgba(243,239,232,.45);font-weight:400}
  .whyl{display:inline-block;font-size:calc(10px * var(--fs,1));font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--actx)}
  .whycard2{display:flex;align-items:center;gap:12px;max-width:23em;margin:18px auto 0;
    padding:13px 16px;border-radius:15px;background:var(--white);border:1px solid var(--faint2)}
  .whycard2-l{flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:var(--actx)}
  .whycard2-l svg{width:30px;height:30px}
  .whycard2-r{flex:1;min-width:0}
  .whyline2{margin-top:3px;font-style:italic;font-weight:500;font-size:calc(15px * var(--fs,1));line-height:1.45;color:var(--purple)}
  .dark .whyline2{color:#cdc0f2}
  .whyline{text-align:center;margin:14px auto 0;max-width:22em;font-style:italic;font-weight:500;
    font-size:calc(15px * var(--fs,1));line-height:1.5;color:var(--purple);opacity:.9}
  .dark .whyline{color:#cdc0f2}
  .whycard{margin-top:18px;padding:15px 17px;border-radius:14px;background:var(--redtint);border:1px solid var(--faint)}
  .whycard-l{display:block;font-size:calc(10.5px * var(--fs,1));font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--actx)}
  .whycard-q{margin-top:7px;font-style:italic;font-weight:500;font-size:calc(16px * var(--fs,1));line-height:1.5;color:var(--ink)}
  .practicepill{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:999px;
    font-size:calc(12.5px * var(--fs,1));font-weight:600;color:var(--purple);
    background:var(--white);border:1px solid var(--faint2)}
  .dark .practicepill{color:#cdc0f2}
  .practicepill .ic16{opacity:.85;margin-right:-2px}
  .praclist{display:flex;flex-direction:column;gap:10px}
  .pracopt{display:block;width:100%;text-align:left;padding:13px 15px;border-radius:13px;
    background:var(--white);border:1px solid var(--faint2)}
  .pracopt.on{border-color:var(--purple);box-shadow:inset 0 0 0 1px var(--purple)}
  .dark .pracopt.on{border-color:#8f86ad;box-shadow:inset 0 0 0 1px #8f86ad}
  .pracn{display:block;font-weight:700;color:var(--ink);font-size:calc(15px * var(--fs,1))}
  .pracs{display:block;margin-top:1px;font-weight:600;color:var(--actx);font-size:calc(11.5px * var(--fs,1));letter-spacing:.02em}
  .pracnote{display:block;margin-top:5px;color:var(--mute2);font-size:calc(12.5px * var(--fs,1));line-height:1.4}
  .gnum{font-size:calc(64px * var(--fs,1));font-weight:800;line-height:1;color:var(--purple)}
  .dark .gnum{color:#cdc0f2}
  .gdots{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:26px}
  .gdot{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--faint2);background:var(--white);
    color:var(--act);font-size:calc(20px * var(--fs,1));font-weight:700;display:flex;align-items:center;justify-content:center;transition:transform .12s ease,background .15s ease,border-color .15s ease}
  .gdot.on{background:var(--act);border-color:var(--act);color:#fff}
  .gdot:active{transform:scale(.92)}
  .gsettled{font-size:calc(22px * var(--fs,1));font-weight:700;color:var(--ink)}
  .expl{margin-top:9vh;text-align:center;max-width:24em;margin-left:auto;margin-right:auto}
  .expl-name{font-size:calc(34px * var(--fs,1));font-weight:800;color:var(--ink);margin-top:8px;line-height:1.06}
  .expl-cad{margin-top:10px;font-weight:700;color:var(--actx);letter-spacing:.02em;font-size:calc(14px * var(--fs,1))}
  .expl-note{margin-top:16px;color:var(--mute);font-size:calc(16px * var(--fs,1));line-height:1.55}

  /* duration segmented */
  .seg{display:flex;gap:8px}
  .seg>button{flex:1;padding:14px 0;border-radius:10px;background:var(--grey);font-weight:700;font-size:calc(15px * var(--fs,1));color:var(--ink)}
  .seg>button .u{font-size:calc(11px * var(--fs,1));font-weight:500;opacity:.5}
  .seg>button.on{background:var(--purple);color:var(--white)}

  /* progress */
  .prog{height:3px;background:var(--faint2);border-radius:2px;overflow:hidden}
  .prog>div{height:100%;background:var(--act);transition:width .4s ease}

  /* steps */
  .steps{display:flex;gap:5px}
  .steps>div{flex:1;height:3px;border-radius:2px;background:var(--faint)}
  .steps>div.on{background:var(--act)}

  /* wave */
  #wave{width:100%;height:150px;display:block;overflow:visible}
  .breathe-dot{transition:none}
  @keyframes breathe{0%,100%{r:9}50%{r:15}}
  /* breathing cue on the pause screen */
  .breathstage{position:relative;width:210px;height:210px;margin:18px auto 0}
  .breathring{position:absolute;inset:0;margin:auto;width:186px;height:186px;border-radius:50%;
    border:2px solid var(--purple);
    background:radial-gradient(circle at center,var(--white) 52%,rgba(0,0,0,0) 100%);
    transform:scale(.6);will-change:transform}
  .breathtext{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  #breathword{font-size:calc(13px * var(--fs,1));font-weight:600;letter-spacing:normal;text-transform:none;color:var(--purple);opacity:.8}
  #breathcount{font-size:calc(40px * var(--fs,1));font-weight:800;color:var(--purple);line-height:1;margin-top:6px;font-variant-numeric:tabular-nums}
  /* gentle nudge so people notice the speaker is a control they can mute */
  @keyframes soundnudge{0%,100%{transform:rotate(0)}18%{transform:rotate(-11deg)}36%{transform:rotate(9deg)}54%{transform:rotate(-6deg)}72%{transform:rotate(3deg)}}
  #soundbtn.nudge{animation:soundnudge 1.05s ease .5s 2}

  /* rows */
  .row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--faint)}
  .dotmark{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .dot-pass{background:var(--actx)} .dot-act{background:var(--mute3)}
  .state{font-size:calc(10px * var(--fs,1));font-weight:700;letter-spacing:.12em;text-transform:uppercase}
  .state.pass{color:var(--actx)} .state.act{color:var(--mute2)}
  /* Home uses sentence-case labels; lowercase never gets wide tracking. Every other screen keeps its tracked uppercase. */
  .homeview .label,.homeview .tlink,.homeview .state{text-transform:none;letter-spacing:normal}
  .homeview .label{font-weight:600;font-size:calc(12px * var(--fs,1))}
  /* pre-pause prompts read as plain questions, not tracked labels */
  .label.qz{text-transform:none;letter-spacing:normal;font-size:calc(14px * var(--fs,1));font-weight:600;color:var(--ink)}
  .homeview .state{font-size:calc(11px * var(--fs,1))}

  /* stats mini */
  .statrow{display:flex}
  .statrow>div{flex:1}
  .statrow .v{font-size:calc(26px * var(--fs,1));font-weight:800;color:var(--white);line-height:1;margin-top:6px}
  .statrow .v small{font-size:calc(13px * var(--fs,1));font-weight:600;opacity:.7}

  .pod{display:flex;flex-direction:column;gap:10px}
  .podrow{display:flex;align-items:center;gap:10px}
  .podrow .pl{width:74px;font-size:calc(12px * var(--fs,1));color:var(--mute)}
  .podbar{flex:1;height:10px;background:var(--grey);border-radius:5px;overflow:hidden}
  .podbar>div{height:100%;background:var(--purple);border-radius:5px}
  .podrow .pc{width:24px;text-align:right;font-size:calc(12px * var(--fs,1));font-weight:600;color:var(--mute)}

  .trig{margin-bottom:12px}
  .trig .tt{display:flex;justify-content:space-between;font-size:calc(14px * var(--fs,1));margin-bottom:4px}
  .trigbar{height:4px;background:var(--grey);border-radius:2px}
  .trigbar>div{height:100%;background:var(--act);border-radius:2px}

  /* patterns: full-width insight tiles */
  .ftile{display:block;width:100%;text-align:left;background:var(--t3);border:none;border-radius:16px;padding:16px 16px;margin-top:10px;font-family:inherit;cursor:default}
  .ftile.itap{cursor:pointer}
  .frow{display:flex;align-items:center;gap:14px}
  .fic{flex:none;color:var(--act);line-height:0}
  .fic .ms.fbig{width:30px;height:30px}
  .ftext{flex:1;display:flex;flex-direction:column;min-width:0}
  .fval{font-size:calc(19px * var(--fs,1));font-weight:800;letter-spacing:-.01em;color:var(--ink);line-height:1.15}
  .fcap{font-size:calc(13px * var(--fs,1));color:var(--mute);margin-top:3px;line-height:1.35}
  .fchev{flex:none;color:var(--mute2);line-height:0}
  .fchev .ms{width:22px;height:22px;transition:transform .2s ease}
  .fchev.open .ms{transform:rotate(180deg)}
  .fhint{font-size:calc(11.5px * var(--fs,1));font-weight:700;letter-spacing:.02em;color:var(--act);margin-top:5px;display:block}
  .fdetail{margin-top:15px;padding-top:15px;border-top:1px solid var(--faint)}
  .pcap{font-size:calc(12.5px * var(--fs,1));line-height:1.5;color:var(--mute);margin-top:12px}
  /* ===== Patterns v2 ===== */
  .ovhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .ovhead .ttl{font-size:calc(16px * var(--fs,1));font-weight:800;color:var(--purple);letter-spacing:-.01em}
  .pseg{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex:none}
  .pseg::-webkit-scrollbar{display:none}
  .pseg button{flex:none;font-family:inherit;font-size:calc(12.5px * var(--fs,1));font-weight:700;padding:6px 14px;border-radius:999px;background:var(--grey);color:var(--mute);border:none;cursor:pointer}
  .pseg button.on{background:var(--purple);color:#fff}
  .pkpis{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:13px}
  .pkpi{border-radius:13px;padding:15px 16px;background:var(--grey)}
  .pkpi.pass{background:var(--redtint)}
  .pkpi .n{font-size:calc(30px * var(--fs,1));font-weight:800;letter-spacing:-.02em;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums}
  .pkpi.pass .n{color:var(--act)}
  .pkpi .k{font-size:calc(13px * var(--fs,1));color:var(--mute);margin-top:6px}
  .pbdh{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
  .pbdh .t{font-size:calc(13.5px * var(--fs,1));font-weight:700;color:var(--ink)}
  .pchart{position:relative;margin-top:20px}
  .pgl{position:absolute;left:16px;right:0;height:1px;background:var(--faint)}
  .pgn{position:absolute;left:0;transform:translateY(-50%);font-size:calc(10px * var(--fs,1));color:var(--mute2);font-variant-numeric:tabular-nums}
  .pplot{position:absolute;left:16px;right:0;top:0;display:flex;align-items:flex-end;gap:8px}
  .pcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;justify-content:flex-end}
  .pbar{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;gap:2px;min-height:3px}
  .pbar .sp{background:var(--act);border-radius:0 0 4px 4px;min-height:3px}
  .pbar .sa{background:var(--slip);border-radius:4px 4px 0 0;min-height:3px}
  .pbar.allp .sp{border-radius:4px}
  .pcol .cl{font-size:calc(10.5px * var(--fs,1));color:var(--mute);font-weight:600}
  .pcol.now .cl{color:var(--ink);font-weight:700}
  .pins{display:flex;align-items:flex-start;gap:13px}
  .pins .ic{color:var(--act);flex:none;margin-top:2px;line-height:0}
  .pins .ic .ms{width:26px;height:26px}
  .pins .tx{flex:1;min-width:0}
  .pins .tx .t{display:block;font-size:calc(17px * var(--fs,1));font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .pins .tx .s{display:block;font-size:calc(13px * var(--fs,1));color:var(--mute);margin-top:2px;line-height:1.35}
  .ptod{display:flex;align-items:flex-end;gap:10px;height:72px;margin-top:16px}
  .ptc{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
  .ptc .ptb{width:100%;background:var(--purple);opacity:.38;border-radius:4px;min-height:4px}
  .ptc.peak .ptb{opacity:1}
  .ptc .l{font-size:calc(10.5px * var(--fs,1));color:var(--mute);font-weight:600}
  .ptc.peak .l{color:var(--ink);font-weight:700}
  .ptrow{display:flex;align-items:center;gap:12px;padding:13px 0;border:none;border-bottom:1px solid var(--faint);width:100%;background:none;text-align:left;font-family:inherit;cursor:pointer}
  .ptrow:last-of-type{border-bottom:none}
  .ptrow .tn{font-size:calc(15px * var(--fs,1));font-weight:600;color:var(--ink);width:118px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ptrow .tk{flex:1;height:7px;border-radius:5px;background:var(--faint);overflow:hidden}
  .ptrow .tk>div{height:100%;background:var(--act);border-radius:5px}
  .ptrow .tv{font-size:calc(13.5px * var(--fs,1));font-weight:800;color:var(--ink);width:42px;text-align:right;font-variant-numeric:tabular-nums}
  .ptrow .cv{color:var(--mute2);display:flex}
  .pshowall{width:100%;background:none;border:none;font-family:inherit;font-size:calc(13px * var(--fs,1));font-weight:700;color:var(--act);padding:12px 0 2px;cursor:pointer;text-align:center}
  .tsheet .thero{background:var(--redtint);border-radius:14px;padding:18px 16px}
  .tsheet .thero .big{font-size:calc(42px * var(--fs,1));font-weight:800;color:var(--act);letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
  .tsheet .thero .cap{font-size:calc(14px * var(--fs,1));color:var(--ink);margin-top:8px;line-height:1.4}
  .tdrow{display:flex;align-items:center;gap:14px;padding:15px 2px;border-bottom:1px solid var(--faint)}
  .tdrow:last-of-type{border-bottom:none}
  .tdrow .di{color:var(--purple);flex:none;line-height:0}
  .tdrow .di .ms{width:22px;height:22px}
  .tdrow .dl{flex:1;font-size:calc(14.5px * var(--fs,1));color:var(--mute)}
  .tdrow .dv{font-size:calc(15px * var(--fs,1));font-weight:800;color:var(--ink)}
  /* ===== Milestones ===== */
  .mcard{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:16px 0 14px;margin-top:14px}
  .dark .mcard{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1)}
  .mcard:first-child{margin-top:2px}
  .mhead{display:flex;align-items:center;gap:10px;padding:0 18px}
  .mhead .mi{color:var(--act);flex:none;display:flex;line-height:0}
  .mhead .mi .ms{width:22px;height:22px}
  .mhead .mt{font-size:calc(16px * var(--fs,1));font-weight:800;color:var(--purple);letter-spacing:-.01em}
  .mhead .mcd{margin-left:auto;font-size:calc(12.5px * var(--fs,1));font-weight:700;color:var(--mute)}
  .journey{position:relative;overflow-x:auto;scrollbar-width:none;padding:12px 34px 6px}
  .journey::-webkit-scrollbar{display:none}
  .journey .rail{position:absolute;top:58px;height:4px;background:var(--faint);border-radius:3px;z-index:0}
  .journey .raildone{position:absolute;top:58px;height:4px;background:var(--act);border-radius:3px;z-index:0}
  .stations{position:relative;z-index:1;display:flex;align-items:center;gap:16px;height:92px;width:max-content}
  .node{flex:none;position:relative}
  .node.earned{filter:drop-shadow(0 3px 8px rgba(192,57,43,.24))}
  .node.earned.t1{filter:drop-shadow(0 3px 8px rgba(87,74,125,.28))}
  .node.earned.t2{filter:drop-shadow(0 3px 8px rgba(60,49,88,.3))}
  .node.earned.t3{filter:drop-shadow(0 3px 10px rgba(198,145,40,.4))}
  .node.next{filter:drop-shadow(0 5px 14px rgba(192,57,43,.26))}
  .node .nlock{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:var(--grey);border:2px solid var(--white);display:flex;align-items:center;justify-content:center;color:var(--mute2)}
  .node .nlock .ms{width:11px;height:11px}
  .mstrip{display:flex;align-items:center;gap:14px;width:100%;background:none;border:none;font-family:inherit;text-align:left;cursor:pointer;padding:0}
  .mstrip .node{filter:none}
  .mstx{flex:1;min-width:0}
  .mstx .t{display:block;font-size:calc(15px * var(--fs,1));font-weight:700;color:var(--ink)}
  .mbar{display:block;height:6px;border-radius:4px;background:var(--faint);overflow:hidden;margin-top:9px}
  .mbar>span{display:block;height:100%;background:var(--act);border-radius:4px}
  .mchev{color:var(--mute2);flex:none;display:flex}
  /* daily check-in */
  .cin{background:var(--grey);border-radius:16px;padding:15px 16px;display:flex;align-items:center;gap:12px;margin-bottom:18px}
  .dark .cin{background:rgba(255,255,255,.06)}
  .cin .ctx{flex:1;min-width:0}
  .cin .ct{display:block;font-size:calc(15px * var(--fs,1));font-weight:800;color:var(--ink)}

<body>
<div id="frame">
  <div id="splash"><div class="splash-in">
    <img class="splash-mark" src="__PAUSE_FAVICON__" alt="">
    <img class="splash-word" src="__PAUSE_SCRIPT__" alt="Pause">
    <div class="splash-by">by Pákó</div>
  </div></div>
  <div id="app"></div>
</div>
<script>
"use strict";

/* ============ config ============ */
const APP = { name:"Pause", by:"Pákó", lockup:"Pause by Pákó", brand:"Pákó Habit Lab" };
const TYPES_SEED = [
  { id:'smoke',  label:'Cigarettes', icon:'smoking_rooms' },
  { id:'drink',  label:'Alcohol',    icon:'sports_bar' },
  { id:'sugar',  label:'Sugar',      icon:'cake' },
  { id:'phone',  label:'The phone',  icon:'devices' },
  { id:'bet',    label:'Betting',    icon:'casino' },
  { id:'porn',   label:'Porn',       icon:'18_up_rating' },
  { id:'junk',   label:'Junk food',  icon:'fastfood' },
  { id:'caf',    label:'Caffeine',   icon:'local_cafe' },
  { id:'spend',  label:'Spending',   icon:'shopping_bag' },
];
const CAUSES = ['Stress','Boredom','Tired','Hungry','After a meal','Around people','Low mood','Just habit'];

/* ============ Journey 1: 30 days. one intention + one read per day. ============ */
const JOURNEY_1 = { name:'Ride the wave', days:[
  {i:"When I crave {thing}, all I have to do is watch.", r:"Start here, because this is the whole idea, and everything else in the app is built on it. A craving feels like it'll climb and climb until you give in. It won't. Every craving is a wave. It rises, it peaks, and then it falls, whether you give in or not. That urge that feels unbearable at 9pm is usually gone about fifteen minutes later, as long as you don't act on it.\nSo you don't have to fight it, and you don't have to win a staring contest with yourself. You only have to outlast it. That's what this app is for. When the pull toward {thing} hits, open Pause and start a wave. Set yourself a short timer, breathe, and watch the craving do what every wave does. Break. This is just waiting it out, on purpose, while time does the work for you.\nWhen it passes, tell the app it passed. If you gave in, tell it that too. Either way there's no lecture here, because this was never about being perfect. A time you give in is just information. Note it, and keep going. It doesn't erase the good days you've stacked up.\nAnd it gets easier. That's the part people don't believe until they feel it for themselves. Each time you sit through a craving without acting on it, your brain learns that the urge doesn't get what it's chasing, so the next time it shows up a little weaker. The cravings that feel impossible this week slowly get quieter, come less often, and get easier to watch pass. You're training your brain, one wave at a time, and it won't take forever.\nThat's all you need to know to begin. So today, when the wave rises, don't fight it and don't give in. Start your timer, and watch it break."},
  {i:"I'll let time solve what only time can.", r:"Many cravings peak and pass inside about fifteen minutes. That's just how they work. That urge that feels like it will never end at 9 pm is usually gone by quarter past IF you don't feed it. The problem is that those fifteen minutes feel like an hour, and your brain spends that time inventing reasons why it's okay to give in just this once. Don't argue with it. Start the clock instead. Tell yourself you can give in at the end if you still want it as bad, and watch what fifteen minutes does to a feeling that seemed like it would last forever."},
  {i:"I'll make the good choice the easy one.", r:"Willpower runs down like a battery. By evening, your willpower is flat, just like everyone else's, and that's exactly when cravings are strongest. This is why relying on grit fails. The most 'disciplined' people you know aren't fighting harder; they've arranged their lives so there's less to fight. So nothing is tempting within reach. Sometimes that means taking a different route home. Or plan something else ahead of time to do at the hour when the craving usually hits. The best time to beat a craving is long before it arrives, by making it a little harder to give in and the better choice a little easier. Don't grind. Rig the room."},
  {i:"I'll learn to look beyond my cravings.", r:"Cravings rarely come from nowhere. They ride on top of some simpler feeling. Like being hungry, angry, lonely, or tired. HALT. So when next that urge hits hard, halt for a minute and run the list. Have you eaten? Are you annoyed about something? Perhaps you're alone and feeling a bit restless? Or running on little sleep? More often than you'd think, your urge is standing in for a meal, a phone call, or an early night. Fulfil the real need underneath, and the craving often loses its grip."},
  {i:"I'll notice my triggers without judgment.", r:"Your cravings have patterns. They can be a time of day, a place, a person, or a feeling. You've probably never looked straight at them, but a trigger you can name is a trigger you can plan for. For example, the Friday wind-down after a long week. Or a fight with your partner or friend. Or the empty feeling of your home in the evenings. Having triggers doesn't make you weak; it makes you human, which is just fine. It means you can start paying attention to the moment just before your craving comes, not only the craving itself. And you'll often find that's where the real information is."},
  {i:"I will not fight unnecessary battles.", r:"When a craving lands, your instinct may be to be still and resist. Don't. Move. One of the most powerful things you can do when a craving comes along is change your surroundings, because the urge is wired to where you are. Leave the room. Step outside. Get in the shower. Go somewhere else. It feels too simple to work, so people skip it and struggle instead. Your craving is partly the room talking. Change the room and you turn the volume down before you've spent any willpower at all."},
  {i:"I'll remember that craving is something I have, not something I am.", r:"\"I need this\". \"I can't do this\". \"I'll feel better if\"...\nIt's convincing because it sounds like you. But it isn't really you. It's an old circuit doing its job, and its job is wanting. You can notice the wanting without becoming it, the same way you can notice you're cold without becoming the cold. Put a little space between you and the voice. Let it say its piece. Then decide what you will do. You have the power."},
  {i:"My mind may want what it wants, but I decide what I need.", r:"Did you know? The brain chemical called dopamine isn't really about pleasure, it's about the chase. It spikes before you act, in the wanting, not after, in the having. That gap is the trap. Your brain promises a satisfaction you never quite get from {thing}, which is why you need more and more and never stop at one. When you feel that pull today, recognise it for what it is. It isn't proof {thing} is good for you. It's a chemical promise your brain makes and rarely keeps."},
  {i:"Today, I will feed myself, not the machine.", r:"Think about how you check your phone. Most times there's nothing there, but every so often something good is waiting: a message, a bit of news, a small hit of good feeling. That \"every so often\" is the hook. If the reward came every single time, or never came at all, you'd lose interest and stop reaching for it. It's the uncertainty that keeps your thumb moving. A lot of cravings run on the same trick. Sometimes giving in is what you hoped for. Mostly it's fine, then flat, then worse an hour later. But your brain files away the good times and forgets the rest, so it keeps you reaching for a prize that mostly isn't there. Again, the pull is natural. Today, see what happens when you don't give in."},
  {i:"I won't trust the voice that says just one.", r:"Just one. You've had a tough day. You've earned it. You'll be good tomorrow. Craving is a lawyer, and it only ever argues one side. It doesn't care how you'll feel after just one, or how it went the last time you promised you'd not have any more than one. So stop arguing back. It's no use. When you hear that reasonable voice making the reasonable case for the thing you already decided against, let it yap. You don't have to listen. If you like, give it a name. Psychologists say that this technique can help you create distance from the craving. Our recommendation: say out loud, \"Lie Lie Lawyer has come again.\" Unless you're a lawyer yourself."},
  {i:"I'll play the whole story forward before I decide.", r:"You might know Anansi, the trickster spider from the old stories. Anansi always spots the shortcut, the clever little scheme that gets him what he wants right now. And in almost every tale it works, right up until it doesn't, because Anansi never plays the story to the end before he acts.\nA craving is that same kind of trickster. It shows you a trailer of the first hit, the relief, the little rush, and then it cuts the reel right there, just before the part where it all comes due. Your job is to keep the tape rolling. Play it past the first move to the second, past the rush to the flatness that follows, all the way to how you'll feel about it a few hours later. Then rewind and play the other version. The one where you have a clear head. Where you feel proud of a moment you handled on your own. Where there's nothing to clean up. Cravings only ever live in the next few minutes, so you win by seeing further down the road than they can. Don't just watch the trailer. Play the whole story forward, the way Anansi never does."},
  {i:"I will change what I can and leave alone what I cannot.", r:"Every habit runs on a simple loop: a cue, a routine, a reward.\nSomething triggers you (a thought, a sight, a sound, or a person), you turn to {thing}, and you feel the tension ease. If it were possible to rid the world of triggers, you wouldn't need this app. But there's only so much any of us can do about our situation sometimes. That time of day will come every day; those stressful feelings will come up, and the triggering place will not suddenly disappear.\nBut you get to change how you respond. Same cue, but now a new routine, and you get the same reward, or at least close enough to satisfy. For example, you feel the trigger, and this time you take a nice bath, or go for a walk, or call someone, and your shoulders still drop. Do that enough times, and the old loop gradually fades. You're not deleting the habit. You're giving it somewhere better to go."},
  {i:"I'm becoming a person who has control of their habits.", r:"Stop for a second and look at what you've already done. You've felt cravings that used to run the show, and here you are, taking back control, still going. Every wave you watched pass was real. None of them was easy, and you watched them anyway. You should think about what that means, because the story in your head might still be the old one, the one where you can't do this and never could. That story is now officially out of date. You don't need to feel strong or certain to keep going. You only need to do the next small thing, the way you already have, more times than you realize. You're not hoping you can do this anymore. You're proving it, one wave at a time."},
  {i:"Today I'll find one way to settle that isn't giving in.", r:"Giving in to take the edge off works, and that's precisely the problem. It's a fast, reliable way to drop your shoulders, so your brain registers it as the best answer to stress and stops looking for any other. The trouble is it borrows tomorrow's calm at a terrible rate of interest. The skill here isn't gritting your teeth through the stress. It's building yourself another way out. Ten minutes of walking. A hot shower. A few slow breaths. Chatting to someone you love. None of these hit as fast as giving in, that's true, but none of them sends you a bill in the morning either. Pick one today and really try it. You're teaching your brain there's more than one door out of a hard moment."},
  {i:"I make peace with my slips and don't let them define me.", r:"In the old stories, the tortoise is always getting himself into trouble. He schemes, he overreaches, and often he takes a bad fall, the kind that cracks his shell into pieces. But here's the thing about the tortoise. He's never finished. As bad as it gets, he picks himself up, patched shell and all, and turns up again in the very next story, a little wiser for it.\nThink of a slip the same way. There will be days you give in, and you'll feel awful. But success on this journey was never about whether you ever slip. It's what you do after. The trap is thinking that one slip means the day is ruined and you're back to square one, so you might as well let the week go too, and then the whole thing crumbles. That story does far more damage than the slip ever could. A slip is one wave. It doesn't wipe out the run behind it. So notice it, be honest about what led there, and be as kind to yourself as you'd be to a good friend who stumbled. Then let the next wave be just the next wave. Falling isn't the failure here. Deciding you've fallen for good is."},
  {i:"Today I'll refuse the 'might as well'.", r:"There's a name for the thing that turns one slip into a big deal. Psychologists call it the what-the-hell effect. You break your own rule; you feel like you've failed, and the feeling is so uncomfortable that you reach for the very thing that caused it, just to make the feeling stop. One becomes ten. But the math is on your side, if you let it be. One slip is one slip. It's a bad hour, not a lost month, unless you decide it's a lost month and act like it. You can reset right there by refusing the 'might as well'. Stop at one. It's never too late to stop, and the sooner you do, the smaller a slip stays."},
  {i:"Today I'll act like the person I'm becoming.", r:"There's a real difference between \"I'm not doing this tonight\" and \"this isn't really me anymore.\" The first is a rule you have to enforce on yourself, over and over, and it's exhausting. The second is simply who you are, and you don't sit up arguing with yourself about who you are. You're not on a diet from your old life, waiting to go back to it. You're becoming someone with different defaults. That doesn't happen with a big announcement. It happens little by little, by stacking up ordinary days where you act like that person, until one day your brain stops asking and just believes it. Today is one of those days. You don't have to feel like a new person yet. You only have to move like one."},
  {i:"Today I'll change my environment in my favour.", r:"Everyone wants the easy way. And there's nothing wrong with that. It's natural to take the path of least resistance. So if you find that you always need to put up a hard fight to resist your cravings, maybe take an honest look around your life and ask what makes giving in the path of least resistance. Maybe it's the route home that goes right past the place you always stop for {thing}. Or maybe it's the one friend you see every day who isn't changing their habits anytime soon. You don't have to blow up your whole life to change your routine. You just have to tilt the ground a little in your favour. Move one thing out of the house. Change the route. Prepare what you'll say to your friend beforehand. Every bit of friction you put between yourself and {thing}, and every bit you take off the better choice, is willpower you won't have to spend later. Make it easier to do the right thing. You deserve an easier fight."},
  {i:"I will not please others at my expense.", r:"People can make this journey easier or much harder, and not because they mean any harm. They will offer you the thing you're trying to stay away from. A friend may get a little uneasy when you change, because the fact that you can change says something about them. Most of it is just habit and a bit of discomfort, not malice. Your move is to decide your answer before you're in the room, so you're not negotiating on the spot with the thing already in front of you. Know your line. Have a simple reply ready, and say it plainly and warmly. \"I'm good, thanks\" is a full sentence. You don't owe anyone a speech, and you certainly don't owe anyone an explanation for looking after yourself."},
  {i:"I'll take pride in what I'm building.", r:"You may already feel a shift in your cravings. That's a good sign if you do. But it means the daily danger isn't just a giant craving. It's a shrug. The newness has worn off, big feelings have settled, and a voice in your head may have started wondering if you need to do this every single day or if any of this even matters. It does, and this is exactly the stretch where many people drift back, not because a wave beat them, but because they stopped paying attention. So pay attention on purpose. Look back at the days that have passed. The waves you rode out. The mornings you didn't have to put back together after a slip. This was never about being perfect. It's about the pile of good days slowly getting taller, one laid on top of the other. You've built something real here, even if it doesn't feel dramatic from the inside. Keep stacking. The pile is what matters."},
  {i:"Today I'll hold on to why I started.", r:"There was a moment in your life that made you want to change. Maybe it was a difficult moment, or maybe it was just a tired, foggy, \"not this again\" moment. It's easy to lose sight of it once things start feeling better, and that's not always a bad thing. If there's a lot of shame around that moment, it may feel easier to never think about it again. But the way we see it, that was a big moment. It was Day 1, and you only ever get one of those. So don't lose sight of what all this effort is actually buying you. A clearer head. Being properly present for the people you love. The steady, underrated feeling of trusting yourself again. Picture the version of you a few months down this road, the one who kept going. That person is real, and you're building them right now, today. And you should be proud."},
  {i:"I'll chase progress, not perfection.", r:"Streaks are brittle things. One slip and the counter snaps back to zero, and that zero can feel like proof you've failed, which sends a lot of people straight back to the thing they were trying to leave. So don't hang everything on a perfect, unbroken chain. What actually matters is your best run, the longest stretch you've managed so far, because a single bad day can't erase what you've already shown yourself you can do. You went that many days. That happened. It's yours, and it survives a slip. So aim to match it, then beat it, and let the odd bad day be exactly what it is: one day, not the whole story. Progress was never a straight line anyway. It's a funky line headed up, with dips along the way."},
  {i:"I'll notice what I'm getting back.", r:"{money}This journey isn't only about what you don't do anymore. It's also about everything you can do with the space you've freed up. And unlike your urges, this stuff doesn't announce itself. For example, the money that stayed in your account. The hours you got back. Your sleep slowly returning to normal after perhaps months or years. The way you're beginning to trust your own word again. These gains are shy. They won't shout for your attention, so you have to go looking for them now and then. Not just to congratulate yourself, though you're allowed to and you definitely should, but also because seeing the pile makes the next wave a little easier. You've been paying into a life-changing account. So today, take a proper look at the balance. We can guarantee you're earning more than you think."},
  {i:"Today I'll tie this to something I genuinely care about.", r:"Rules run out of fuel. \"I'm not allowed\" works until you're tired or stressed enough to stop caring what you're allowed, which is often exactly when your craving turns up. What's more durable is a reason that's truly yours. {why}Like being there, really there, for the people you love. Doing your work without the fog. Being someone whose word means something, to others and to yourself. So when the craving comes, don't only reach for the rule. Reach for your reason. Ask yourself plainly: {thing}, or the thing I actually want? Willpower is weak, flickery fuel. A value you hold close burns slow and steady, and it doesn't run flat by the end of a long day."},
  {i:"Today I'll trust that every wave I don't feed shrinks the next one.", r:"Breaking good news: cravings shrink. Every single time a wave rises, and you don't feed it, you're teaching that old circuit that the lever doesn't pay out anymore. And slowly but surely, it stops pulling so hard. The urges that felt impossible in week one get quieter, less frequent, and easier to watch go by. It doesn't happen all at once, and it isn't a tidy straight line, so it's okay if you haven't already noticed it. But you are not going to be struggling forever. That isn't how brains work. You're retraining your mind, and every craving you sit through is a small deposit into a version of you that simply wants it less.\nWhat we're saying is that it gets easier from here. Keep going. You're closer than you think."},
  {i:"Today I'll let the good choice start becoming the automatic one.", r:"At first, you have to put in real effort every time you hold the line and resist the urge, and yes, it can be tiring. But over time, you'll see that habits run in both directions. Do something else enough times, in the same slots as the old habit, and it stops being a decision and becomes simply what you do. Like going for a walk when the urge for {thing} hits hard. Or brewing a fancy cup of tea at the danger hour. The walk after dinner. The earlier night. One day, and it will sneak up on you, you'll realise you didn't have to fight the craving at all, because it barely turned up. The loop it used to run on now runs something else. That's the goal. Not a lifetime of struggle, but a new default that mostly takes care of itself. And then you won't need this little app anymore. Which is great."},
  {i:"I am not alone on this journey. I am open to the help I need.", r:"This journey may look simpler to do on your own. But on your own is also, unfortunately, the least helpful way to do it. When you're alone with it, the only other voice in the room is the craving's, and it can be very persuasive at 8pm on a Friday. Just one other person in your corner can change the whole equation. Not to give you a lecture. And not necessarily for a daily check-up, just so somebody knows, so there's a name and a number for the hard moments, so it isn't all sealed up inside your head.\nThe cruel little trick is that when you most need to reach out, it's hardest to do so. The solution? Decide now, while things are calm. Pick one person you trust and let them in, even a little. And consider speaking to a professional. If you've been carrying this on your own, you really don't have to."},
  {i:"I'm ready because I plan ahead.", r:"There's going to be a day that really tests your resolve. A loss, a fight, some unexpected news, the kind of day the old you would have used {thing} to get through. The very worst time to make a plan is in the middle of a wave. So make the plan now, today, while you can think clearly and there's some calm. And if you already put a plan in the app, now is a good time to revisit it. Are you doing what you said you would? Do you need something more? What will you do when the wave is enormous? Who will you call first? Where will you physically take yourself? Put it in the app or write it somewhere you'll see it often. That way, on the day it matters, you're not trying to out-argue a craving in real time. You're following a plan the calm, clear-headed version of you already made."},
  {i:"I am grateful for the progress I've made.", r:"Think back to the person who started this journey about a month ago. The one who wasn't sure they'd last a week, or half expected to fail before they'd even begun. Look at them kindly, and then notice: you're not quite that person anymore. Somewhere in these weeks, in small ordinary choices, you became someone who watches a wave and lets it pass. Someone who has hard moments and gets through them. Someone who does the very thing they doubted they could. This moment in your journey is the combined effect of the choices you made every day. Whoever you were before this, you're becoming someone better. Take a moment to thank your past self for the work they put in. And receive thanks from your future self for the work that is yet to come."},
  {i:"I am ready for what's to come.", r:"Thirty days. Whatever mix of steady and hard days got you here, you showed up for it, and that's the whole thing. But this was never really a thirty-day fix, because those don't exist. What you've built is a foundation. You now know from your own lived experience that a craving is a wave that peaks and falls, and that if you pay attention, you can watch it pass. You know your triggers now. You know your exits. You know your reasons. None of that goes away tomorrow. So keep the tools you've gained, keep counting the days, and be proud of this, properly proud. When you're ready for the next stretch, we'll go further together. Well done for laying the solid ground you get to stand on now, ready for the next part of your journey."},
]};
const LENGTHS = [180, 300, 600];
const PZ_MSGS = [
  "This wave is already changing.<br>Let it.",
  "A big wave is still just a wave.<br>It will settle.",
  "You do not have to act on this.<br>You can watch it pass.",
  "Notice where you feel it in your body,<br>and let it be.",
  "Unlike you, this wave<br>can't rise forever.",
  "You're not your craving.<br>You'll be here when it's gone.",
];
// stimulus control: moving away from the cue is the strongest single strategy, shown first
const MOVE_NUDGE = "If you can, take a few steps away from where you first felt the wave.";
const SUGGESTIONS = [
  {s:'drink water', i:'local_drink', l:'Water'},
  {s:'step outside', i:'park', l:'Step out'},
  {s:'take five breaths', i:'self_improvement', l:'Breathe'},
  {s:'call someone', i:'call', l:'Call'},
  {s:'go for a walk', i:'directions_walk', l:'Walk'},
  {s:'wait ten minutes', i:'schedule', l:'Wait'},
];
function sugChips(id){ return SUGGESTIONS.map(x=>`<button class="sugchip" data-a="plan-sug" data-id="${id}" data-s="${esc(x.s)}">${msvg(x.i,'ic16')}<span>${x.l}</span></button>`).join(''); }
function planItem(t){ return `<div class="planitem">
  <div class="planlabel">If I crave <b>${esc(t.label)}</b>, I'll…</div>
  <input class="planinput" type="text" data-plan="${t.id}" value="${esc(t.plan||'')}" maxlength="120" placeholder="e.g. drink water and step outside" autocomplete="off">
  <div class="sugrow">${sugChips(t.id)}</div>
</div>`; }
const PICK_ICONS = ['bolt','eco','menu_book','sports_esports','headphones','local_drink','cookie','laptop_mac','directions_run','bedtime','chat_bubble','shopping_cart','fitness_center','local_pizza','savings','mood','favorite'];

/* ============ storage ============ */
const KEY = 'pako-pause/v1';
const PERSIST = ['name','types','sessions','onboarded','pause','sound','theme','costPerDrink','currency','checkins','textScale','jStart','why','pattern','seenPractices'];
let storageOK = true;
function loadRaw(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ storageOK=false; return null; } }
function save(){ if(!storageOK)return; try{ const o={}; PERSIST.forEach(k=>o[k]=S[k]); localStorage.setItem(KEY,JSON.stringify(o)); }catch(e){ storageOK=false; } }

/* ============ state ============ */
function fresh(){
  return {
    view:'onboard', onboarded:false,
    name:'', types:TYPES_SEED.slice(), sessions:[],
    pause:null,            // active pause: {typeId,cause,s0,s1,len,endTime}
    draft:null,            // in-progress "begin" form
    sound:true,            // ambient sound, on by default; muting is remembered
    theme:null,            // 'light' | 'dark' (null = follow system)
    costPerDrink:null,     // what one drink costs, for money-saved (null = not set)
    currency:'₦',          // shown before the money-saved figure
    checkins:[],           // ISO dates the person tapped the daily check-in
    jStart:null,           // ISO date the 30-day journey began (null until first opened)
    why:'',                // the user's own reason, in their words; resurfaced during a wave and after
    pattern:'exhale',      // chosen breathing pattern for the wave (default: longer exhale)
    seenPractices:[],      // practice ids whose first-use explainer has been shown
    textScale:1,           // accessibility text size: 1, 1.15, or 1.3
  };
}
let S = fresh();
// Runtime-only: the sea settles to a fixed calm level after the first pause and stays there for the
// rest of the app session (resets on reopen). Declared here, before boot(), because boot() can call
// recordPause() for an already-expired pause, which assigns seaSettled — accessing it any later would
// be a temporal-dead-zone crash on open.
let seaSettled=false;
// boot() is defined here but invoked at the very end of the script (just before the first render),
// after every const/let helper it transitively uses (pad, iso, hm, recordPause, ...) has been
// initialized. Running it inline here would hit those lexical bindings in their temporal dead zone
// whenever the app opens onto an already-expired pause.
function boot(){
  const saved = loadRaw();
  if(saved){
    S = Object.assign(fresh(), saved);
    if(!S.types||!S.types.length) S.types = TYPES_SEED.slice();
    if(S.pause && S.pause.endTime){
      S.view = leftOf(S.pause.endTime) > 0 ? 'pause' : 'passed';
      if(leftOf(S.pause.endTime) <= 0){ recordPause('passed'); }
    } else {
      S.view = S.onboarded ? 'home' : 'onboard';
    }
  }
  if(!S.theme) S.theme = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  applyTheme(); save();
}
function applyTheme(){
  document.documentElement.classList.toggle('dark', S.theme==='dark');
  document.documentElement.style.setProperty('--fs', S.textScale||1);   // text-size accessibility scale
  // the status bar sits above the purple hero on the main screens, so keep it that purple in both themes;
  // Android then auto-picks light clock/battery icons that stay legible on it
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content', '#3c3158');
}

/* ============ helpers ============ */
const pad = n => String(n).padStart(2,'0');
const clock = s => `${Math.floor(s/60)}:${pad(s%60)}`;
function iso(d=new Date()){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function hm(d=new Date()){ return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function leftOf(end){ return end? Math.max(0, Math.ceil((end-Date.now())/1000)) : 0; }
function typeOf(id){ return S.types.find(t=>t.id===id); }
function planOf(id){ const t=typeOf(id); return t&&t.plan&&t.plan.trim() ? t.plan.trim() : ''; }
// the lines shown under the breathing ring: your own plan (if set), then the move nudge, then reassurance
function pauseLead(p){
  const lead=[]; const pl=planOf(p.typeId);
  if(pl) lead.push(`<span class="label planlead" style="display:block;margin-bottom:5px;color:var(--actx)">Your plan</span>${esc(pl)}`);
  lead.push(MOVE_NUDGE);
  return lead;
}
function pauseMsgAt(elapsed, lead){
  const L=16;                                   // seconds each lead line holds
  if(elapsed < lead.length*L){ const i=Math.floor(elapsed/L); return {k:'L'+i, html:lead[i]}; }
  const i=Math.floor((elapsed-lead.length*L)/18)%PZ_MSGS.length; return {k:'P'+i, html:PZ_MSGS[i]};
}
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function greet(){ const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':h<22?'Good evening':'You’re up late'; }
// true while the most recent thing that happened was a slip, within the last day or so
function recentSlip(){
  if(!S.sessions.length) return false;
  const last=S.sessions[0];
  if(last.outcome!=='acted') return false;
  const day=86400000, d=new Date(last.date+'T00:00:00');
  const n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return (today-d)/day<=1;
}
// the line under the greeting; softens for a day or two after a slip, then returns to the default
function heroSub(){
  // glue the closing phrase so the line breaks sooner and the last word is never left orphaned
  return recentSlip() ? 'A slip is one wave,<br>not the tide.' : 'Every craving passes<br>if you give it time.';
}
function partOfDay(h){ return h<5?'Night':h<12?'Morning':h<17?'Afternoon':h<22?'Evening':'Night'; }

function calmDays(){
  if(!S.sessions.length) return 0;
  const acted = S.sessions.filter(x=>x.outcome==='acted');
  const anchor = acted.length ? acted[0].date : S.sessions[S.sessions.length-1].date;
  const a = new Date(anchor+'T00:00:00');
  const n = new Date(); const mid = new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.max(0, Math.floor((mid-a)/86400000));
}
// longest steady run ever: the biggest gap between slips (and before the first / since the last).
// never resets on a slip, so it stands as proof of what you've done even after a setback.
function bestRun(){
  if(!S.sessions.length) return 0;
  const day=86400000, D=s=>new Date(s+'T00:00:00');
  const n=new Date(), today=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  const start=D(S.sessions[S.sessions.length-1].date);
  const slips=S.sessions.filter(x=>x.outcome==='acted').map(x=>D(x.date)).sort((a,b)=>a-b);
  if(!slips.length) return Math.max(0, Math.floor((today-start)/day));
  let best=Math.floor((slips[0]-start)/day);
  for(let i=1;i<slips.length;i++) best=Math.max(best, Math.floor((slips[i]-slips[i-1])/day));
  best=Math.max(best, Math.floor((today-slips[slips.length-1])/day));
  return Math.max(0,best);
}

/* ============ journey: one intention + one read per calendar day ============ */
function jStartEnsure(){ if(!S.jStart){ S.jStart=iso(); save(); } return S.jStart; }
function jRawDay(){ const s=S.jStart||iso(); const day=86400000, a=new Date(s+'T00:00:00'), n=new Date(), t=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.floor((t-a)/day)+1; }
function journeyDay(){ return Math.max(1, Math.min(JOURNEY_1.days.length, jRawDay())); }
function journeyOver(){ return !!S.jStart && jRawDay()>JOURNEY_1.days.length; }
function journeyEntry(d){ return JOURNEY_1.days[(d||journeyDay())-1]; }

/* ============ money saved & daily check-in ============ */
// money saved is an alcohol-specific idea (cost per drink), so it only applies to people tracking alcohol,
// and only counts alcohol waves let pass, so a passed sugar or phone craving never reads as a drink not bought
function tracksAlcohol(){ return S.types.some(t=>t.id==='drink'); }
function alcoholPassed(){ return S.sessions.filter(x=>x.type==='drink'&&x.outcome==='passed').length; }
function moneySaved(){ const c=+S.costPerDrink; return (c>0&&tracksAlcohol()) ? c*alcoholPassed() : 0; }
function fmtMoney(n){ return (S.currency||'₦')+Math.round(n).toLocaleString('en-US'); }
function checkedInToday(){ return Array.isArray(S.checkins) && S.checkins.indexOf(iso())>-1; }
// a once-a-day intention tap; the calm reason to open the app on a day with no craving
// journey reads can carry runtime tokens: {why} their reason, {thing} what they track,
// {money} an alcohol tracker's savings. Each expands with a graceful fallback so the prose
// still reads if the person hasn't set that detail.
// a few labels need a tidier in-sentence form (plurals break verb agreement, e.g. "cigarettes never delivers")
const THING_WORD_OVERRIDE = { smoke:'a cigarette' };
// which craving to name in the reads: their single focus, or the one they watch most if they track several
function focusType(){
  const t=S.types||[]; if(!t.length) return null; if(t.length===1) return t[0];
  const cnt={}; (S.sessions||[]).forEach(s=>{ if(s&&s.type) cnt[s.type]=(cnt[s.type]||0)+1; });
  let best=t[0], bc=-1; t.forEach(x=>{ const c=cnt[x.id]||0; if(c>bc){ bc=c; best=x; } }); return best;
}
function jThing(){ const ft=focusType(); if(!ft) return 'it'; return THING_WORD_OVERRIDE[ft.id] || (ft.label||'').trim().toLowerCase() || 'it'; }
function jWhyClause(){
  const w=(S.why||'').trim().replace(/[.!?]+$/,'');
  return w ? `You wrote yours down when you started: “${w}.” ` : '';
}
function jMoneyClause(){
  const m=moneySaved();
  return m>0 ? `You've kept about ${fmtMoney(m)} so far, money that would have gone on drinks. ` : '';
}
function jFill(str){
  if(!str) return str;
  return str.replace(/\{money\}/g, jMoneyClause).replace(/\{why\}/g, jWhyClause).replace(/\{thing\}/g, jThing);
}

function homeCheckin(){

      <button class="readlink" data-a="read-day" data-d="${last}"><span class="rt">Reread the last note</span><span class="rc">${IC.arrow}</span></button>

// a calm full-screen reader for one day's piece
let readDay=null;

// money kept aside; a subtle setup prompt once there's something to show, the figure once cost is set
function homeMoney(){
  if(!tracksAlcohol()) return '';
  const waves=alcoholPassed(), c=+S.costPerDrink;
  if(!(c>0)){
    if(waves<3) return '';
    return `<button class="moneystrip setup" data-a="nav" data-v="me"><span class="mi">${msvg('savings')}</span>
      <span class="mtx"><span class="t">See what you're saving</span><span class="s">Add what a drink costs you</span></span>
      <span class="mchev">${IC.arrow}</span></button>`;
  }
  return `<div class="moneystrip"><span class="mi">${msvg('savings')}</span>
    <span class="mtx"><span class="t">${fmtMoney(c*waves)} kept aside</span><span class="s">across ${waves} ${plu('wave',waves)} you let pass</span></span></div>`;
}
/* ============ milestones ============ */
const DAY_MARKS=[1,3,7,14,30,60,90,180,365];
const WAVE_MARKS=[1,10,25,50,100,250];
const MS_GRAD=[['#e58a5f','#c0392b'],['#8f83b3','#574a7d'],['#5b4f82','#372f4f'],['#eccb6a','#c6912a']];
function passedTotal(){ return S.sessions.filter(x=>x.outcome==='passed').length; }
function msTierDay(v){ return v<=7?0:v<=30?1:v<=90?2:3; }
function msTierWave(v){ return v<=10?0:v<=25?1:v<=50?2:3; }
function plu(u,n){ return n===1?u:u+'s'; }
// a milestone badge: a tiered wave-medallion. earned = filled + glow, next = progress ring, future = grey + lock.
function msMedal(v,unit,state,tier,size,frac){
  const c=MS_GRAD[tier], c1=c[0], c2=c[1], id='ms'+unit+v+state;
  const ulab=plu(unit,v).toUpperCase();

/* ============ hourly line: urges by time of day ============ */
function hourCounts(rows){
  const c=new Array(24).fill(0);
  rows.forEach(x=>{ let h=x.hour; if(h==null){ const t=(x.t||'').split(':'); h=t.length?+t[0]:12; } if(h>=0&&h<24) c[h]++; });
  return c;
}
function hourLine(rows){
  const raw=hourCounts(rows), k=[1,2,3,2,1];
  const sm=raw.map((_,i)=>{ let s=0,w=0; for(let j=-2;j<=2;j++){ const idx=i+j; if(idx>=0&&idx<24){ s+=raw[idx]*k[j+2]; w+=k[j+2]; } } return w?s/w:0; });
  const max=Math.max(0.0001,...sm), W=300,H=92,pad=6;
  const x=h=>pad+h/23*(W-2*pad), y=v=>H-15-(v/max)*(H-30);
  let line=''; for(let h=0;h<24;h++){ line+=(h?' L':'M')+x(h).toFixed(1)+','+y(sm[h]).toFixed(1); }
  const area=`M${x(0).toFixed(1)},${(H-15).toFixed(1)} `+sm.map((v,h)=>`L${x(h).toFixed(1)},${y(v).toFixed(1)}`).join(' ')+` L${x(23).toFixed(1)},${(H-15).toFixed(1)} Z`;
  let pk=0; for(let h=1;h<24;h++) if(sm[h]>sm[pk]) pk=h;
  const labs=[[0,'12am'],[6,'6am'],[12,'12pm'],[18,'6pm']].map(t=>`<text x="${x(t[0]).toFixed(1)}" y="${H-2}" font-size="9.5" fill="#9a93aa" font-family="Plus Jakarta Sans" text-anchor="${t[0]===0?'start':'middle'}">${t[1]}</text>`).join('');
  return `<svg class="hourline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="hlg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--purple)" stop-opacity="0.26"/><stop offset="100%" stop-color="var(--purple)" stop-opacity="0.02"/></linearGradient></defs>
    <path d="${area}" fill="url(#hlg)"/>
    <path d="${line}" fill="none" stroke="var(--purple)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${x(pk).toFixed(1)}" cy="${y(sm[pk]).toFixed(1)}" r="4.5" fill="var(--act)"/>
    ${labs}
  </svg>`;
}


function passRate(list){ list=list||S.sessions; if(!list.length)return 0;
  return Math.round(list.filter(x=>x.outcome==='passed').length / list.length * 100); }
function niceDate(d){
  const t=iso(); const y=iso(new Date(Date.now()-86400000));
  if(d===t)return'Today'; if(d===y)return'Yesterday';
  const dt=new Date(d+'T00:00:00');
  const diff=Math.floor((new Date(t)-dt)/86400000);
  const wk=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()];
  if(diff<7)return wk;
  const mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()];
  return `${mo} ${dt.getDate()}`;
}

/* records the active pause as a session */
function recordPause(outcome, via){
  const p=S.pause; if(!p) return;
  seaSettled=true;                        // the sea stays at its settled level for the rest of the session
  const elapsed = outcome==='passed' ? p.len : (p.len - leftOf(p.endTime));
  S.sessions.unshift({
    id:'s'+Date.now().toString(36),
    date:iso(), t:hm(), hour:new Date().getHours(),
    type:p.typeId, cause:p.cause||null,
    s0:p.s0, s1:(p.s1!=null?p.s1:p.s0),
    len:p.len, elapsed, outcome, via:via||'timer',   // 'tap' = they said it passed; 'timer' = the clock ran out
  });
  S.sessions = S.sessions.slice(0,200);
  S.pause = null;
  save();
}

function heroWavePath(W,H,surf,amp,t,spd,phase){
  const k=2*Math.PI/W*1.35;
  let d='';
  for(let x=0;x<=W;x+=12){ const y=(surf + Math.sin(x*k + t*spd + phase)*amp + Math.sin(x*k*2.1 - t*spd*1.4)*amp*0.4).toFixed(1); d+=(x?' L':'M')+x+','+y; }
  return `${d} L${W},${H} L0,${H} Z`;
}

}
